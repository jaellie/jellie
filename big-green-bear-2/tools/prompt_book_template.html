<title>Bear Prompt Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f2e8d4;--bg2:#ebdfc6;--card:#fbf5e8;--fg:#2a2a26;--mute:#6b6556;--line:#d3c4a2;--brass:#8a6a32;--brass-hi:#b08d57;--accent:#a8483f;--code-bg:#1b2431;--code-fg:#e9dfc8;--hdr:#243044;--hdr-fg:#f2e8d4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111923;--bg2:#17212e;--card:#1b2634;--fg:#e9dfc8;--mute:#9aa0a6;--line:#2f3d52;--brass:#d9c08a;--brass-hi:#b08d57;--accent:#e0786d;--code-bg:#0c121a;--code-fg:#e9dfc8;--hdr:#0c121a;--hdr-fg:#f2e8d4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111923;--bg2:#17212e;--card:#1b2634;--fg:#e9dfc8;--mute:#9aa0a6;--line:#2f3d52;--brass:#d9c08a;--brass-hi:#b08d57;--accent:#e0786d;--code-bg:#0c121a;--code-fg:#e9dfc8;--hdr:#0c121a;--hdr-fg:#f2e8d4;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 Figtree,system-ui,sans-serif;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:860px;margin:0 auto;min-width:0}
header{background:var(--hdr);color:var(--hdr-fg);margin:0 -16px;padding:28px 16px 0;position:relative;overflow:hidden;border-bottom:3px double var(--brass-hi)}
header .in{max-width:860px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;justify-content:space-between}
header .txt{padding-bottom:22px;min-width:0}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#d9c08a}
h1{font:700 clamp(26px,6vw,40px)/1.1 Fraunces,Georgia,serif;margin:6px 0 8px;text-wrap:balance}
header p{margin:0;color:#cfc6b0;max-width:46ch}
.stage{position:relative;flex:none;width:150px;height:180px}
.bear{position:absolute;left:50%;bottom:0;height:170px;transform-origin:50% 100%;animation:idle 4.2s ease-in-out infinite;translate:-50% 0}
@keyframes idle{0%,100%{transform:scale(1,1) rotate(-.6deg)}50%{transform:scale(1.012,1.022) rotate(.6deg)}}
.clock{position:absolute;right:-6px;top:0;width:56px;opacity:.9}
.clock .h{transform-origin:50px 50px;animation:none}
.floor{position:absolute;left:10%;right:10%;bottom:0;height:3px;background:var(--brass-hi);opacity:.5}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
[role=tablist]{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
[role=tab]{flex:none;font:600 14px Figtree,sans-serif;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:6px 6px 0 0;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:background .2s,color .2s,transform .2s}
[role=tab]:hover{transform:translateY(-1px);color:var(--fg)}
[role=tab] span{font-size:11px;background:var(--bg2);border-radius:99px;padding:1px 7px}
[role=tab][aria-selected=true]{background:var(--card);color:var(--fg);border-bottom-color:var(--card);box-shadow:inset 0 3px 0 var(--brass-hi)}
#q{width:100%;margin-top:10px;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
#q:focus{outline:2px solid var(--brass-hi)}
.pane{display:none}.pane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:16px}
.chips a{max-width:100%;white-space:normal;font-size:12.5px;color:var(--brass);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--card);transition:transform .15s,border-color .15s}
.chips a:hover{border-color:var(--brass-hi);transform:translateY(-1px)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 8px;margin-block:0 16px;scroll-margin-top:130px;animation:rise .5s both;animation-delay:calc(var(--i)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec.hide{display:none}
h2{font:700 21px/1.25 Fraunces,Georgia,serif;margin:0;color:var(--fg);text-wrap:balance}
.tg{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;cursor:pointer;padding:2px 0 12px;font:inherit}
.tg:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px;border-radius:6px}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--brass);border-bottom:2px solid var(--brass);transform:rotate(-45deg);transition:transform .25s}
.sec.open .chev{transform:rotate(45deg)}
.tt{flex:1;min-width:0}
.pg{flex:none;font:600 12px Figtree,sans-serif;color:var(--mute);background:var(--bg2);border-radius:99px;padding:2px 9px;display:none}
.pg.has{display:inline-block}
.pg.all{background:#7fb38a;color:#10200f}
.sec .bd{display:none;border-top:1px solid var(--line);padding-top:12px;margin-bottom:8px}
.sec.open .bd{display:block}
.sec.open .tg{padding-bottom:10px}
li[data-ids]{list-style:none;position:relative;padding-left:30px;margin-left:-22px}
li[data-ids] .mk{position:absolute;left:0;top:3px}
.mk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:500 12px Figtree,sans-serif}
.mk input{appearance:none;-webkit-appearance:none;margin:0;width:18px;height:18px;border:2px solid var(--brass);border-radius:5px;background:var(--card);cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .15s}
.mk input:hover{transform:scale(1.1)}
.mk input:checked{background:#7fb38a;border-color:#5d9a6a}
.mk input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #10200f;border-bottom:2px solid #10200f;transform:rotate(-45deg) translate(1px,-1px)}
.mk input:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
li.done,tr.done{opacity:.55}
.cp{font:600 11.5px Figtree,sans-serif;color:#1b1b17;background:var(--brass-hi);border:0;border-radius:6px;padding:3px 9px;margin-left:8px;cursor:pointer;vertical-align:middle;white-space:nowrap}
.cp:hover{transform:scale(1.05)}
.cp.ok{background:#7fb38a}
td .cp{margin:0 0 0 6px}
.chipset{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px}
.chipset .mk{position:static;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 6px;background:var(--bg2);font:12px 'JetBrains Mono',monospace}
.chipset .mk.done{opacity:.55;text-decoration:line-through}
td .mk{margin-right:8px;vertical-align:middle}
.tools .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tools .row #q{margin-top:0;flex:1 1 220px;min-width:0;width:auto}
.btn{font:600 13px Figtree,sans-serif;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--brass-hi)}
#sum{font:600 13px Figtree,sans-serif;color:var(--hdr-fg);margin-top:8px}
#sum b{color:#d9c08a}
#note{font-size:12.5px;color:var(--mute);margin-top:6px;min-height:1em}
#bar{height:5px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:6px;max-width:260px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#7fb38a;transition:width .4s}
h3,h4{font:600 16px/1.3 Figtree,sans-serif;margin:18px 0 6px;color:var(--brass)}
p,li{max-width:70ch}
ul,ol{padding-left:22px}
code{font:13px 'JetBrains Mono',ui-monospace,monospace;background:var(--bg2);padding:1px 5px;border-radius:4px}
.note{border-left:3px solid var(--accent);background:var(--bg2);padding:10px 14px;border-radius:0 8px 8px 0;margin-block:0 16px}
.prompt{position:relative;margin-block:10px 14px}
.prompt pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:16px 14px 14px;font:12.5px/1.65 'JetBrains Mono',ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;border:1px solid var(--line)}
.copy{position:absolute;top:8px;right:10px;z-index:1;font:600 12px Figtree,sans-serif;background:var(--brass-hi);color:#1b1b17;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;transition:transform .15s,background .2s}
.copy:hover{transform:scale(1.05)}
.copy.ok{background:#7fb38a;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}
.tbl{overflow-x:auto;margin-block:10px 16px}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:7px 10px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#empty{display:none;text-align:center;color:var(--mute);padding:40px 0}
@media (max-width:520px){.stage{width:110px;height:140px}.bear{height:130px}.clock{width:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header><div class="in">
 <div class="txt"><div class="kicker">Case file · Season 2</div><h1>Bear Prompt Book</h1><p>Every character, UI kit, animation and Grok video prompt in one place. Tap Copy, paste into Grok, GPT or Gemini. Tick what you have made.</p><div id="sum">Made <b id="sn">0</b> / <b id="st">0</b></div><div id="bar"><i></i></div></div>
 <div class="stage"><svg class="clock" viewBox="0 0 100 100" aria-label="Clock stopped at 11:47"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08d57" stroke-width="4"/><circle cx="50" cy="50" r="40" fill="#f2e8d4" opacity=".12"/><g stroke="#d9c08a" stroke-width="3" stroke-linecap="round"><path d="M50 10v6M50 84v6M10 50h6M84 50h6"/></g><path d="M50 50 L48 28" stroke="#f2e8d4" stroke-width="5" stroke-linecap="round"/><path d="M50 50 L14 42" stroke="#f2e8d4" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#a8483f"/></svg><div class="floor"></div><img class="bear" src="{{BEAR}}" alt="Big Green Bear"></div>
</div></header>
<div class="wrap">
 <div class="tools"><div role="tablist">{{TABS}}</div><div class="row"><input id="q" type="search" placeholder="Search (e.g. wave, button, Nini, loop)" aria-label="Search"><button class="btn" id="ex" type="button">Expand all</button><button class="btn" id="co" type="button">Collapse all</button></div><div id="note"></div></div>
 {{PANES}}
 <div id="empty">No section matches that search.</div>
</div>
<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var tabs=$$('[role=tab]'),panes=$$('.pane'),q=$('#q'),note=$('#note');
var done={},store=null,LS='bpb-made',OPENLS='bpb-open';
/* ---- local fallback (per-device) ---- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* ---- build checkboxes ---- */
function key(el){return el.closest('.pane').id.replace('pane-','')+'--'+el.id}
$$('[data-ids]').forEach(function(el){
  var pane=el.closest('.pane').id.replace('pane-',''),ids=el.dataset.ids.split(' ').filter(Boolean);
  function mk(id,lab){var l=document.createElement('label');l.className='mk';l.dataset.k=pane+'--'+id;var c=document.createElement('input');c.type='checkbox';c.setAttribute('aria-label','Made: '+id);l.appendChild(c);if(lab){var s=document.createElement('span');s.textContent=lab;l.appendChild(s)}return l}
  if(ids.length===1){var m=mk(ids[0]);if(el.tagName==='TR'){el.cells[0].insertBefore(m,el.cells[0].firstChild)}else{el.insertBefore(m,el.firstChild)}el.dataset.k=pane+'--'+ids[0]}
  else{var cs=document.createElement('div');cs.className='chipset';ids.forEach(function(id){cs.appendChild(mk(id,id))});el.appendChild(cs)}
});
function keys(el){return el.dataset.ids.split(' ').filter(Boolean).map(function(id){return el.closest('.pane').id.replace('pane-','')+'--'+id})}
/* ---- render state ---- */
function render(){
  $$('.mk').forEach(function(l){var d=!!done[l.dataset.k];$('input',l).checked=d;l.classList.toggle('done',d)});
  $$('li[data-ids],tr[data-ids]').forEach(function(el){var ks=keys(el);el.classList.toggle('done',ks.length===1&&!!done[ks[0]])});
  var tot=0,dn=0;
  panes.forEach(function(p){var pt=0,pd=0;
    $$('.sec',p).forEach(function(s){var ks=[];$$('[data-ids]',s).forEach(function(el){keys(el).forEach(function(k){ks.push(k)})});var d=ks.filter(function(k){return done[k]}).length,b=$('.pg',s);
      if(ks.length){b.textContent=d+' / '+ks.length;b.classList.add('has');b.classList.toggle('all',d===ks.length)}else b.classList.remove('has','all');pt+=ks.length;pd+=d});
    var t=$('[data-p='+p.id.replace('pane-','')+'] span');if(t)t.textContent=pt?pd+'/'+pt:'';tot+=pt;dn+=pd});
  $('#sn').textContent=dn;$('#st').textContent=tot;$('#bar i').style.width=(tot?dn/tot*100:0)+'%';
}
/* ---- toggle one item ---- */
var busy={};
function toggle(k,val){
  if(busy[k])return;busy[k]=1;
  var prev=!!done[k];if(val)done[k]=true;else delete done[k];render();
  var finish=function(){busy[k]=0};
  if(store){
    var ref=store.doc('made/'+k),p=val?ref.set({done:true,at:Date.now()}):ref.delete();
    p.then(finish,function(){finish();lsSet(LS,done);say('Could not reach the shared list. Saved on this device only.')});
  }else{lsSet(LS,done);finish();say('Saved on this device only (shared saving is not available here).')}
}
function say(m){note.textContent=m;clearTimeout(say.t);say.t=setTimeout(function(){note.textContent=''},4000)}
document.addEventListener('change',function(e){var l=e.target.closest&&e.target.closest('.mk');if(!l||e.target.type!=='checkbox')return;toggle(l.dataset.k,e.target.checked)});
/* ---- shared db (when granted), else local ---- */
done=lsGet(LS);render();
if(window.claude&&claude.use){claude.use('db').then(function(db){
  if(!db)return;store=db;
  db.collection('made').onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){if(d.exists)m[d.id]=true});
    Object.keys(busy).forEach(function(k){if(busy[k]){if(done[k])m[k]=true;else delete m[k]}});done=m;render()},function(){store=null;say('Shared saving is not available. Using this device only.')});
},function(){})}
/* ---- tabs ---- */
function show(id){tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===id)});panes.forEach(function(p){p.classList.toggle('on',p.id==='pane-'+id)});try{localStorage.setItem('bpb-tab2',id)}catch(e){}filter()}
tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p)})});
/* ---- collapse ---- */
var openSet={};try{openSet=JSON.parse(localStorage.getItem(OPENLS)||'{}')}catch(e){}
function setOpen(s,o,save){s.classList.toggle('open',o);$('.tg',s).setAttribute('aria-expanded',o);openSet[s.id]=o?1:0;if(save!==false)try{localStorage.setItem(OPENLS,JSON.stringify(openSet))}catch(e){}}
$$('.sec').forEach(function(s){setOpen(s,!!openSet[s.id],false);$('.tg',s).addEventListener('click',function(){setOpen(s,!s.classList.contains('open'))})});
$('#ex').addEventListener('click',function(){$$('.pane.on .sec').forEach(function(s){setOpen(s,true)})});
$('#co').addEventListener('click',function(){$$('.pane.on .sec').forEach(function(s){setOpen(s,false)})});
$$('.chips a').forEach(function(a){a.addEventListener('click',function(e){var s=document.getElementById(a.getAttribute('href').slice(1));if(s){e.preventDefault();setOpen(s,true);s.scrollIntoView({behavior:'smooth'})}})});
/* ---- search (opens matches) ---- */
function filter(){var v=q.value.trim().toLowerCase(),any=false,p=$('.pane.on');if(!p)return;
  $$('.sec',p).forEach(function(s){var m=!v||s.textContent.toLowerCase().indexOf(v)>-1;s.classList.toggle('hide',!m);if(m)any=true;if(v&&m)s.classList.add('open')});
  if(!v)$$('.sec',p).forEach(function(s){s.classList.toggle('open',!!openSet[s.id])});
  $('#empty').style.display=any?'none':'block'}
q.addEventListener('input',filter);
/* ---- composed prompts: one button = everything for one image ---- */
function firstPre(secPrefix,pane){var s=$$('#pane-'+pane+' .sec').filter(function(x){return x.id.indexOf(secPrefix)===0})[0];return s?$('pre',s).textContent.trim():''}
var STYLE=firstPre('chars-a-','chars'),STAMPSTYLE=firstPre('stamp-2-','stamp');
function liText(li){var c=li.cloneNode(true);$$('.mk,.cp,.chipset',c).forEach(function(n){n.remove()});return c.textContent.trim()}
function addBtn(host,label,fn){var b=document.createElement('button');b.type='button';b.className='cp';b.textContent=label;b.addEventListener('click',function(){copyText(fn(),b,label)});host.appendChild(b)}
function copyText(txt,b,label){
  function ok(){b.textContent='Copied';b.classList.add('ok');setTimeout(function(){b.textContent=label;b.classList.remove('ok')},1400)}
  function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){b.textContent='Select + copy failed'}ta.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb)}else fb()}
$$('#pane-chars .sec').forEach(function(s){
  if(!/^chars-(b|c|d|h)-/.test(s.id))return;
  var char='';
  $$('.prompt,li[data-ids]',s).forEach(function(n){
    if(n.classList.contains('prompt')){char=$('pre',n).textContent.trim();return}
    var id=n.dataset.ids;if(id.indexOf(' ')>-1||!char)return;
    var bear=/^chars-b-/.test(s.id),front=/front_neutral$/.test(id);
    var view=front?'true FRONT view, facing the camera, symmetrical stance, both ears visible.':'three-quarter view turned toward the '+(bear?'LEFT':'RIGHT')+' side of the image, about 35 degrees (match the attached turnaround reference).';
    (function(n,char,view){addBtn(n,'Copy full prompt',function(){return STYLE+'\n\n'+char+'\n\nPOSE: '+liText(n)+'\n\nVIEW: '+view})})(n,char,view)
  })
});
var TB={bear:'chars-b-',nini:'chars-c-',edward:'chars-d-'};
function charBlock(id){var n=id.replace('turn_','');
  if(TB[n]){var s=$$('#pane-chars .sec').filter(function(x){return x.id.indexOf(TB[n])===0})[0];return s?$('pre',s).textContent.trim():''}
  var h=$$('#pane-chars .sec').filter(function(x){return x.id.indexOf('chars-h-')===0})[0];if(!h)return '';
  var pres=$$('.prompt pre',h),i={clockkeeper:0,cafe:1,tommy:2}[n];return pres[i]?pres[i].textContent.trim():''}
var SHEET=firstPre('turn-2-','turn');
$$('#pane-turn tr[data-ids]').forEach(function(tr){var id=tr.dataset.ids;
  addBtn(tr.cells[0],'Copy full prompt',function(){return STYLE+'\n\n'+charBlock(id)+'\n\n'+SHEET+'\n\nASYMMETRIC DETAILS (keep on the same side of the character\'s OWN body in every view): '+tr.cells[2].textContent.trim()+'.'})});
var RING=($$('#pane-stamp .prompt pre').filter(function(p){return p.textContent.indexOf('stamp_case_open_ko')>-1})[0]||{textContent:''}).textContent.trim();
$$('#pane-stamp tr[data-ids]').forEach(function(tr){
  var id=tr.dataset.ids,c=tr.cells,en=c[1]?c[1].textContent.trim():'',ko=c[2]?c[2].textContent.trim():'',host=c[0];
  var ring=id==='stamp_case_open';
  addBtn(host,'EN',function(){return STAMPSTYLE+'\n\n'+(ring?'ELEMENT: '+id+'. A double circle ring stamp 900x900 px (outer ring 6 px, inner ring 3 px, gap 8 px). The English text "THE CASE DOES" curves along the upper inside arc and "NOT CLOSE" along the lower inside arc, with a small five-point star in the center. Nothing else.':'ELEMENT: '+id+'. The stamp contains exactly one line of text: "'+en+'". Nothing else inside the border.')});
  addBtn(host,'KO',function(){return STAMPSTYLE+'\n\n'+(ring?RING:'ELEMENT: '+id+'_ko. The stamp contains exactly one line of Korean text: "'+ko+'". The text is Korean Hangul, written exactly as given, in a heavy bold serif or gothic brush-cut style, each syllable block clear and fully spelled, no extra strokes, no mixed-up vowels. Do not translate or add any other words. Nothing else inside the border.')})
});
/* ---- copy ---- */
document.addEventListener('click',function(e){var b=e.target.closest('.copy');if(!b)return;var t=b.parentNode.querySelector('pre').textContent;
 function ok(){b.textContent='Copied';b.classList.add('ok');setTimeout(function(){b.textContent='Copy';b.classList.remove('ok')},1400)}
 function fb(){var r=document.createRange();r.selectNodeContents(b.parentNode.querySelector('pre'));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected, press Copy'}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else fb()});
var start='stamp';try{start=localStorage.getItem('bpb-tab2')||start}catch(e){}
var h=location.hash.slice(1);if(h){var el=document.getElementById(h);if(el){var pp=el.closest('.pane');if(pp){start=pp.id.replace('pane-','');var sec=el.classList&&el.classList.contains('sec')?el:el.closest('.sec');if(sec)setOpen(sec,true)}}}
show(start);
})();
</script>
