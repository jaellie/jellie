<title>Bear Prompt Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f2e8d4;--bg2:#ebdfc6;--card:#fbf5e8;--fg:#2a2a26;--mute:#6b6556;--line:#d3c4a2;--brass:#8a6a32;--brass-hi:#b08d57;--accent:#a8483f;--code-bg:#1b2431;--code-fg:#e9dfc8;--hdr:#243044;--hdr-fg:#f2e8d4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111923;--bg2:#17212e;--card:#1b2634;--fg:#e9dfc8;--mute:#9aa0a6;--line:#2f3d52;--brass:#d9c08a;--brass-hi:#b08d57;--accent:#e0786d;--code-bg:#0c121a;--code-fg:#e9dfc8;--hdr:#0c121a;--hdr-fg:#f2e8d4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111923;--bg2:#17212e;--card:#1b2634;--fg:#e9dfc8;--mute:#9aa0a6;--line:#2f3d52;--brass:#d9c08a;--brass-hi:#b08d57;--accent:#e0786d;--code-bg:#0c121a;--code-fg:#e9dfc8;--hdr:#0c121a;--hdr-fg:#f2e8d4;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 Figtree,system-ui,sans-serif;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:860px;margin:0 auto;min-width:0}
header{background:var(--hdr);color:var(--hdr-fg);margin:0 -16px;padding:28px 16px 0;position:relative;overflow:hidden;border-bottom:3px double var(--brass-hi)}
header .in{max-width:860px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;justify-content:space-between}
header .txt{padding-bottom:22px;min-width:0}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#d9c08a}
h1{font:700 clamp(26px,6vw,40px)/1.1 Fraunces,Georgia,serif;margin:6px 0 8px;text-wrap:balance}
header p{margin:0;color:#cfc6b0;max-width:46ch}
.stage{position:relative;flex:none;width:150px;height:180px}
.bear{position:absolute;left:50%;bottom:0;height:170px;transform-origin:50% 100%;animation:idle 4.2s ease-in-out infinite;translate:-50% 0}
@keyframes idle{0%,100%{transform:scale(1,1) rotate(-.6deg)}50%{transform:scale(1.012,1.022) rotate(.6deg)}}
.clock{position:absolute;right:-6px;top:0;width:56px;opacity:.9}
.clock .h{transform-origin:50px 50px;animation:none}
.floor{position:absolute;left:10%;right:10%;bottom:0;height:3px;background:var(--brass-hi);opacity:.5}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
[role=tablist]{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
[role=tab]{flex:none;font:600 14px Figtree,sans-serif;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:6px 6px 0 0;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:background .2s,color .2s,transform .2s}
[role=tab]:hover{transform:translateY(-1px);color:var(--fg)}
[role=tab] span{font-size:11px;background:var(--bg2);border-radius:99px;padding:1px 7px}
[role=tab][aria-selected=true]{background:var(--card);color:var(--fg);border-bottom-color:var(--card);box-shadow:inset 0 3px 0 var(--brass-hi)}
#q{width:100%;margin-top:10px;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
#q:focus{outline:2px solid var(--brass-hi)}
.pane{display:none}.pane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:16px}
.chips a{max-width:100%;white-space:normal;font-size:12.5px;color:var(--brass);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--card);transition:transform .15s,border-color .15s}
.chips a:hover{border-color:var(--brass-hi);transform:translateY(-1px)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 8px;margin-block:0 16px;scroll-margin-top:130px;animation:rise .5s both;animation-delay:calc(var(--i)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec.hide{display:none}
h2{font:700 21px/1.25 Fraunces,Georgia,serif;margin:0 0 10px;color:var(--fg);text-wrap:balance;padding-bottom:8px;border-bottom:1px solid var(--line)}
h3,h4{font:600 16px/1.3 Figtree,sans-serif;margin:18px 0 6px;color:var(--brass)}
p,li{max-width:70ch}
ul,ol{padding-left:22px}
code{font:13px 'JetBrains Mono',ui-monospace,monospace;background:var(--bg2);padding:1px 5px;border-radius:4px}
.note{border-left:3px solid var(--accent);background:var(--bg2);padding:10px 14px;border-radius:0 8px 8px 0;margin-block:0 16px}
.prompt{position:relative;margin-block:10px 14px}
.prompt pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:16px 14px 14px;font:12.5px/1.65 'JetBrains Mono',ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;border:1px solid var(--line)}
.copy{position:absolute;top:8px;right:10px;z-index:1;font:600 12px Figtree,sans-serif;background:var(--brass-hi);color:#1b1b17;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;transition:transform .15s,background .2s}
.copy:hover{transform:scale(1.05)}
.copy.ok{background:#7fb38a;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}
.tbl{overflow-x:auto;margin-block:10px 16px}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:7px 10px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#empty{display:none;text-align:center;color:var(--mute);padding:40px 0}
@media (max-width:520px){.stage{width:110px;height:140px}.bear{height:130px}.clock{width:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header><div class="in">
 <div class="txt"><div class="kicker">Case file · Season 2</div><h1>Bear Prompt Book</h1><p>Every character, UI kit, animation and Grok video prompt in one place. Tap Copy, paste into Grok, GPT or Gemini.</p></div>
 <div class="stage"><svg class="clock" viewBox="0 0 100 100" aria-label="Clock stopped at 11:47"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08d57" stroke-width="4"/><circle cx="50" cy="50" r="40" fill="#f2e8d4" opacity=".12"/><g stroke="#d9c08a" stroke-width="3" stroke-linecap="round"><path d="M50 10v6M50 84v6M10 50h6M84 50h6"/></g><path d="M50 50 L48 28" stroke="#f2e8d4" stroke-width="5" stroke-linecap="round"/><path d="M50 50 L14 42" stroke="#f2e8d4" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#a8483f"/></svg><div class="floor"></div><img class="bear" src="{{BEAR}}" alt="Big Green Bear"></div>
</div></header>
<div class="wrap">
 <div class="tools"><div role="tablist">{{TABS}}</div><input id="q" type="search" placeholder="Search prompts (e.g. wave, button, Nini, loop)" aria-label="Search"></div>
 {{PANES}}
 <div id="empty">No section matches that search.</div>
</div>
<script>
(function(){
var tabs=[].slice.call(document.querySelectorAll('[role=tab]')),panes=[].slice.call(document.querySelectorAll('.pane')),q=document.getElementById('q');
function show(id){tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===id)});panes.forEach(function(p){p.classList.toggle('on',p.id==='pane-'+id)});try{localStorage.setItem('bpb-tab',id)}catch(e){}filter()}
tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p)})});
function filter(){var v=q.value.trim().toLowerCase(),any=false;var p=document.querySelector('.pane.on');if(!p)return;[].forEach.call(p.querySelectorAll('.sec'),function(s){var m=!v||s.textContent.toLowerCase().indexOf(v)>-1;s.classList.toggle('hide',!m);if(m)any=true});document.getElementById('empty').style.display=any?'none':'block'}
q.addEventListener('input',filter);
document.addEventListener('click',function(e){var b=e.target.closest('.copy');if(!b)return;var t=b.parentNode.querySelector('pre').textContent;
 function done(){b.textContent='Copied';b.classList.add('ok');setTimeout(function(){b.textContent='Copy';b.classList.remove('ok')},1400)}
 function fb(){var r=document.createRange();r.selectNodeContents(b.parentNode.querySelector('pre'));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected, press Copy'}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()});
var start='chars';try{start=localStorage.getItem('bpb-tab')||start}catch(e){}
var h=location.hash.slice(1);if(h){var el=document.getElementById(h);if(el){var pp=el.closest('.pane');if(pp)start=pp.id.replace('pane-','')}}
show(start);
})();
</script>
