name: Moa 구매요청 집계

# GitHub 웹사이트 Actions 탭에서 버튼으로 실행 (Python 설치 불필요)
on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "디스코드 채널 ID (비우면 저장소 변수 MOA_CHANNEL_ID 사용)"
        required: false
      since:
        description: "시작 날짜 YYYY-MM-DD (비우면 전체)"
        required: false
      until:
        description: "끝 날짜 YYYY-MM-DD, 당일 포함 (비우면 오늘까지)"
        required: false
      post:
        description: "결과 엑셀을 디스코드 채널에 올리기"
        type: boolean
        default: true
      mask_names:
        description: "이름 가리기 (김*수)"
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: purchase-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl

      - name: Collect
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id || vars.MOA_CHANNEL_ID }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          POST: ${{ inputs.post }}
          MASK: ${{ inputs.mask_names }}
        run: |
          if [ -z "$CHANNEL_ID" ]; then
            echo "채널 ID가 없습니다. 실행할 때 입력하거나 저장소 변수 MOA_CHANNEL_ID를 등록하세요."; exit 1
          fi
          args=(--discord "$CHANNEL_ID" -o "구매요청_$(TZ=Asia/Seoul date +%Y%m%d).xlsx")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          [ "$POST" = "true" ] && args+=(--post)
          [ "$MASK" = "true" ] && args+=(--mask-names)
          python -m purchase_collector "${args[@]}"

      # 디스코드에 안 올렸을 때도 Actions 화면에서 내려받을 수 있게
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 구매요청
          path: purchase-collector/구매요청_*.xlsx
          if-no-files-found: ignore
          retention-days: 7
