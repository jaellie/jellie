# Publishes the web build (web/) to the gh-pages branch on every push.
# GitHub Pages serves that branch (Settings → Pages → Deploy from a branch → gh-pages / root).
name: Deploy web game to GitHub Pages

on:
  push:
    branches: [main, claude/great-fermat-fq0udu]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip build helpers
        run: rm -f web/build-sw.mjs web/head.html && touch web/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy web game"
