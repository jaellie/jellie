name: Blueberry

# 매일 밤 자동 실행
#   - 구매요청 채널: 최근 7일 요청을 엑셀로 집계, 지난 24시간 동안 새 요청이 있을 때만 업로드
#   - 릴스 채널: 지난번 정리 이후 새 영상 링크를 #태그별 메시지로 정리 (새 링크가 없으면 안 보냄)
# Actions 탭의 Run workflow 버튼으로 직접 실행할 수도 있음
on:
  schedule:
    - cron: "57 11 * * *"   # 매일 20:57 KST (GitHub은 UTC 기준). 혼잡하면 몇 분~수십 분 늦을 수 있음
  workflow_dispatch:
    inputs:
      mode:
        description: "무엇을 실행할까요?"
        type: choice
        options: [purchase, reels]
        default: purchase
      channel_id:
        description: "디스코드 채널 ID (비우면 저장소 변수 사용)"
        required: false
      since:
        description: "(구매요청) 시작 날짜 YYYY-MM-DD (비우면 전체)"
        required: false
      until:
        description: "(구매요청) 끝 날짜 YYYY-MM-DD, 당일 포함"
        required: false
      post:
        description: "디스코드에 올리기"
        type: boolean
        default: true
      mask_names:
        description: "(구매요청) 이름 가리기 (김*수)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: purchase-collector

jobs:
  purchase:
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'purchase' }}
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      CHANNEL_ID: ${{ inputs.channel_id || vars.BLUEBERRY_PURCHASE_CHANNEL_ID || vars.MOA_CHANNEL_ID }}
      SCHEDULED: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl

      - name: Collect purchase requests
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          POST: ${{ inputs.post }}
          MASK: ${{ inputs.mask_names }}
        run: |
          if [ -z "$CHANNEL_ID" ]; then
            if [ "$SCHEDULED" = "true" ]; then echo "구매요청 채널이 설정되지 않아 건너뜁니다."; exit 0; fi
            echo "채널 ID가 없습니다. 실행할 때 입력하거나 저장소 변수 BLUEBERRY_PURCHASE_CHANNEL_ID를 등록하세요."; exit 1
          fi
          args=(--discord "$CHANNEL_ID" -o "구매요청_$(TZ=Asia/Seoul date +%Y%m%d).xlsx")
          if [ "$SCHEDULED" = "true" ]; then
            args+=(--last-days 7 --only-if-new 24 --post)
          else
            [ -n "$SINCE" ] && args+=(--since "$SINCE")
            [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
            [ "$POST" = "true" ] && args+=(--post)
            [ "$MASK" = "true" ] && args+=(--mask-names)
          fi
          python -m purchase_collector "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 구매요청
          path: purchase-collector/구매요청_*.xlsx
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify failure on Discord
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.post) }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ../.github/scripts/notify-failure.sh "구매요청 집계"

  reels:
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'reels' }}
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      CHANNEL_ID: ${{ inputs.channel_id || vars.BLUEBERRY_REELS_CHANNEL_ID }}
      SCHEDULED: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Summarize new reels
        env:
          POST: ${{ inputs.post }}
        run: |
          if [ -z "$CHANNEL_ID" ]; then
            if [ "$SCHEDULED" = "true" ]; then echo "릴스 채널이 설정되지 않아 건너뜁니다."; exit 0; fi
            echo "채널 ID가 없습니다. 실행할 때 입력하거나 저장소 변수 BLUEBERRY_REELS_CHANNEL_ID를 등록하세요."; exit 1
          fi
          args=(--mode reels --discord "$CHANNEL_ID")
          if [ "$SCHEDULED" = "true" ] || [ "$POST" = "true" ]; then args+=(--post); fi
          python -m purchase_collector "${args[@]}"

      - name: Notify failure on Discord
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.post) }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ../.github/scripts/notify-failure.sh "릴스 정리"
