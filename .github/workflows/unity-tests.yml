# Compiles the Unity project, runs its EditMode + PlayMode tests and builds an Android APK with GameCI.
#
# Required repository secrets (Unity Personal seat):
#   UNITY_EMAIL     email of a Unity account dedicated to CI (a Unity ID login, not Google/Apple sign-in)
#   UNITY_PASSWORD  its password (the account must not use two-factor authentication)
# No license file: game-ci/cli v0.1.72 (what unity-test-runner v4.4.0 and unity-builder v6.0.0 run)
# activates Personal seats with the account ("personal" method) and returns the seat at the end of
# each step. A Personal .ulf is machine-bound and fails in CI containers ("Machine bindings don't
# match"). Without the secrets the job prints a notice and skips Unity.
#
# Steps run one after another in a single job, so only one Personal seat is in use at a time:
#   1. Configure  - CIEntryPoints.Configure: project settings + generated test scene (uploaded as an artifact)
#   2. Tests      - EditMode + PlayMode (results check, logs, screenshots)
#   3. Android    - CIEntryPoints.BuildAndroid: debug-signed APK (artifact)
#
# Safety: runs only on pushes to the development branch and manual dispatch (never on
# pull_request_target / forks); third-party actions are pinned to commit SHAs; the token
# can only read the repo and write the test-results check.
name: Unity CI

on:
  push:
    branches: [ccr-21c0ed33-uzs8xd]
    paths:
      - 'DrivingPracticeSimulator/**'
      - '.github/workflows/unity-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  # One run at a time: a Personal account has very few seats.
  group: unity-ci
  cancel-in-progress: true

env:
  PROJECT_PATH: DrivingPracticeSimulator

jobs:
  unity:
    name: Configure, test and build (Unity 6000.0.85f1)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check Unity secrets
        id: secrets
        env:
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          if [ "$HAS_EMAIL" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity secrets are not configured (UNITY_EMAIL, UNITY_PASSWORD). Skipping Unity compile, tests and build."
          fi

      - name: Free disk space (Android images are large)
        if: steps.secrets.outputs.configured == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Library
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: DrivingPracticeSimulator/Library
          key: Library-6000.0.85f1-${{ hashFiles('DrivingPracticeSimulator/Packages/manifest.json', 'DrivingPracticeSimulator/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-6000.0.85f1-

      # 1. Compile + project settings + generated scene. Also the first compile check.
      - name: Configure project and generate test scene
        id: configure
        if: steps.secrets.outputs.configured == 'true'
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Unity version comes from ProjectSettings/ProjectVersion.txt (6000.0.85f1).
          projectPath: ${{ env.PROJECT_PATH }}
          cliVersion: v0.1.72
          targetPlatform: StandaloneLinux64
          buildMethod: DrivingSim.EditorTools.CIEntryPoints.Configure
          buildName: configure
          versioning: Custom
          version: 0.1.0
          allowDirtyBuild: true

      - name: Upload generated project files
        if: always() && steps.configure.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-project-files
          path: |
            DrivingPracticeSimulator/ProjectSettings
            DrivingPracticeSimulator/Assets/DrivingSim/Scenes
            DrivingPracticeSimulator/Assets/DrivingSim/Settings
            DrivingPracticeSimulator/Assets/DrivingSim/Generated
            build/StandaloneLinux64/configure.txt
          if-no-files-found: warn

      # 2. Automated tests.
      - name: Run EditMode and PlayMode tests
        id: tests
        if: steps.configure.outcome == 'success'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          cliVersion: v0.1.72
          testMode: all
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - name: Upload test results, logs and screenshots
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-test-results
          path: |
            test-artifacts
            DrivingPracticeSimulator/TestScreenshots
          if-no-files-found: warn

      # 3. Android APK (built even when some tests fail, as long as the project compiled).
      - name: Build Android APK
        id: android
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          cliVersion: v0.1.72
          targetPlatform: Android
          buildMethod: DrivingSim.EditorTools.CIEntryPoints.BuildAndroid
          buildName: DrivingPracticeSimulator
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          versioning: Custom
          version: 0.1.0
          allowDirtyBuild: true

      - name: Upload Android APK
        if: always() && steps.android.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: build/Android
          if-no-files-found: warn
