# Compiles the Unity project and runs its EditMode + PlayMode tests with GameCI.
#
# Required repository secrets (Unity Personal seat):
#   UNITY_EMAIL     email of a Unity account dedicated to CI
#   UNITY_PASSWORD  its password (the account must not use two-factor authentication)
# No license file: game-ci/cli v0.1.72 (what unity-test-runner v4.4.0 runs) activates Personal seats
# with the account ("personal" method). A Personal .ulf is machine-bound and fails in CI containers
# ("Machine bindings don't match"). Without the secrets the job prints a notice and skips Unity.
#
# Safety: runs only on pushes to the development branch and manual dispatch (never on
# pull_request_target / forks); third-party actions are pinned to commit SHAs; the token
# can only read the repo and write the test-results check.
name: Unity tests

on:
  push:
    branches: [ccr-21c0ed33-uzs8xd]
    paths:
      - 'DrivingPracticeSimulator/**'
      - '.github/workflows/unity-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile and test (Unity 6000.0.85f1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Unity secrets
        id: secrets
        env:
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          if [ "$HAS_EMAIL" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity secrets are not configured (UNITY_EMAIL, UNITY_PASSWORD). Skipping Unity compile and tests."
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Library
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: DrivingPracticeSimulator/Library
          key: Library-6000.0.85f1-${{ hashFiles('DrivingPracticeSimulator/Packages/manifest.json', 'DrivingPracticeSimulator/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-6000.0.85f1-

      - name: Run EditMode and PlayMode tests
        id: tests
        if: steps.secrets.outputs.configured == 'true'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # The Unity version comes from ProjectSettings/ProjectVersion.txt (6000.0.85f1);
          # the CLI ignores unityVersion for full projects.
          projectPath: DrivingPracticeSimulator
          # Pinned CLI; with only UNITY_EMAIL + UNITY_PASSWORD it resolves to the "personal" licensing method.
          cliVersion: v0.1.72
          testMode: all
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - name: Upload test results and logs
        if: always() && steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-test-results
          path: |
            ${{ steps.tests.outputs.artifactsPath }}
            test-artifacts
          if-no-files-found: warn
