    <ellipse cx="374" cy="480" rx="30" ry="100" transform="rotate(-12 374 480)" fill="#1E283C"/>
    <rect x="236" y="380" width="28" height="260" fill="#1E283C"/>
    <circle cx="250" cy="420" r="6" fill="#F2C877"/><circle cx="250" cy="470" r="6" fill="#F2C877"/><circle cx="250" cy="520" r="6" fill="#F2C877"/>
    <rect x="310" y="430" width="34" height="58" rx="6" fill="#14181C"/><rect x="322" y="404" width="6" height="30" fill="#14181C"/>
