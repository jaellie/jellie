<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="273" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="280" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)">
    <rect x="0" y="930" width="2048" height="222" fill="#9FAEAA"/>
    <!-- IV stand -->
    <rect x="470" y="380" width="10" height="550" fill="#7A8A8E"/><rect x="430" y="380" width="90" height="8" fill="#7A8A8E"/>
    <path d="M450 388 L450 470 Q475 500 500 470 L500 388Z" fill="#E7F0EE" opacity="0.9"/>
    <path d="M475 500 Q520 640 640 700" stroke="#C9D3CF" stroke-width="4" fill="none"/>
    <!-- bed -->
    <rect x="600" y="700" width="900" height="70" rx="10" fill="#E7EEEC"/>
    <rect x="600" y="760" width="900" height="40" fill="#B9C5C2"/>
    <rect x="620" y="800" width="14" height="130" fill="#7A8A8E"/><rect x="1466" y="800" width="14" height="130" fill="#7A8A8E"/>
    <rect x="1440" y="560" width="60" height="240" rx="10" fill="#9AA6AB"/>
    <ellipse cx="760" cy="676" rx="140" ry="44" fill="#F5F8F7"/>
    <!-- a green ear on the pillow -->
    <circle cx="742" cy="640" r="60" fill="#6F8F72"/><circle cx="700" cy="598" r="24" fill="#6F8F72"/><circle cx="700" cy="598" r="12" fill="#E2D6C0"/>
    <path d="M722 646 L746 646" stroke="#20262B" stroke-width="4" stroke-linecap="round"/>
    <path d="M800 690 Q1100 640 1420 700 L1420 740 L800 740Z" fill="#DCE5E2"/>
    <!-- monitor -->
    <rect x="1600" y="520" width="16" height="410" fill="#7A8A8E"/>
    <rect x="1540" y="420" width="240" height="170" rx="12" fill="#20262B"/>
    <rect x="1556" y="436" width="208" height="120" fill="#0F1A16"/>
    <path d="M1560 500 L1610 500 L1624 470 L1640 530 L1656 500 L1760 500" stroke="#7BD08F" stroke-width="4" fill="none"/>
    <text x="1740" y="580" text-anchor="end" font-family="monospace" font-size="18" fill="#7BD08F">1:17</text></g></g></svg>