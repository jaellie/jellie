<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="560" viewBox="0 0 2048 560">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="275" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="282" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)"><rect width="2048" height="560" fill="#A8B6B2"/><line x1="0" y1="0" x2="2048" y2="0" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="17" x2="2048" y2="17" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="40" x2="2048" y2="40" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="69" x2="2048" y2="69" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="104" x2="2048" y2="104" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="145" x2="2048" y2="145" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="192" x2="2048" y2="192" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="245" x2="2048" y2="245" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="304" x2="2048" y2="304" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="369" x2="2048" y2="369" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="440" x2="2048" y2="440" stroke="#97A6A2" stroke-width="2"/><line x1="0" y1="517" x2="2048" y2="517" stroke="#97A6A2" stroke-width="2"/></g></g></svg>