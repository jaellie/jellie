<svg xmlns="http://www.w3.org/2000/svg" width="500" height="720" viewBox="0 0 500 720">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="138" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)"><ellipse cx="250" cy="708" rx="150" ry="12" fill="#000" opacity="0.28" filter="url(#soft)"/>
    
    <rect x="180" y="660" width="54" height="44" rx="16" fill="#3B3633"/>
    <rect x="266" y="660" width="54" height="44" rx="16" fill="#3B3633"/>
    <path d="M144 360 Q250 330 356 360 L386 676 Q250 700 114 676Z" fill="#D9783F"/>
    <path d="M124 640 Q250 690 376 640 L386 676 Q250 700 114 676Z" fill="#B8612F" opacity="0.6"/>
    <ellipse cx="122" cy="480" rx="30" ry="100" transform="rotate(12 122 480)" fill="#B8612F"/>
    <ellipse cx="378" cy="480" rx="30" ry="100" transform="rotate(-12 378 480)" fill="#B8612F"/>
    <rect x="200" y="400" width="100" height="250" fill="#3E5A6B"/><rect x="200" y="400" width="18" height="60" fill="#3E5A6B"/>
    <rect x="300" y="470" width="30" height="70" rx="8" fill="#20262B"/><circle cx="315" cy="466" r="12" fill="#F2C877"/>
    <circle cx="250" cy="250" r="112" fill="#5A4F4A"/>
    <ellipse cx="250" cy="300" rx="56" ry="42" fill="#7A6D66"/>
    <ellipse cx="250" cy="286" rx="26" ry="18" fill="#E39A9A"/>
