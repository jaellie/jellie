<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="283" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="290" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)">
    <rect x="0" y="930" width="2048" height="222" fill="#7A5E4C"/>
    <rect x="200" y="420" width="420" height="16" fill="#5E4A3C"/><rect x="200" y="600" width="420" height="16" fill="#5E4A3C"/>
    <rect x="220" y="470" width="34" height="130" fill="#6F8F72"/><rect x="264" y="460" width="34" height="140" fill="#C98B7E"/><rect x="308" y="450" width="34" height="150" fill="#D8A85C"/><rect x="352" y="470" width="34" height="130" fill="#F3EBDD"/><rect x="396" y="460" width="34" height="140" fill="#6F8F72"/><rect x="440" y="450" width="34" height="150" fill="#C98B7E"/><rect x="484" y="470" width="34" height="130" fill="#D8A85C"/><rect x="528" y="460" width="34" height="140" fill="#F3EBDD"/><rect x="572" y="450" width="34" height="150" fill="#6F8F72"/>
    <rect x="300" y="520" width="140" height="80" fill="#E2D6C0" stroke="#5E4A3C" stroke-width="8"/>
    <circle cx="318" cy="545" r="5" fill="#F2C877"/><circle cx="339" cy="545" r="5" fill="#F2C877"/><circle cx="360" cy="545" r="5" fill="#F2C877"/><circle cx="381" cy="545" r="5" fill="#F2C877"/><circle cx="402" cy="545" r="5" fill="#F2C877"/><circle cx="423" cy="545" r="5" fill="#F2C877"/>
