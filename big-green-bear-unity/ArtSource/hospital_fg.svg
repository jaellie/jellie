<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="277" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="284" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)"><g filter="url(#soft)"><path d="M-20 -20 L220 -20 Q160 400 240 1180 L-20 1180Z" fill="#9FC0C4" opacity="0.85"/>
    <!-- the foot of the bed, seen from the pillow: white blanket and the rail -->
    <path d="M-20 1180 L-20 860 Q500 790 1024 812 Q1560 790 2068 850 L2068 1180Z" fill="#EEF3F1"/>
    <path d="M300 840 Q700 900 1000 830 M1150 835 Q1500 900 1800 850" stroke="#D3DDDA" stroke-width="10" fill="none"/>
    <rect x="160" y="760" width="1728" height="18" rx="9" fill="#8C9A9E"/>
    <rect x="200" y="760" width="14" height="80" fill="#8C9A9E"/><rect x="1834" y="760" width="14" height="80" fill="#8C9A9E"/></g></g></g></svg>