<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="30" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)">
    <ellipse cx="200" cy="548" rx="120" ry="12" fill="#000" opacity="0.28" filter="url(#soft)"/>
    <!-- boots -->
    <rect x="138" y="486" width="52" height="60" rx="16" fill="#9C5442"/>
    <rect x="210" y="486" width="52" height="60" rx="16" fill="#9C5442"/>
    <!-- raincoat -->
    <path d="M118 300 Q200 268 282 300 L314 500 Q200 528 86 500Z" fill="#E6BE58"/>
    <path d="M200 290 L200 512" stroke="#C99F3D" stroke-width="5"/>
    <circle cx="216" cy="340" r="7" fill="#5E4A3C"/><circle cx="216" cy="392" r="7" fill="#5E4A3C"/><circle cx="216" cy="444" r="7" fill="#5E4A3C"/>
    <path d="M96 470 Q200 500 304 470 L314 500 Q200 528 86 500Z" fill="#C99F3D" opacity="0.7"/>
    <!-- arms -->
    <ellipse cx="96" cy="380" rx="30" ry="74" transform="rotate(14 96 380)" fill="#E6BE58"/>
    <ellipse cx="304" cy="380" rx="30" ry="74" transform="rotate(-14 304 380)" fill="#E6BE58"/>
    <circle cx="86" cy="446" r="20" fill="#FBF7EE"/><circle cx="314" cy="446" r="20" fill="#FBF7EE"/>
    <g transform="">
      <!-- hood -->
      <path d="M86 214 Q86 72 200 72 Q314 72 314 214 Q314 300 200 304 Q86 300 86 214Z" fill="#E6BE58"/>
      <!-- lamb ears poking out -->
      <ellipse cx="88" cy="200" rx="40" ry="18" transform="rotate(-24 88 200)" fill="#FBF7EE"/>
      <ellipse cx="312" cy="200" rx="40" ry="18" transform="rotate(24 312 200)" fill="#FBF7EE"/>
      <ellipse cx="88" cy="200" rx="22" ry="8" transform="rotate(-24 88 200)" fill="#C98B7E" opacity="0.5"/>
      <ellipse cx="312" cy="200" rx="22" ry="8" transform="rotate(24 312 200)" fill="#C98B7E" opacity="0.5"/>
      <!-- face -->
      <ellipse cx="200" cy="212" rx="80" ry="72" fill="#FBF7EE"/>
      <circle cx="140" cy="150" r="20" fill="#FBF7EE"/><circle cx="165" cy="142" r="20" fill="#FBF7EE"/><circle cx="190" cy="150" r="20" fill="#FBF7EE"/><circle cx="215" cy="142" r="20" fill="#FBF7EE"/><circle cx="240" cy="150" r="20" fill="#FBF7EE"/><circle cx="262" cy="142" r="20" fill="#FBF7EE"/>
      <ellipse cx="148" cy="232" rx="16" ry="9" fill="#C98B7E" opacity="0.5"/>
      <ellipse cx="252" cy="232" rx="16" ry="9" fill="#C98B7E" opacity="0.5"/>
      <path d="M160 206 Q172 192 184 206" stroke="#20262B" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M216 206 Q228 192 240 206" stroke="#20262B" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M186 232 Q200 250 214 232Z" fill="#9C5442"/>
      <path d="M100 250 Q200 330 300 250" stroke="#C99F3D" stroke-width="6" fill="none" opacity="0.6"/>
    </g></g></g></svg>