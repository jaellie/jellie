<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="249" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="256" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)"><g filter="url(#soft)"><rect x="0" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="260" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="520" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="780" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="1040" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="1300" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="1560" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="1820" y="960" width="40" height="220" rx="6" fill="#1A1714"/><rect x="0" y="1000" width="2048" height="22" fill="#1A1714"/></g></g></g></svg>