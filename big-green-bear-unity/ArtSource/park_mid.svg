<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="225" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="232" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs><g filter="url(#grain)"><g filter="url(#wob)">
    <rect x="0" y="930" width="2048" height="222" fill="#2C3A2E"/>
    <rect x="231.4" y="467.99999999999994" width="57.2" height="462.00000000000006" fill="#3B2F28"/>
    <circle cx="260" cy="413" r="209.00000000000003" fill="#2E4234"/><circle cx="128" cy="489.99999999999994" r="143" fill="#34493A"/><circle cx="403" cy="478.99999999999994" r="154" fill="#2A3D30"/><rect x="1804" y="510" width="52" height="420" fill="#3B2F28"/>
    <circle cx="1830" cy="460" r="190" fill="#2E4234"/><circle cx="1710" cy="530" r="130" fill="#34493A"/><circle cx="1960" cy="520" r="140" fill="#2A3D30"/>
    <!-- bench -->
    <rect x="620" y="830" width="360" height="22" rx="6" fill="#6B4E3B"/><rect x="620" y="780" width="360" height="18" rx="6" fill="#6B4E3B"/>
    <rect x="640" y="850" width="14" height="80" fill="#2A2420"/><rect x="946" y="850" width="14" height="80" fill="#2A2420"/>
    <!-- lamp -->
    <rect x="1150" y="460" width="16" height="470" fill="#1A2025"/><path d="M1128 460 L1188 460 L1178 400 L1138 400Z" fill="#F2C877"/>
    <circle cx="1158" cy="430" r="90" fill="#F2C877" opacity="0.22" filter="url(#softer)"/>
    <!-- notice board: an event that has already ended -->
    <rect x="1370" y="690" width="16" height="240" fill="#4A3A30"/><rect x="1614" y="690" width="16" height="240" fill="#4A3A30"/>
    <rect x="1350" y="600" width="300" height="220" rx="6" fill="#6B4E3B"/>
    <rect x="1380" y="624" width="240" height="172" fill="#F3EBDD"/>
    <text x="1500" y="664" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="2" fill="#2E3A32">BELL CHOIR</text>
    <text x="1500" y="698" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#20262B">9:00 PM</text>
    <text x="1500" y="740" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#20262B">THANK YOU FOR COMING!</text>
    <rect x="1420" y="752" width="160" height="34" rx="4" fill="none" stroke="#B24A3A" stroke-width="4" transform="rotate(-8 1500 769)"/>
    <text x="1500" y="776" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="3" fill="#B24A3A" transform="rotate(-8 1500 769)">ENDED</text>
    <!-- pond -->
    <ellipse cx="1060" cy="925" rx="200" ry="16" fill="#1E2832"/></g></g></svg>