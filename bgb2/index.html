<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Green Bear's Adventure II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/>
    <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .27  0 0 0 0 .2  0 0 0 .22 0"/></filter>
  <filter id="cut"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="9"/>
    <feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</svg>

<div id="canvas"><!-- 1280x720, scaled to fit -->
  <main id="book">
    <header id="header"><span>CASE No.07 · THE OLD CLOCK TOWER</span><span id="hdr-room"></span></header>

    <nav id="spine" aria-label="Case file tabs"></nav>

    <section id="stage" aria-label="Stage"></section>
    <aside id="mirror" aria-hidden="true"><div id="mirror-inner"></div><div class="glass"></div></aside>

    <section id="strip"><p id="narration"></p><p id="keys">← → move · E interact · Tab case file</p></section>

    <section id="folder" hidden></section>
  </main>

  <section id="menu">
    <div class="menu-art" id="menu-art"></div>
    <h1>BIG GREEN BEAR'S ADVENTURE II</h1>
    <h2>THE OTHER BEAR</h2>
    <ul id="menu-tabs"></ul>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
