<style>
/* Layout: one 2400×1080 stage (= Unity reference units, 20:9 landscape) scaled to the viewport,
   so sizes on a phone match the real game. Single deliberate dark look (driving at dusk). */
:root{
  color-scheme: dark;
  --ink-0:#06090D; --ink-1:#0B1118; --ink-2:#111A23; --ink-3:#18242F;
  --line:rgba(186,214,234,.14); --line-2:rgba(186,214,234,.26);
  --text:#EDF3F7; --text-2:#A7B7C4; --text-3:#6C7E8D;
  --ice:#A3D5F2; --ice-ink:#071C2B; --teal:#45D0B4; --amber:#FFB54A; --red:#FF5D55;
  --glass-top:rgba(34,48,62,.80); --glass-bot:rgba(13,20,28,.80);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Saira Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-key:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs-cap:30px; --fs-body:40px; --fs-sub:48px; --fs-title:64px; --fs-display:104px;
  --r-s:16px; --r-m:24px; --r-l:36px;
  --touch:124px;
}
html,body{height:100%}
body{margin:0;background:var(--ink-0);color:var(--text);font-family:var(--f-ui);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--ice);outline-offset:4px}
#app{position:fixed;inset:0;background:var(--ink-0)}
#stage{position:absolute;left:0;top:0;width:2400px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ink-1);
  user-select:none;-webkit-user-select:none;touch-action:none}
#scene{position:absolute;inset:0;width:2400px;height:1080px}
#screen{position:absolute;inset:0}
.safe{position:absolute;inset:48px 72px}

/* ---------- materials ---------- */
.glass{background:linear-gradient(180deg,var(--glass-top),var(--glass-bot));border:1.5px solid var(--line);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.35);border-radius:var(--r-m)}
.solid{background:linear-gradient(180deg,#152029,#0E161E);border:1.5px solid var(--line);border-radius:var(--r-l);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.5)}
.lit{--lc:var(--ice);box-shadow:inset 0 0 0 3px var(--lc),0 0 28px color-mix(in srgb,var(--lc) 45%,transparent),inset 0 1.5px 0 rgba(255,255,255,.1)}
.eyebrow{font-family:var(--f-num);font-weight:600;font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.muted{color:var(--text-2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:20px;min-height:var(--touch);padding:0 48px;border-radius:var(--r-m);
  font-size:var(--fs-body);font-weight:600;letter-spacing:-.01em;transition:transform .12s ease,background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(180deg,#BEE3F8,#93CBEB);color:var(--ice-ink);box-shadow:0 14px 40px rgba(120,190,230,.28),inset 0 1.5px 0 rgba(255,255,255,.6)}
.btn-secondary{background:linear-gradient(180deg,var(--glass-top),var(--glass-bot));border:1.5px solid var(--line-2);color:var(--text)}
.btn-ghost{color:var(--text-2)}
.btn[disabled]{background:var(--ink-3);color:var(--text-3);box-shadow:none;border:1.5px dashed var(--line-2);cursor:not-allowed}
.icon-btn{width:var(--touch);height:var(--touch);display:grid;place-items:center;border-radius:var(--r-m)}
svg.i{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-radius:999px;font-size:var(--fs-cap);font-weight:600}
.pill::before{content:"";width:14px;height:14px;border-radius:50%;background:currentColor}
.pill.play{color:var(--teal);background:rgba(69,208,180,.12)}
.pill.plan{color:var(--text-2);background:rgba(167,183,196,.10)}
.dots{display:inline-flex;gap:10px}.dots i{width:16px;height:16px;border-radius:50%;background:var(--line-2)}.dots i.on{background:var(--ice)}
.seg{display:flex;padding:8px;border-radius:calc(var(--r-m) + 8px);background:rgba(0,0,0,.35);border:1.5px solid var(--line)}
.seg button{flex:1;min-height:108px;border-radius:var(--r-m);font-size:var(--fs-body);font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:16px}
.seg button.on{background:linear-gradient(180deg,#24384A,#1A2A38);color:var(--text);box-shadow:inset 0 0 0 2px var(--ice)}
.seg button small{font-size:var(--fs-cap);color:var(--text-3);font-weight:500}
.toggle{width:132px;height:72px;border-radius:999px;background:var(--ink-3);border:1.5px solid var(--line-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:8px;left:8px;width:54px;height:54px;border-radius:50%;background:var(--text-2);transition:left .2s,background .2s}
.toggle.on{background:rgba(163,213,242,.25);border-color:var(--ice)}.toggle.on::after{left:68px;background:var(--ice)}
.keycap{display:inline-grid;place-items:center;min-width:132px;height:132px;padding:0 28px;border-radius:22px;font-family:var(--f-key);font-weight:600;font-size:40px;
  color:var(--text);background:linear-gradient(180deg,#2A3A48,#1C2833);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 10px 0 #0A1016,0 14px 24px rgba(0,0,0,.4);position:relative}
.keycap.brake{box-shadow:inset 0 0 0 3px var(--red),inset 0 2px 0 rgba(255,255,255,.14),0 10px 0 #0A1016,0 14px 24px rgba(0,0,0,.4)}
.keycap.accel{box-shadow:inset 0 0 0 3px var(--teal),inset 0 2px 0 rgba(255,255,255,.14),0 10px 0 #0A1016,0 14px 24px rgba(0,0,0,.4)}
.keycap.bad{box-shadow:inset 0 0 0 3px var(--amber),inset 0 2px 0 rgba(255,255,255,.14),0 10px 0 #0A1016,0 14px 24px rgba(0,0,0,.4)}
.keycap.down{transform:translateY(8px);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 2px 0 #0A1016}
.keycap .tag{position:absolute;top:-22px;right:-18px;height:48px;padding:0 16px;border-radius:999px;font:600 26px/48px var(--f-ui);background:var(--amber);color:#2A1700}
.fade-in{animation:fi .35s ease both}@keyframes fi{from{opacity:.0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none}.btn,.toggle::after{transition:none}}

/* ---------- prototype chrome (not part of the game UI) ---------- */
#protoBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:30;height:30px;padding:0 14px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;font:600 12px/30px var(--f-ui);letter-spacing:.04em;backdrop-filter:blur(6px)}
#sheet{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(0,0,0,.45)}
#sheet .panel{width:min(420px,100%);height:100%;overflow:auto;background:#0E151C;border-left:1px solid rgba(255,255,255,.1);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;font-size:14px;line-height:1.5}
#sheet h2{font:600 18px/1.3 var(--f-ui);margin:0 0 2px}
#sheet .sub{color:var(--text-2);font-size:13px;margin:0 0 14px}
#sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#sheet .chip{height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-size:13px;color:var(--text)}
#sheet .chip.on{background:var(--ice);color:var(--ice-ink);border-color:var(--ice)}
#sheet .grp{font:600 11px/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin:16px 0 8px}
#sheet .note{background:#131D26;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;color:#C9D6E0}
#sheet .note b{color:var(--text)}
#sheet .close{float:right;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:13px}
#rotate{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));z-index:25;text-align:center;font:500 12px var(--f-ui);color:#cfe3f0;pointer-events:none}
#rotate span{background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px}
</style>

<div id="app">
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="screen"></div>
  </div>
  <div id="rotate" hidden><span>가로로 돌려 보세요 · Rotate to landscape for true size</span></div>
  <button id="protoBtn" aria-haspopup="dialog">PROTOTYPE · 화면 목록</button>
  <div id="sheet" hidden role="dialog" aria-label="Prototype screens">
    <div class="panel">
      <button class="close" id="sheetClose">닫기</button>
      <h2>Cabin Light</h2>

      <div class="row" id="langChips"></div>
      <div class="grp">Screens</div>
      <div class="row" id="screenChips"></div>
      <div class="grp">About this screen</div>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

/* ---------------- layout scaling ---------------- */
let scale = 1, dpr = 1;
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  const x = (vw - W * scale) / 2, y = (vh - H * scale) / 2;
  stage.style.transform = `translate(${x}px,${y}px) scale(${scale})`;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  document.getElementById('rotate').hidden = vw >= vh;
}
window.addEventListener('resize', fit);

/* ---------------- toasts ---------------- */
let toastTimer = 0;
function toast(key, kind='warn') {
  const el = document.getElementById('toast');
  if (!el) return;
  const color = kind === 'err' ? 'var(--red)' : kind === 'info' ? 'var(--ice)' : 'var(--amber)';
  el.innerHTML = `<div class="glass fade-in" style="display:flex;align-items:center;gap:24px;padding:0 40px;height:112px;border-radius:999px;--lc:${color};box-shadow:inset 0 0 0 2px ${color},0 18px 40px rgba(0,0,0,.4)">
    <span style="color:${color}">${icon(kind === 'info' ? 'info' : 'warn')}</span><span style="font-size:var(--fs-body);font-weight:600">${esc(t(key))}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ''; }, 2400);
}

/* ---------------- screens ---------------- */
function go(screen) {
  if (screen !== S.screen && ['settings','calibration'].includes(screen)) S.prev = S.screen === 'pause' ? 'pause' : S.screen;
  S.screen = screen;
  S.dialog = null;
  if (screen === 'pause') { S.paused = true; }
  else if (screen === 'drive' || screen === 'practice') { S.paused = false; S.hud = screen === 'practice' ? 'practice' : S.hud; }
  if (screen === 'drive' && S.hud === 'practice') S.screen = 'practice';
  if (screen === 'practice') S.hud = 'practice';
  if (screen === 'loading') S.loadP = 0;
  render();
}

function render() {
  const s = S.screen;
  const r = {language, notice, home, environments, loading, drive:driveScreen, practice:driveScreen, pause:driveScreen,
             settings, calibration, states, system, journey}[s];
  root.innerHTML = r();
  bind();
  renderProtoSheet();
}

/* --------- driving HUD --------- */

  <div id="hud" style="position:absolute;inset:0">
    <div id="halo" style="position:absolute;left:0;top:0;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s;

      </div>
      <div id="toast" style="position:absolute;left:50%;top:${prac ? 270 : 160}px;transform:translateX(-50%);white-space:nowrap"></div>
      ${prac ? `<div class="glass" style="position:absolute;left:50%;top:160px;transform:translateX(-50%);height:88px;padding:0 36px;display:flex;align-items:center;gap:20px;border-radius:999px;font-size:var(--fs-cap);color:var(--text-2);margin-top:${0}px" id="guide">${icon('map')} ${t('hud.guide')}</div>` : ''}
      <!-- top right: camera -->
      <button class="glass icon-btn ${S.camPop ? 'lit' : ''}" data-ctl data-act="cam" aria-label="Camera" style="position:absolute;right:0;top:0">${icon('cam')}</button>
      <div style="position:absolute;right:150px;top:0;display:flex;flex-direction:column;align-items:flex-end;gap:20px">
        ${S.camPop ? `<div class="glass fade-in" data-ctl style="width:620px;padding:24px;display:flex;flex-direction:column;gap:20px;border-radius:var(--r-l)">
          <div class="seg"><button data-ctl data-act="view" data-v="cockpit" class="${S.view==='cockpit'?'on':''}">${t('hud.cockpit')}</button><button data-ctl data-act="view" data-v="chase" class="${S.view==='chase'?'on':''}">${t('hud.chase')}</button></div>
          <div style="display:flex;gap:16px"><button class="btn btn-secondary" data-ctl data-hold="lookL" style="flex:1;padding:0">${t('hud.lookL')}</button><button class="btn btn-secondary" data-ctl data-hold="lookR" style="flex:1;padding:0">${t('hud.lookR')}</button></div>
          <div style="display:flex;align-items:center;gap:20px;font-size:var(--fs-cap);color:var(--text-2)">${t('hud.fov')}
            <button class="glass icon-btn" data-ctl data-act="fov" data-v="-5" style="width:96px;height:96px;font-size:48px">−</button><span class="num" style="font-size:44px;color:var(--text);min-width:90px;text-align:center" id="fovv">${S.fov}°</span><button class="glass icon-btn" data-ctl data-act="fov" data-v="5" style="width:96px;height:96px;font-size:48px">+</button></div>
        </div>` : ''}
        ${prac && !S.camPop && S.minimap ? `<canvas id="mini" width="300" height="300" class="glass" style="width:300px;height:300px;border-radius:var(--r-l)"></canvas>` : ''}
      </div>
      ${prac ? `
      <div class="glass" style="position:absolute;left:0;top:160px;width:440px;padding:28px 32px;border-radius:var(--r-l)">
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div><div class="eyebrow">${t('hud.speed')}</div><div class="num" style="font-size:112px;font-weight:600;line-height:1"><span id="pSpeed">0</span><span style="font-size:32px;color:var(--text-2);margin-left:8px">km/h</span></div></div>
          <div class="num" id="pGear" style="font-size:104px;font-weight:700;color:var(--ice);line-height:1">P</div>
        </div>
        <div style="margin-top:24px" class="eyebrow">${t('hud.steer')} <span class="num" id="pSteer" style="color:var(--text);letter-spacing:0">0°</span></div>
        <div style="position:relative;height:16px;margin-top:12px;border-radius:8px;background:rgba(255,255,255,.08)"><div style="position:absolute;left:50%;top:-6px;width:3px;height:28px;background:var(--text-3)"></div><div id="pSteerBar" style="position:absolute;top:0;height:16px;border-radius:8px;background:var(--ice);left:50%;width:0"></div></div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:14px 20px;align-items:center;margin-top:24px;font-size:var(--fs-cap);color:var(--text-2)">

          ${t('hud.accel')}<div style="height:16px;border-radius:8px;background:rgba(255,255,255,.08)"><div id="pA" style="height:100%;width:0;border-radius:8px;background:var(--teal)"></div></div>

      <div style="position:absolute;left:0;bottom:0;display:flex;align-items:flex-end;gap:20px">

          <span style="font-size:24px;font-weight:600">${t('hud.pbrake')}</span></button>

    </div>
    ${S.screen === 'pause' ? pauseSheet() : ''}
    ${S.dialog ? dialog() : ''}
  </div>
  <style>
    .pedal{position:relative;border-radius:34px 34px 26px 26px;background:linear-gradient(180deg,rgba(40,54,68,.82),rgba(14,20,27,.86));border:1.5px solid var(--line);
      box-shadow:inset 0 1.5px 0 rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.4);overflow:hidden;transition:transform .08s}
    .pedal .tread{position:absolute;inset:28px 28px 92px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 10px,transparent 10px 26px);border-radius:16px}
    .pedal .lbl{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:600 30px var(--f-ui);letter-spacing:.06em;color:var(--text-2)}
    .pedal .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,color-mix(in srgb,var(--pc) 45%,transparent),transparent)}
    .pedal.down{transform:translateY(6px) scale(.985);box-shadow:inset 0 0 0 3px var(--pc),0 0 34px color-mix(in srgb,var(--pc) 40%,transparent)}

    .gearbtn.on{color:var(--text)!important}
    .pbrake{color:var(--text-2)} .pbrake.on{color:var(--red);box-shadow:inset 0 0 0 3px var(--red),0 0 26px rgba(255,93,85,.35)}
    .ind.on{color:var(--amber)!important;box-shadow:inset 0 0 0 3px var(--amber),0 0 30px rgba(255,181,74,.45)}
  </style>`;
}
const pedalFace = label => `<span class="fill"></span><span class="tread"></span><span class="lbl">${label}</span>`;
const drawerBtn = (act, ic, label, state, on, color) => `
  <button class="${on ? 'lit' : ''}" data-ctl data-act="${act}" style="--lc:${color};width:200px;height:200px;border-radius:var(--r-m);background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:${on ? color : 'var(--text)'}">

function pauseSheet() {
  const row = (act, ic, key, primary) => `<button class="btn ${primary ? 'btn-primary' : 'btn-secondary'}" data-ctl data-act="${act}" style="justify-content:flex-start;padding:0 40px;width:100%">${icon(ic)} ${t(key)}</button>`;
  return `<div data-ctl style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,7,10,.2),rgba(4,7,10,.75))"></div>

}
function dialog() {

}

/* --------- settings --------- */
function settings() {
  const tabs = [['lang','globe'],['hud','wheel'],['cam','cam'],['pedals','pedal'],['about','info']];
  const row = (title, desc, control) => `<div style="display:flex;align-items:center;gap:40px;min-height:160px;padding:24px 0;border-bottom:1.5px solid var(--line)">
    <div style="flex:1;min-width:0"><div style="font-size:var(--fs-body);font-weight:600">${title}</div>${desc ? `<div style="margin-top:8px;font-size:var(--fs-cap);color:var(--text-2);line-height:1.45">${desc}</div>` : ''}</div>${control}</div>`;
  let body = '';
  if (S.setTab === 'lang') body = row(t('set.language'), '', `<div class="seg" style="width:620px"><button class="${S.lang==='ko'?'on':''}" data-act="setLang" data-v="ko">한국어</button><button class="${S.lang==='en'?'on':''}" data-act="setLang" data-v="en">English</button></div>`)
    + row(t('set.notice'), t('notice.later'), `<button class="btn btn-secondary" data-act="readNotice" style="min-width:360px">${t('set.notice.read')}</button>`);
  if (S.setTab === 'hud') body = `<div style="padding:24px 0 32px;border-bottom:1.5px solid var(--line)"><div style="font-size:var(--fs-body);font-weight:600;margin-bottom:24px">${t('set.hud.mode')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
        ${hudChoice('minimal')}${hudChoice('practice')}
      </div></div>`
    + row(t('set.halo'), t('set.halo.d'), `<button class="toggle ${S.halo?'on':''}" data-act="halo" aria-pressed="${S.halo}" aria-label="${t('set.halo')}"></button>`)
    + row(t('set.map'), '', `<button class="toggle ${S.minimap?'on':''}" data-act="minimap" aria-pressed="${S.minimap}" aria-label="${t('set.map')}"></button>`);
  if (S.setTab === 'cam') body = row(t('set.cam.default'), '', `<div class="seg" style="width:620px"><button class="${S.view==='cockpit'?'on':''}" data-act="view" data-v="cockpit">${t('hud.cockpit')}</button><button class="${S.view==='chase'?'on':''}" data-act="view" data-v="chase">${t('hud.chase')}</button></div>`)
    + row(t('hud.fov'), '50° – 85°', `<div style="display:flex;align-items:center;gap:20px"><button class="glass icon-btn" data-act="fov" data-v="-5" style="font-size:52px">−</button><span class="num" id="fovv" style="font-size:52px;min-width:120px;text-align:center">${S.fov}°</span><button class="glass icon-btn" data-act="fov" data-v="5" style="font-size:52px">+</button></div>`);
  if (S.setTab === 'pedals') body = `<div style="padding:32px 0;border-bottom:1.5px solid var(--line)"><div class="eyebrow">${t('set.pedals.cur')}</div>
      <div style="display:flex;gap:64px;margin-top:32px;flex-wrap:wrap">
        <div><div style="font-size:var(--fs-cap);color:var(--red);font-weight:600;margin-bottom:24px">${t('hud.brake')}</div><div style="display:flex;gap:20px"><span class="keycap brake">Space</span><span class="keycap brake">B</span></div></div>
        <div><div style="font-size:var(--fs-cap);color:var(--teal);font-weight:600;margin-bottom:24px">${t('hud.accel')}</div><div style="display:flex;gap:20px"><span class="keycap accel">↑</span><span class="keycap accel">Num 8</span></div></div>
      </div></div>
      <div style="display:flex;gap:24px;margin-top:40px"><button class="btn btn-primary" data-act="pedals">${t('set.pedals.re')}</button><button class="btn btn-secondary" data-act="pedalTest">${t('set.pedals.test')}</button></div>`;
  if (S.setTab === 'about') body = row(t('set.about.v'), 'Unity 6000.0.85f1 · URP Mobile', `<span class="num" style="font-size:48px">0.1.0</span>`)
    + row(t('set.notice'), '', `<button class="btn btn-secondary" data-act="readNotice" style="min-width:360px">${t('set.notice.read')}</button>`);
  return `<div style="position:absolute;inset:0;background:var(--ink-1)"></div>
  <div class="safe" style="display:grid;grid-template-columns:600px 1fr;gap:72px">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;gap:32px;margin-bottom:32px"><button class="glass icon-btn" data-act="back" aria-label="${t('env.back')}">${icon('back')}</button><span style="font-size:var(--fs-title);font-weight:700">${t('set.title')}</span></div>
      ${tabs.map(([k, ic]) => `<button data-act="tab" data-v="${k}" style="display:flex;align-items:center;gap:28px;height:124px;padding:0 32px;border-radius:var(--r-m);font-size:var(--fs-body);font-weight:600;text-align:left;
        ${S.setTab === k ? 'background:linear-gradient(180deg,#1E2F3E,#16232F);box-shadow:inset 0 0 0 2px var(--ice);color:var(--text)' : 'color:var(--text-2)'}">${icon(ic)} ${t('set.tab.' + k)}</button>`).join('')}
    </div>
    <div class="fade-in" style="padding-top:150px;min-width:0">${body}</div>
  </div>`;
}
function hudChoice(m) {
  const on = S.hud === m;
  return `<button data-act="hudMode" data-v="${m}" class="${on ? 'lit' : ''}" style="--lc:var(--ice);text-align:left;border-radius:var(--r-l);border:1.5px solid var(--line);background:#0F1820;overflow:hidden">
    <span style="display:block;height:200px;position:relative;background:linear-gradient(180deg,#24384c 0%,#4b6378 45%,#2a3036 46%,#14181c 100%)">
      <span style="position:absolute;left:24px;top:20px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.5)"></span>
      <span style="position:absolute;right:24px;top:20px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.5)"></span>
      <span style="position:absolute;right:24px;bottom:16px;width:96px;height:86px;border-radius:12px;background:rgba(255,255,255,.4)"></span>
      <span style="position:absolute;left:24px;bottom:16px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.4)"></span>
      ${m === 'practice' ? `<span style="position:absolute;left:24px;top:80px;width:120px;height:72px;border-radius:12px;background:rgba(163,213,242,.7)"></span><span style="position:absolute;right:24px;top:80px;width:72px;height:72px;border-radius:12px;background:rgba(163,213,242,.7)"></span>` : ''}

      <span style="display:block;margin-top:8px;font-size:var(--fs-cap);color:var(--text-2);line-height:1.45">${t(m === 'minimal' ? 'set.hud.min.d' : 'set.hud.prac.d')}</span></span></button>`;
}

/* --------- pedal calibration --------- */
function calibration() {
  const c = S.cal, steps = ['s1','s2','s3','s4','s5','s6','s7'];
  const rail = steps.map((s, i) => {
    const state = i < c.step ? 'done' : i === c.step ? 'now' : 'next';
    return `<div style="display:flex;align-items:center;gap:24px;height:96px;color:${state==='next'?'var(--text-3)':'var(--text)'}">
      <span class="num" style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:700;flex:none;
        ${state==='done'?'background:var(--teal);color:#062018':state==='now'?'box-shadow:inset 0 0 0 3px var(--ice);color:var(--ice)':'box-shadow:inset 0 0 0 2px var(--line-2)'}">${state==='done'?'✓':i+1}</span>
      <span style="font-size:var(--fs-cap);font-weight:${state==='now'?700:500}">${t('cal.' + s)}</span></div>`;
  }).join('');
  let body = '', actions = '';
  const back = c.step > 0 && c.step < 6 ? `<button class="btn btn-ghost" data-act="calBack">${icon('back')} ${t('cal.back')}</button>` : '<span></span>';
  if (c.step === 0) {
    body = `<div style="display:grid;grid-template-columns:1fr 620px;gap:56px;align-items:center">
      <div><div style="font-size:var(--fs-title);font-weight:700;line-height:1.15;text-wrap:balance">${t('cal.1.h')}</div>
      <p style="margin:28px 0 40px;font-size:var(--fs-body);line-height:1.55;color:var(--text-2)">${t('cal.1.b')}</p>
      ${['cal.1.c1','cal.1.c2','cal.1.c3'].map(k => `<div style="display:flex;align-items:center;gap:24px;height:96px;font-size:var(--fs-body)"><span style="color:var(--teal)">${icon('check')}</span>${t(k)}</div>`).join('')}</div>
      ${floorKeyboard()}</div>`;
    actions = `${back}<button class="btn btn-primary" data-act="calNext" style="min-width:360px">${t('cal.next')}</button>`;
  } else if (c.step === 1 || c.step === 2) {
    const brake = c.step === 1, n = brake ? c.b : c.a, color = brake ? 'var(--red)' : 'var(--teal)';
    const keys = brake ? ['Space','B'] : ['↑','Num 8'];

/* ---------------- interaction binding ---------------- */
const holds = {};
function bind() {
  // Driving controls act on pointer DOWN, like the Unity HoldButton. Browsers send `click` only for the
  // primary pointer, so a second finger tapping a gear while the first holds the brake never "clicked".
  root.querySelectorAll('[data-act]').forEach(el => {
    if (el.hasAttribute('data-ctl')) el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); act(el.dataset.act, el.dataset.v, el); });
    else el.addEventListener('click', e => { e.stopPropagation(); act(el.dataset.act, el.dataset.v, el); });
  });
  root.querySelectorAll('[data-hold]').forEach(el => {
    const k = el.dataset.hold;
    const down = e => { e.preventDefault(); e.stopPropagation(); try { el.setPointerCapture(e.pointerId); } catch (_) {} holds[k] = true; el.classList.add('down'); onHold(k, true); };
    const up = () => { if (!holds[k]) return; holds[k] = false; el.classList.remove('down'); onHold(k, false); };
    el.addEventListener('pointerdown', down);
    ['pointerup','pointercancel','lostpointercapture'].forEach(n => el.addEventListener(n, up));
  });
  const thumbs = root.querySelectorAll('canvas.thumb');
  thumbs.forEach(cv => drawThumb(cv));
  if (S.screen === 'drive' || S.screen === 'practice' || S.screen === 'pause') bindSteering();
  updateHud();
}
function onHold(k, on) {
  if (k === 'brake') S.brake = on ? 1 : 0;
  if (k === 'accel') { S.accel = on ? 1 : 0; if (on && S.pbrake && S.gear !== 'P' && S.gear !== 'N') toast('t.pbrake'); }
  if (k === 'lookL') S.look = on ? -1 : 0;
  if (k === 'lookR') S.look = on ? 1 : 0;
  if (k === 'tb' || k === 'ta') { calTestPress(k, on); }
}
function act(a, v, el) {
  switch (a) {
    case 'pickLang': S.lang = v; go('notice'); break;
    case 'noticeMode': S.noticeMode = S.noticeMode === 'review' ? 'required' : 'review'; render(); break;
    case 'noticeAccept': go('home'); break;
    case 'noticeClose': S.noticeMode = 'required'; go('settings'); break;
    case 'toggleLang': S.lang = S.lang === 'ko' ? 'en' : 'ko'; render(); break;
    case 'startDrive': go('loading'); break;
    case 'envs': go('environments'); break;
    case 'pedals': S.cal = {step:0,b:0,a:0,demoBad:false,tb:0,ta:0}; go('calibration'); break;
    case 'pedalTest': S.cal = {step:5,b:5,a:5,demoBad:false,tb:0,ta:0}; go('calibration'); break;
    case 'settings': go('settings'); break;
    case 'home': go('home'); break;
    case 'back': go(S.prev && S.prev !== S.screen ? S.prev : 'home'); break;
    case 'pickEnv': S.env = v; render(); break;
    case 'mode': S.mode = v; render(); break;
    case 'pause': go('pause'); break;
    case 'resume': go(S.hud === 'practice' ? 'practice' : 'drive'); break;
    case 'restart': Object.assign(S, {speed:0, steer:0, gear:'P', pbrake:true, travel:0, heading:0}); go(S.hud === 'practice' ? 'practice' : 'drive'); break;

let steerPtr = null;
function bindSteering() {
  const hud = document.getElementById('hud');
  if (!hud) return;
  hud.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-ctl]') || S.paused || steerPtr) return;
    const p = toStage(e);
    steerPtr = {id:e.pointerId, x:p.x, y:p.y, h:null};
    try { hud.setPointerCapture(e.pointerId); } catch (_) {}
    const halo = document.getElementById('halo');
    if (halo && S.halo) { halo.style.left = p.x + 'px'; halo.style.top = p.y + 'px'; halo.style.opacity = 1; }
    if (S.drawer || S.camPop) { S.drawer = false; S.camPop = false; render(); }
  });
  hud.addEventListener('pointermove', e => {
    if (!steerPtr || e.pointerId !== steerPtr.id) return;
    const p = toStage(e), dx = p.x - steerPtr.x, dy = p.y - steerPtr.y;
    if (Math.hypot(dx, dy) < 18) return;
    const h = Math.atan2(dy, dx);
    if (steerPtr.h !== null) {
      let d = h - steerPtr.h; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      if (Math.abs(d) < 1.75) S.steer = Math.max(-540, Math.min(540, S.steer + d * 180 / Math.PI));
    }
    steerPtr.h = h; steerPtr.x = p.x; steerPtr.y = p.y;
    const halo = document.getElementById('halo');
    if (halo) { halo.style.left = p.x + 'px'; halo.style.top = p.y + 'px'; }
  });
  const end = e => { if (steerPtr && e.pointerId === steerPtr.id) { steerPtr = null; const halo = document.getElementById('halo'); if (halo) halo.style.opacity = 0; } };

}

/* ---------------- tiny vehicle model (visual only) ---------------- */
function simulate(dt) {
  if (!['drive','practice'].includes(S.screen) || S.paused) return;
  let v = S.speed;
  const dir = S.gear === 'D' ? 1 : S.gear === 'R' ? -1 : 0;
  if (S.gear === 'P' || S.pbrake) { v *= Math.max(0, 1 - dt * 6); }
  else if (dir !== 0) {
    const target = dir * (S.accel > 0 ? (dir > 0 ? 60 : 15) : 8);
    const rate = S.accel > 0 ? 9 : 3;
    if (Math.sign(target) * (target - v) > 0) v += Math.sign(target) * rate * dt;
  } else v *= Math.max(0, 1 - dt * 0.3);
  if (S.brake > 0) { const d = 28 * dt * S.brake; v = Math.abs(v) <= d ? 0 : v - Math.sign(v) * d; }
  S.speed = v;
  S.travel += v / 3.6 * dt;
  if (!steerPtr && Math.abs(v) > 2) S.steer *= Math.max(0, 1 - dt * 1.0);
  S.heading += (S.steer / 540) * 0.6 * (v / 3.6) / 2.65 * dt;
}

/* ---------------- prototype sheet ---------------- */
const SCREENS = [['language','Language'],['notice','Notice'],['home','Main menu'],['environments','Environments'],['loading','Loading'],
  ['drive','Driving · Minimal'],['practice','Driving · Practice'],['pause','Pause'],['settings','Settings'],['calibration','Pedal setup'],
  ['states','Notifications'],['system','Design system'],['journey','Journey']];
const sheet = document.getElementById('sheet');
document.getElementById('protoBtn').addEventListener('click', () => { sheet.hidden = false; renderProtoSheet(); });
document.getElementById('sheetClose').addEventListener('click', () => { sheet.hidden = true; });
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
function renderProtoSheet() {
  if (sheet.hidden) return;
  document.getElementById('langChips').innerHTML = [['ko','한국어'],['en','English']].map(([k, l]) => `<button class="chip ${S.lang === k ? 'on' : ''}" data-l="${k}">${l}</button>`).join('');
  document.getElementById('screenChips').innerHTML = SCREENS.map(([k, l]) => `<button class="chip ${S.screen === k ? 'on' : ''}" data-s="${k}">${l}</button>`).join('');
  const key = S.screen === 'practice' ? 'practice' : S.screen;
  document.getElementById('note').innerHTML = NOTES[key] || '';
  document.querySelectorAll('#langChips .chip').forEach(b => b.onclick = () => { S.lang = b.dataset.l; render(); });
  document.querySelectorAll('#screenChips .chip').forEach(b => b.onclick = () => {
    const sc = b.dataset.s;
    if (sc === 'drive') S.hud = 'minimal';
    if (sc === 'pause') { S.screen = 'pause'; S.paused = true; S.dialog = null; render(); return; }
    if (sc === 'calibration') S.cal = {step:0,b:0,a:0,demoBad:false,tb:0,ta:0};
    if (sc === 'notice') S.noticeMode = 'required';
    go(sc);
  });
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  simulate(dt);
  try { drawScene(now); } catch (_) {}
  updateLive(now);
  requestAnimationFrame(frame);
}
fit();
render();
requestAnimationFrame(frame);
})();
