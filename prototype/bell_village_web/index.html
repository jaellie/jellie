<title>Bell Village</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+SC:wght@500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Korean text uses Pretendard (SIL OFL 1.1), subset to the 2,350 KS X 1001 syllables; Latin letters keep Alegreya */
@font-face{font-family:"Pretendard";font-weight:400;font-display:swap;src:url(assets/fonts/pretendard-400.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
@font-face{font-family:"Pretendard";font-weight:600;font-display:swap;src:url(assets/fonts/pretendard-600.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
@font-face{font-family:"Pretendard";font-weight:700;font-display:swap;src:url(assets/fonts/pretendard-700.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
html[lang="ko"] *{letter-spacing:-0.01em !important}   /* Korean tracking -1% */
/* Layout: one fixed 1920x1080 stage scaled to the window; parallax layers behind a walkable snow path, UI laid over it. */
:root{
  --night-0:#0b1230;      /* sky top */
  --night-1:#1d2c55;      /* sky low */
  --snow:#8fa2c6;         /* path highlight */
  --snow-deep:#41517d;    /* path shadow */
  --paper:#f2e3bd;        /* parchment */
  --paper-deep:#dcc48f;   /* parchment shade */
  --ink:#3a2a1c;          /* dark brown text on paper */
  --brass:#b08d57;        /* trim */
  --burgundy:#6e2a35;     /* ribbon */
  --lamp:#ffb347;         /* lamp glow */
  --font-body:"Alegreya","Pretendard","Noto Serif KR",Georgia,serif;
  --font-label:"Alegreya SC","Pretendard","Noto Serif KR",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0}
body{background:#05070f;color:var(--paper);font-family:var(--font-body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#vp{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0b1230;outline:none}
#stage img{max-width:none}
.layer{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.layer img,#world img{display:block;position:absolute;pointer-events:none;-webkit-user-drag:none}
#sky{position:absolute;inset:0;background:linear-gradient(#070b20 0%,var(--night-0) 18%,var(--night-1) 62%,#31416e 100%)}
#far img{left:-150px;top:168px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 34%,#000 80%,transparent 100%)}
#mid img{left:0;top:298px}
#clockface{position:absolute;left:1551px;top:396px;width:140px;height:140px;filter:drop-shadow(0 0 6px rgba(255,200,120,.55))}
#path{position:absolute;left:0;right:0;top:928px;bottom:0;background:
  radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.16),transparent 55%),
  linear-gradient(var(--snow) 0,#6d80a8 18%,var(--snow-deep) 62%,#2a355a 100%)}
#path:before{content:"";position:absolute;left:0;right:0;top:-10px;height:16px;background:linear-gradient(transparent,rgba(143,162,198,.55))}
#world{position:absolute;left:0;top:0;width:3812px;height:1080px;will-change:transform}
#world .ground{left:0;top:644px}
.actor{position:absolute;pointer-events:none;transform-origin:50% 100%}
.actor img{position:static!important;display:block;width:100%;height:auto}
/* Lighting: overlays are clipped to the sprite's own alpha, so outlines, colours and animation are untouched */
.actor{isolation:isolate;--spr:none;--ll:0;--lr:0;--cool:.2}
.actor:before,.actor:after{content:"";position:absolute;inset:0;pointer-events:none;-webkit-mask-image:var(--spr);mask-image:var(--spr);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.actor:before{background:linear-gradient(180deg,rgba(78,104,170,calc(var(--cool)*.5)),rgba(44,64,132,var(--cool)));mix-blend-mode:multiply}
.actor:after{background:linear-gradient(90deg,rgba(255,176,72,var(--ll)),rgba(255,176,72,0) 64%),linear-gradient(270deg,rgba(255,176,72,var(--lr)),rgba(255,176,72,0) 64%);mix-blend-mode:soft-light}
#shadows{position:absolute;left:0;top:0}
.cs{position:absolute;height:24px;pointer-events:none;transform-origin:50% 50%;background:radial-gradient(ellipse at 50% 50%,rgba(6,10,28,.62) 0%,rgba(6,10,28,.36) 42%,rgba(6,10,28,0) 72%);filter:blur(1.2px)}
#fg{position:absolute;left:0;top:0;will-change:transform}
#fg img{position:absolute;left:0;top:884px;display:block;pointer-events:none}
.mark{position:absolute;width:118px;height:129px;margin-left:-59px;filter:brightness(1.12) contrast(1.15) drop-shadow(0 3px 5px rgba(0,0,0,.55));pointer-events:none;animation:bob 1.6s ease-in-out infinite;opacity:0;scale:1;transition:opacity .25s ease,scale .25s ease}
.mark.look{width:120px;height:auto;margin-left:-60px;filter:brightness(1.1) drop-shadow(0 0 3px rgba(18,10,6,.95)) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.mark.on{opacity:1}
.mark.soft{opacity:.78;scale:.82}
@keyframes bob{50%{transform:translateY(-8px)}}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,179,71,.34),transparent 65%);pointer-events:none;mix-blend-mode:screen}

/* Nine-slice: corners and ends keep their drawn size, only the middle stretches to fit the text */
.nine{border:1px solid transparent;box-sizing:border-box;
  border-image-source:var(--img);
  border-image-slice:var(--st,26) var(--sr,26) var(--sb,26) var(--sl,26) fill;
  border-image-width:calc(var(--st,26)*var(--s,1)*1px) calc(var(--sr,26)*var(--s,1)*1px) calc(var(--sb,26)*var(--s,1)*1px) calc(var(--sl,26)*var(--s,1)*1px);
  border-image-repeat:stretch}
.cream{--img:url(assets/plaque_cream_small.webp)}
.red{--img:url(assets/plaque_red_small.webp)}

/* Clocktower interior scene */
#vsc,#tsc,#asc{position:absolute;inset:0}
#tsc,#asc{display:none;background:#140f14}
#asc,#csc{background:linear-gradient(#070b20 0%,var(--night-0) 18%,var(--night-1) 62%,#31416e 100%)}
#afar img,#cfar img{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 100%)}
#tsc.on,#asc.on{display:block}
#afar img{left:-300px;top:150px;width:3715px;height:896px}
#aworld{position:absolute;left:0;top:0;width:2400px;height:1080px;will-change:transform}
#aworld img{display:block;position:absolute;pointer-events:none;-webkit-user-drag:none}
#aleft,#aright{position:absolute;top:0;height:1080px;width:700px;background:linear-gradient(90deg,#120d0b,#2a1a12)}
#aright{background:linear-gradient(270deg,#120d0b,#2a1a12)}
#afg{position:absolute;left:0;top:0;will-change:transform}
#afg img{position:absolute;left:-420px;top:614px;display:block;pointer-events:none}
#csc{position:absolute;inset:0;display:none}
#csc.on{display:block}
#cfar img{left:-300px;top:150px;width:3715px;height:896px}
#cworld{position:absolute;left:0;top:0;width:2400px;height:1080px;will-change:transform}
#cworld img{display:block;position:absolute;pointer-events:none;-webkit-user-drag:none}
#cleft,#cright{position:absolute;top:0;height:1080px;width:700px;background:linear-gradient(90deg,#120d0b,#2a1a12)}
#cright{background:linear-gradient(270deg,#120d0b,#2a1a12)}
#cfg{position:absolute;left:0;top:0;will-change:transform}
#cfg img{position:absolute;left:-280px;top:536px;display:block;pointer-events:none}
#tfar img{left:-120px;top:0}
.subbtn{position:absolute;right:0;top:0;font:700 22px/1.1 var(--font-label);letter-spacing:.04em;color:var(--ink);padding:0 22px;height:56px;cursor:pointer;background-color:#22314f;border-radius:10px;--s:1}
.pager{display:flex;gap:14px;align-items:center;margin-top:10px;font:600 24px var(--font-body)}
.pager button{width:48px;height:42px;border-radius:8px;border:2px solid var(--brass);background:#f1dfb4;font:700 24px var(--font-body);color:var(--ink);cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.bd{position:relative;width:1100px;margin:0 auto}
.bd>img.base{display:block;width:100%;height:auto}
.bd .ov{position:absolute;overflow:hidden;display:flex;flex-direction:column;justify-content:center;font-family:var(--font-body);color:#3a2a18;line-height:1.15}
.bd .ov b{font:700 21px/1.1 var(--font-label);letter-spacing:.06em;color:#6e2a35;display:block;margin-bottom:4px}
.bd .ov i{font-style:italic}
.bd .ctr{text-align:center;align-items:center}
.bd .rib{color:#f6e3c0;font:700 24px/1 var(--font-label);letter-spacing:.14em;text-align:center;align-items:center;text-shadow:0 2px 2px rgba(0,0,0,.5)}
.bd .veil{background:rgba(40,28,22,.72);border-radius:10px;color:#f1dfb4;text-align:center;align-items:center;font:italic 600 24px/1.25 var(--font-body);padding:0 20px}
.bd .stamp{position:absolute;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.bd .ph{width:100%;height:100%;object-fit:cover;display:block}
.con{display:flex;gap:14px;align-items:flex-start;margin:8px 0;font:500 24px/1.3 var(--font-body)}
.con img{width:92px;flex:none;margin-top:4px}
.pvnote{font:italic 500 22px/1.3 var(--font-body);color:#6d5a40;margin:10px auto 0;width:1100px;text-align:center}
.pvbtn{display:inline-block;margin-left:10px;font:700 20px var(--font-label);border:2px solid var(--burgundy);color:var(--burgundy);background:transparent;border-radius:6px;padding:6px 12px;cursor:pointer}
#tworld{position:absolute;left:0;top:0;width:2400px;height:1080px;will-change:transform}
#tworld img{display:block;position:absolute;pointer-events:none;-webkit-user-drag:none}
#tleft,#tright{position:absolute;top:0;height:1080px;width:700px;background:linear-gradient(90deg,#1a1210,#2b1d18)}
#tright{background:linear-gradient(270deg,#1a1210,#2b1d18)}
#tfg{position:absolute;left:0;top:0;will-change:transform}
#tfg img{position:absolute;left:-420px;top:662px;display:block;pointer-events:none}
#tfg,#tfar{pointer-events:none}

/* Persistent category panel (left), as in the mockup */
#side{position:absolute;left:12px;top:182px;width:294px;height:559px;background:url(assets/nav_binder_6slots_COMPOSITE.webp) 0 0/100% 100% no-repeat;z-index:5}
.sbtn{position:absolute;left:62px;width:202px;height:74px;padding:0 16px 0 20px;--s:.97;background-color:transparent;display:flex;align-items:center;justify-content:flex-start;gap:9px;font:700 20px/1 var(--font-label);letter-spacing:.02em;white-space:nowrap;color:var(--ink);cursor:pointer;border-radius:12px;transition:filter .12s,transform .12s}
.sbtn svg{width:25px;height:25px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sbtn:hover{filter:brightness(1.08);transform:translateX(3px)}
.sbtn.first{color:#f6e3c0;text-shadow:0 1px 0 #3d1219}
.sbtn:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}

/* HUD */
.sprite{position:absolute;background-repeat:no-repeat;background-size:100% 100%}
#caseplate{position:absolute;left:26px;top:20px;width:fit-content;min-width:430px;padding:22px 64px 24px 64px;display:flex;flex-direction:column;gap:7px;--img:url(assets/panel_wide_title.webp);--sl:40;--sr:40;--st:34;--sb:34;--s:.98;z-index:6}
#caseplate .l1{font:500 20px/1 var(--font-label);letter-spacing:.16em;color:#8a6a3e}
#caseplate .l2{font:700 37px/1.1 var(--font-body);color:var(--ink);white-space:nowrap}
#caseplate .l3{font:400 21px/1 var(--font-body);color:#6d5a40;font-style:italic}
.hudbtn{position:absolute;width:76px;height:78px;border:0;padding:0;background-size:100% 100%;background-color:transparent;cursor:pointer;transition:transform .12s,filter .12s}
.hudbtn:hover{transform:scale(1.07);filter:brightness(1.15)}
.hudbtn:focus-visible,.choice:focus-visible,.tab:focus-visible,.pbtn:focus-visible{outline:3px solid #ffd27a;outline-offset:3px}
.hudbtn .k{position:absolute;right:-6px;bottom:-8px;font:700 13px/1 var(--font-label);background:#1b2340;color:#ffe3a6;border:1px solid var(--brass);border-radius:4px;padding:3px 5px}
#hint{position:absolute;left:50%;bottom:34px;translate:-50% 6px;scale:var(--hb,1);transform-origin:50% 100%;width:fit-content;max-width:720px;padding:17px 42px;--s:1;display:flex;align-items:center;justify-content:center;gap:11px;font:600 20px/1.1 var(--font-body);color:var(--ink);white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .25s ease,translate .25s ease,visibility 0s linear .25s}
#hint.on{opacity:1;visibility:visible;translate:-50% 0;transition-delay:0s}
#hint.instant,#hint.instant.on{transition:none}
#hint kbd{font:700 17px/1 var(--font-label);background:var(--burgundy);color:#f6e3c0;border-radius:5px;padding:6px 9px;box-shadow:0 2px 0 #3d1219}

/* Dialogue */
#dlg{position:absolute;left:200px;bottom:34px;width:1520px;height:296px;display:none;z-index:8} /* sized in whole pixels (1.4x the sprite) so the nine-slice has no seams; left is set from the width so the box stays centred */
#dlg.on{display:block}
#dlgbg{position:absolute;inset:0;--img:url(assets/dialogue_box_tall_portrait_ribbon.webp);--sl:410;--sr:100;--st:68;--sb:26;border-image-width:95px 140px 36px 574px}
#meas{position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font:400 36.5px/1.32 var(--font-body)}
#dlg .por{position:absolute;left:49px;top:59px;width:200px;height:196px;overflow:hidden;border-radius:5px}
#dlg .por img{transition:opacity .15s;width:200px;height:auto;display:block;filter:drop-shadow(0 2px 2px rgba(60,35,10,.4))}
#dlg .nm{position:absolute;left:275px;top:17px;width:267px;height:51px;box-sizing:border-box;padding-top:12px;transform:rotate(-3.2deg);transform-origin:50% 50%;display:grid;place-items:center;font:700 31px/1 var(--font-label);letter-spacing:.06em;color:#f6e3c0;text-shadow:0 1px 0 #3d1219}
#dlg .tx{position:absolute;left:316px;top:116px;right:196px;height:150px;font:400 36.5px/1.32 var(--font-body);color:var(--ink)}
:lang(ko) #dlg .tx,#dlg .tx.ko{font-size:33px;line-height:1.5}
#dlg .tx i{color:#6d4f2d}
#choices{position:absolute;left:50%;transform:translateX(-50%);bottom:352px;z-index:8;display:none;flex-direction:column;gap:12px;align-items:center}
#choices.on{display:flex}
.choice{width:fit-content;max-width:1100px;min-height:92px;padding:20px 48px;--s:1.3;font:600 31px/1.25 var(--font-body);color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s;background-color:transparent}
.choice:hover,.choice.sel{--img:url(assets/plaque_red_small.webp);color:#f6e3c0;transform:translateY(-2px)}

/* Case File */
#cf{position:absolute;inset:0;background:rgba(6,9,20,.82);display:none;z-index:20}
#cf.on{display:block}
#cfwrap{position:absolute;left:150px;top:70px;width:1620px;height:940px}
#nav{position:absolute;left:0;top:70px;width:386px;height:735px;background:url(assets/nav_binder_6slots_COMPOSITE.webp) 0 0/100% 100% no-repeat}
.tab{position:absolute;left:81px;width:265px;height:97px;background-color:transparent;border-radius:14px;font:700 26px/1 var(--font-label);letter-spacing:.05em;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:filter .12s;padding:0 24px;--s:1.25}
.tab:not(.nine){border:0}
.tab:hover{filter:brightness(1.07)}
.tab.act{color:#f6e3c0}
#page{position:absolute;left:392px;top:0;width:1228px;height:940px;border-radius:12px;border:5px solid var(--brass);background:radial-gradient(ellipse at 30% 10%,#f8ebc8,var(--paper) 55%,var(--paper-deep));box-shadow:inset 0 0 70px rgba(120,80,30,.32),0 20px 60px rgba(0,0,0,.6);color:var(--ink);overflow:hidden}
#page h2{margin:0;font:700 44px/1.1 var(--font-body)}
#page .eyebrow{font:500 18px/1 var(--font-label);letter-spacing:.2em;color:#8a6a3e}
#pg{position:absolute;inset:44px 56px 40px 56px}
#cfclose{position:absolute;right:-18px;top:-18px;width:78px;height:80px;border:0;background:url(assets/icon_close.webp) 0 0/100% 100%;cursor:pointer;z-index:3}
.obj{display:flex;gap:16px;align-items:center;font:600 30px/1.25 var(--font-body);padding:12px 0;border-bottom:1px dashed rgba(120,80,30,.35)}
.obj .bx{width:30px;height:30px;border:3px solid var(--brass);border-radius:5px;display:grid;place-items:center;font-size:24px;color:var(--burgundy);flex:none}
.obj.done{color:#7b6648;text-decoration:line-through;text-decoration-color:rgba(110,42,53,.5)}
.grid2{display:flex;gap:48px;align-items:flex-start}
.evgrid{position:relative;width:520px;height:548px;background:url(assets/grid_3x3_equal.webp) 0 0/100% 100% no-repeat;flex:none}
.evcell{position:absolute;width:138px;height:136px;display:grid;place-items:center;cursor:pointer;border:0;background:transparent}
.evcell img,.evcell svg{max-width:calc(100% - 16px);max-height:calc(100% - 16px)}
.evcell.sel{outline:4px solid var(--burgundy);outline-offset:-4px;border-radius:12px}
.evdesc{flex:1;min-width:0}
.evdesc h3{margin:0 0 6px;font:700 38px/1.1 var(--font-body)}
.evdesc p{font:400 28px/1.4 var(--font-body);margin:12px 0}
.tag{display:inline-block;font:700 17px/1 var(--font-label);letter-spacing:.14em;border:2px solid var(--burgundy);color:var(--burgundy);border-radius:4px;padding:5px 8px;margin-right:8px}
.pstrip{display:flex;gap:10px}
.ptile{width:92px;border:3px solid rgba(176,141,87,.75);border-radius:10px;background:rgba(255,248,225,.45);padding:5px 4px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink)}
.ptile .pf{width:78px;height:78px;overflow:hidden;border-radius:6px;background:#c8a96f;display:block}
.ptile .pf img{width:78px;height:78px;object-fit:cover;object-position:top;display:block}
.ptile b{font:700 18px/1.1 var(--font-body)}
.ptile.sel{outline:4px solid var(--burgundy);outline-offset:-4px}
.ptile.locked{opacity:.55;cursor:default}.ptile.locked img{filter:grayscale(1) brightness(.4)}
.pcap{font:400 22px/1.3 var(--font-body);color:#4a3a28;margin:8px 0 10px;min-height:30px}
.idwrap{position:relative;margin:0 auto}
.people{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.person{display:flex;gap:20px;align-items:center;padding:16px;border:3px solid rgba(176,141,87,.75);border-radius:10px;background:rgba(255,248,225,.45);min-height:150px}
.person .pt{width:110px;height:120px;overflow:hidden;border-radius:6px;background:#c8a96f;flex:none}
.person .pt img{width:110px;display:block}
.person.locked img{filter:grayscale(1) brightness(.35)}
.person b{display:block;font:700 30px/1.1 var(--font-body)}
.person span{font:400 22px/1.3 var(--font-body);color:#5a4630}
.tl{position:relative;width:925px;height:319px;background:url(assets/timeline_strip_5slots.webp) 0 0/100% 100% no-repeat;margin:18px 0}
.tlcard{position:absolute;width:112px;height:128px;top:70px;border:3px solid var(--brass);border-radius:6px;background:#fff6dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 22px/1.1 var(--font-body);text-align:center;box-shadow:0 3px 8px rgba(60,35,10,.35)}
.tlcard small{font:700 13px/1 var(--font-label);letter-spacing:.12em;color:var(--burgundy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.legend span{font:500 20px/1.2 var(--font-body)}
.notes li{font:400 29px/1.4 var(--font-body);margin:12px 0}
.mapbox{position:relative;width:640px;height:666px;background:url(assets/map_parchment.webp) 0 0/100% 100% no-repeat;flex:none}
.pin{position:absolute;width:20px;height:20px;border-radius:50%;margin:-10px 0 0 -10px;border:3px solid #fff3d6;box-shadow:0 0 0 3px var(--burgundy)}
.pinlab{position:absolute;font:700 22px/1 var(--font-label);letter-spacing:.06em;color:var(--burgundy);background:rgba(255,246,220,.85);padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translateY(-50%)}

/* Pause / inspect / end card */
.modal{position:absolute;inset:0;background:rgba(6,9,20,.74);display:none;z-index:30;place-items:center}
.modal.on{display:grid}
.card{width:760px;padding:44px 52px 40px;border-radius:12px;border:5px solid var(--brass);background:radial-gradient(ellipse at 30% 10%,#f8ebc8,var(--paper) 55%,var(--paper-deep));color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
.card h2{margin:6px 0 14px;font:700 46px/1.1 var(--font-body)}
.card p{font:400 28px/1.4 var(--font-body);margin:10px 0}

// Lamp positions in world px (from the Ground layer art). Light reaches R px sideways.
const LAMPS_V = [372, 1146, 1786, 2765, 3550], LAMPS_T = [121, 442, 813, 981, 1763], LAMPS_A = [150, 480, 2210], LAMPS_C = [60, 230, 594, 940, 1480, 2250]; let LAMPS = LAMPS_V; const LAMP_R = 470, AMBER_MAX = .46, COOL_BASE = .27;
const smooth = t => t*t*(3 - 2*t);
function lampLight(x){ // returns {l, r, total}: warm light arriving on the left and right edge of a character at x
  let l = 0, r = 0;
  for (const lx of LAMPS){
    const dx = lx - x, f = Math.max(0, 1 - Math.abs(dx)/LAMP_R); if (!f) continue;
    const c = smooth(f), k = Math.max(-1, Math.min(1, dx/140)); // under the lamp the light splits to both edges, no popping
    r += c * (.5 + .5*k); l += c * (.5 - .5*k);
  }
  return { l: Math.min(1, l), r: Math.min(1, r), total: Math.min(1, l + r) };
}
function lightActor(el, cx, dt, shW){
  const t = lampLight(cx), L = el._L || (el._L = { l:0, r:0, cool:COOL_BASE, sx:0, sw:1 });
  const a = Math.min(1, dt * 5);                      // eases over ~0.2 s, so there is no flicker even at run speed
  L.l += (t.l - L.l)*a; L.r += (t.r - L.r)*a;
  const total = Math.min(1, L.l + L.r);
  L.cool += (COOL_BASE*(1 - .8*total) - L.cool)*a;
  el.style.setProperty("--ll", (L.l*AMBER_MAX).toFixed(3)); el.style.setProperty("--lr", (L.r*AMBER_MAX).toFixed(3)); el.style.setProperty("--cool", L.cool.toFixed(3));
  const sh = el._sh; L.sx += (((L.l - L.r) * 14) - L.sx)*a; L.sw += ((1 + .22*total) - L.sw)*a; // shadow leans away from the lamp
  sh.style.width = Math.round(shW*1.0) + "px"; sh.style.left = Math.round(cx - shW/2 + L.sx) + "px"; sh.style.top = (FEET - 12) + "px";
  sh.style.transform = "scaleX(" + L.sw.toFixed(3) + ")"; sh.style.opacity = (.95 - .12*total).toFixed(3);
  return L;
}
