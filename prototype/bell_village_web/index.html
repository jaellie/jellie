<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+SC:wght@500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one fixed 1920x1080 stage scaled to the window; parallax layers behind a walkable snow path, UI laid over it. */
:root{
  --night-0:#0b1230;      /* sky top */
  --night-1:#1d2c55;      /* sky low */
  --snow:#8fa2c6;         /* path highlight */
  --snow-deep:#41517d;    /* path shadow */
  --paper:#f2e3bd;        /* parchment */
  --paper-deep:#dcc48f;   /* parchment shade */
  --ink:#3a2a1c;          /* dark brown text on paper */
  --brass:#b08d57;        /* trim */
  --burgundy:#6e2a35;     /* ribbon */
  --lamp:#ffb347;         /* lamp glow */
  --font-body:"Alegreya","Noto Serif KR",Georgia,serif;
  --font-label:"Alegreya SC","Noto Serif KR",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0}
body{background:#05070f;color:var(--paper);font-family:var(--font-body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#vp{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0b1230;outline:none}
#stage img{max-width:none}
.layer{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.layer img,#world img{display:block;position:absolute;pointer-events:none;-webkit-user-drag:none}
#sky{position:absolute;inset:0;background:linear-gradient(#070b20 0%,var(--night-0) 18%,var(--night-1) 62%,#31416e 100%)}
#far img{left:-150px;top:168px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 34%,#000 80%,transparent 100%)}
#mid img{left:0;top:55px}
#clockface{position:absolute;left:1551px;top:396px;width:140px;height:140px;filter:drop-shadow(0 0 6px rgba(255,200,120,.55))}
#path{position:absolute;left:0;right:0;top:928px;bottom:0;background:
  radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.16),transparent 55%),
  linear-gradient(var(--snow) 0,#6d80a8 18%,var(--snow-deep) 62%,#2a355a 100%)}
#path:before{content:"";position:absolute;left:0;right:0;top:-10px;height:16px;background:linear-gradient(transparent,rgba(143,162,198,.55))}
#world{position:absolute;left:0;top:0;width:3812px;height:1080px;will-change:transform}
#world .ground{left:0;top:644px}
.actor{position:absolute;pointer-events:none;transform-origin:50% 100%}
.actor img{position:static!important;display:block;width:100%;height:auto}
/* Lighting: overlays are clipped to the sprite's own alpha, so outlines, colours and animation are untouched */
.actor{isolation:isolate;--spr:none;--ll:0;--lr:0;--cool:.2}
.actor:before,.actor:after{content:"";position:absolute;inset:0;pointer-events:none;-webkit-mask-image:var(--spr);mask-image:var(--spr);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.actor:before{background:linear-gradient(180deg,rgba(78,104,170,calc(var(--cool)*.5)),rgba(44,64,132,var(--cool)));mix-blend-mode:multiply}
.actor:after{background:linear-gradient(90deg,rgba(255,176,72,var(--ll)),rgba(255,176,72,0) 64%),linear-gradient(270deg,rgba(255,176,72,var(--lr)),rgba(255,176,72,0) 64%);mix-blend-mode:soft-light}
#shadows{position:absolute;left:0;top:0}
.cs{position:absolute;height:24px;pointer-events:none;transform-origin:50% 50%;background:radial-gradient(ellipse at 50% 50%,rgba(6,10,28,.62) 0%,rgba(6,10,28,.36) 42%,rgba(6,10,28,0) 72%);filter:blur(1.2px)}
#fg{position:absolute;left:0;top:0;will-change:transform}
#fg img{position:absolute;left:0;top:884px;display:block;pointer-events:none}
.mark{position:absolute;width:78px;height:85px;margin-left:-39px;pointer-events:none;animation:bob 1.6s ease-in-out infinite;opacity:0;scale:1;transition:opacity .25s ease,scale .25s ease}
.mark.on{opacity:1}
.mark.soft{opacity:.34;scale:.7}
@keyframes bob{50%{transform:translateY(-8px)}}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,179,71,.34),transparent 65%);pointer-events:none;mix-blend-mode:screen}

/* Nine-slice: corners and ends keep their drawn size, only the middle stretches to fit the text */
.nine{border:1px solid transparent;box-sizing:border-box;
  border-image-source:var(--img);
  border-image-slice:var(--st,26) var(--sr,26) var(--sb,26) var(--sl,26) fill;
  border-image-width:calc(var(--st,26)*var(--s,1)*1px) calc(var(--sr,26)*var(--s,1)*1px) calc(var(--sb,26)*var(--s,1)*1px) calc(var(--sl,26)*var(--s,1)*1px);
  border-image-repeat:stretch}
.cream{--img:url(assets/plaque_cream_small.webp)}
.red{--img:url(assets/plaque_red_small.webp)}

/* Persistent category panel (left), as in the mockup */
#side{position:absolute;left:12px;top:182px;width:294px;height:559px;background:url(assets/nav_binder_6slots_COMPOSITE.webp) 0 0/100% 100% no-repeat;z-index:5}
.sbtn{position:absolute;left:65px;width:188px;height:68px;border:0;padding:0 12px;background:transparent;display:flex;align-items:center;justify-content:flex-start;gap:12px;font:700 22px/1 var(--font-label);letter-spacing:.04em;color:var(--ink);cursor:pointer;border-radius:10px;transition:filter .12s,transform .12s}
.sbtn svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sbtn:hover{filter:brightness(1.08);transform:translateX(3px)}
.sbtn.first{left:60px;width:200px;height:74px;color:#f6e3c0;text-shadow:0 1px 0 #3d1219}
.sbtn:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}

/* HUD */
.sprite{position:absolute;background-repeat:no-repeat;background-size:100% 100%}
#caseplate{position:absolute;left:26px;top:20px;width:fit-content;min-width:430px;padding:22px 64px 24px 64px;display:flex;flex-direction:column;gap:7px;--img:url(assets/panel_wide_title.webp);--sl:40;--sr:40;--st:34;--sb:34;--s:.98;z-index:6}
#caseplate .l1{font:500 20px/1 var(--font-label);letter-spacing:.16em;color:#8a6a3e}
#caseplate .l2{font:700 37px/1.1 var(--font-body);color:var(--ink);white-space:nowrap}
#caseplate .l3{font:400 21px/1 var(--font-body);color:#6d5a40;font-style:italic}
.hudbtn{position:absolute;width:76px;height:78px;border:0;padding:0;background-size:100% 100%;background-color:transparent;cursor:pointer;transition:transform .12s,filter .12s}
.hudbtn:hover{transform:scale(1.07);filter:brightness(1.15)}
.hudbtn:focus-visible,.choice:focus-visible,.tab:focus-visible,.pbtn:focus-visible{outline:3px solid #ffd27a;outline-offset:3px}
.hudbtn .k{position:absolute;right:-6px;bottom:-8px;font:700 13px/1 var(--font-label);background:#1b2340;color:#ffe3a6;border:1px solid var(--brass);border-radius:4px;padding:3px 5px}
#hint{position:absolute;left:50%;bottom:34px;translate:-50% 6px;scale:var(--hb,1);transform-origin:50% 100%;width:fit-content;max-width:720px;padding:17px 42px;--s:1;display:flex;align-items:center;justify-content:center;gap:11px;font:600 20px/1.1 var(--font-body);color:var(--ink);white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .25s ease,translate .25s ease,visibility 0s linear .25s}
#hint.on{opacity:1;visibility:visible;translate:-50% 0;transition-delay:0s}
#hint.instant,#hint.instant.on{transition:none}
#hint kbd{font:700 17px/1 var(--font-label);background:var(--burgundy);color:#f6e3c0;border-radius:5px;padding:6px 9px;box-shadow:0 2px 0 #3d1219}

/* Dialogue */
#dlg{position:absolute;left:200px;bottom:34px;width:1520px;height:296px;display:none;z-index:8} /* sized in whole pixels (1.4x the sprite) so the nine-slice has no seams; left is set from the width so the box stays centred */
#dlg.on{display:block}
#dlgbg{position:absolute;inset:0;--img:url(assets/dialogue_box_tall_portrait_ribbon.webp);--sl:410;--sr:100;--st:68;--sb:26;border-image-width:95px 140px 36px 574px}
#meas{position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font:400 36.5px/1.32 var(--font-body)}
#dlg .por{position:absolute;left:49px;top:59px;width:200px;height:196px;overflow:hidden;border-radius:5px}
#dlg .por img{width:200px;height:auto;display:block;filter:drop-shadow(0 2px 2px rgba(60,35,10,.4))}
#dlg .nm{position:absolute;left:275px;top:17px;width:267px;height:51px;display:grid;place-items:center;font:700 31px/1 var(--font-label);letter-spacing:.06em;color:#f6e3c0;text-shadow:0 1px 0 #3d1219}
#dlg .tx{position:absolute;left:287px;top:97px;right:158px;height:170px;font:400 36.5px/1.32 var(--font-body);color:var(--ink)}
:lang(ko) #dlg .tx,#dlg .tx.ko{font-size:33px;line-height:1.5}
#dlg .tx i{color:#6d4f2d}
#choices{position:absolute;left:50%;transform:translateX(-50%);bottom:352px;z-index:8;display:none;flex-direction:column;gap:12px;align-items:center}
#choices.on{display:flex}
.choice{width:fit-content;max-width:1100px;min-height:92px;padding:20px 48px;--s:1.3;font:600 31px/1.25 var(--font-body);color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s;background-color:transparent}
.choice:hover,.choice.sel{--img:url(assets/plaque_red_small.webp);color:#f6e3c0;transform:translateY(-2px)}

/* Case File */
#cf{position:absolute;inset:0;background:rgba(6,9,20,.82);display:none;z-index:20}
#cf.on{display:block}
#cfwrap{position:absolute;left:150px;top:70px;width:1620px;height:940px}
#nav{position:absolute;left:0;top:70px;width:386px;height:735px;background:url(assets/nav_binder_6slots_COMPOSITE.webp) 0 0/100% 100% no-repeat}
.tab{position:absolute;left:78px;width:230px;height:84px;background:transparent;font:700 25px/1 var(--font-label);letter-spacing:.05em;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:filter .12s;padding:0 18px;--s:1.1}
.tab:not(.nine){border:0}
.tab:hover{filter:brightness(1.07)}
.tab.cover{background-color:#22314f;border-radius:12px}
.tab.act{color:#f6e3c0}
#page{position:absolute;left:392px;top:0;width:1228px;height:940px;border-radius:12px;border:5px solid var(--brass);background:radial-gradient(ellipse at 30% 10%,#f8ebc8,var(--paper) 55%,var(--paper-deep));box-shadow:inset 0 0 70px rgba(120,80,30,.32),0 20px 60px rgba(0,0,0,.6);color:var(--ink);overflow:hidden}
#page h2{margin:0;font:700 44px/1.1 var(--font-body)}
#page .eyebrow{font:500 18px/1 var(--font-label);letter-spacing:.2em;color:#8a6a3e}
#pg{position:absolute;inset:44px 56px 40px 56px}
#cfclose{position:absolute;right:-18px;top:-18px;width:78px;height:80px;border:0;background:url(assets/icon_close.webp) 0 0/100% 100%;cursor:pointer;z-index:3}
.obj{display:flex;gap:16px;align-items:center;font:600 30px/1.25 var(--font-body);padding:12px 0;border-bottom:1px dashed rgba(120,80,30,.35)}
.obj .bx{width:30px;height:30px;border:3px solid var(--brass);border-radius:5px;display:grid;place-items:center;font-size:24px;color:var(--burgundy);flex:none}
.obj.done{color:#7b6648;text-decoration:line-through;text-decoration-color:rgba(110,42,53,.5)}
.grid2{display:flex;gap:48px;align-items:flex-start}
.evgrid{position:relative;width:520px;height:536px;background:url(assets/grid_3x3_panel_close.webp) 0 0/100% 100% no-repeat;flex:none}
.evcell{position:absolute;width:138px;height:136px;display:grid;place-items:center;cursor:pointer;border:0;background:transparent}
.evcell img,.evcell svg{max-width:92px;max-height:92px}
.evcell.sel{outline:4px solid var(--burgundy);outline-offset:-4px;border-radius:8px}
.evdesc{flex:1;min-width:0}
.evdesc h3{margin:0 0 6px;font:700 38px/1.1 var(--font-body)}
.evdesc p{font:400 28px/1.4 var(--font-body);margin:12px 0}
.tag{display:inline-block;font:700 17px/1 var(--font-label);letter-spacing:.14em;border:2px solid var(--burgundy);color:var(--burgundy);border-radius:4px;padding:5px 8px;margin-right:8px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.person{display:flex;gap:20px;align-items:center;padding:16px;border:3px solid rgba(176,141,87,.75);border-radius:10px;background:rgba(255,248,225,.45);min-height:150px}
.person .pt{width:110px;height:120px;overflow:hidden;border-radius:6px;background:#c8a96f;flex:none}
.person .pt img{width:110px;display:block}
.person.locked img{filter:grayscale(1) brightness(.35)}
.person b{display:block;font:700 30px/1.1 var(--font-body)}
.person span{font:400 22px/1.3 var(--font-body);color:#5a4630}
.tl{position:relative;width:925px;height:319px;background:url(assets/timeline_strip_5slots.webp) 0 0/100% 100% no-repeat;margin:18px 0}
.tlcard{position:absolute;width:112px;height:128px;top:70px;border:3px solid var(--brass);border-radius:6px;background:#fff6dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 22px/1.1 var(--font-body);text-align:center;box-shadow:0 3px 8px rgba(60,35,10,.35)}
.tlcard small{font:700 13px/1 var(--font-label);letter-spacing:.12em;color:var(--burgundy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.legend span{font:500 20px/1.2 var(--font-body)}
.notes li{font:400 29px/1.4 var(--font-body);margin:12px 0}
.mapbox{position:relative;width:640px;height:666px;background:url(assets/map_parchment.webp) 0 0/100% 100% no-repeat;flex:none}
.pin{position:absolute;width:20px;height:20px;border-radius:50%;margin:-10px 0 0 -10px;border:3px solid #fff3d6;box-shadow:0 0 0 3px var(--burgundy)}
.pinlab{position:absolute;font:700 22px/1 var(--font-label);letter-spacing:.06em;color:var(--burgundy);background:rgba(255,246,220,.85);padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translateY(-50%)}

/* Pause / inspect / end card */
.modal{position:absolute;inset:0;background:rgba(6,9,20,.74);display:none;z-index:30;place-items:center}
.modal.on{display:grid}
.card{width:760px;padding:44px 52px 40px;border-radius:12px;border:5px solid var(--brass);background:radial-gradient(ellipse at 30% 10%,#f8ebc8,var(--paper) 55%,var(--paper-deep));color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
.card h2{margin:6px 0 14px;font:700 46px/1.1 var(--font-body)}
.card p{font:400 28px/1.4 var(--font-body);margin:10px 0}
.card .eyebrow{font:500 18px/1 var(--font-label);letter-spacing:.2em;color:#8a6a3e}
.pbtn{display:block;width:fit-content;min-width:340px;margin:14px auto 0;padding:20px 58px;--s:1.25;background:transparent;font:700 28px/1.1 var(--font-body);color:var(--ink);cursor:pointer}
.pbtn:hover{--img:url(assets/plaque_red_small.webp);color:#f6e3c0}
#fade{position:absolute;inset:0;background:#02030a;opacity:0;pointer-events:none;transition:opacity .7s;z-index:40}
#fade.on{opacity:1;pointer-events:auto}
#toast{position:absolute;left:50%;top:40px;transform:translate(-50%,-14px);background:#1b2340;border:2px solid var(--brass);color:#ffe3a6;padding:12px 24px;border-radius:8px;font:600 26px/1 var(--font-body);opacity:0;transition:.3s;z-index:25;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* touch controls live outside the stage */
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:50;pointer-events:none}
#touch .g{display:flex;gap:12px;pointer-events:auto}
#touch button{width:68px;height:68px;border-radius:50%;border:3px solid var(--brass);background:rgba(18,26,52,.82);color:#ffe3a6;font:700 24px/1 var(--font-label)}
@media (pointer:coarse){#touch{display:flex}}
#rot{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top,0px));display:none;text-align:center;font:600 15px/1.3 var(--font-body);color:#ffe3a6;background:rgba(18,26,52,.88);border:1px solid var(--brass);border-radius:8px;padding:8px 12px;z-index:60;pointer-events:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}}
</style>

 <div id="stage" tabindex="0" aria-label="Bell Village">

  <div id="fg"><img src="assets/foreground.webp" width="4190" height="328" alt=""></div>

  <!-- HUD -->
  <div id="caseplate" class="nine"><div class="l1">CASE C-01</div><div class="l2" id="hudTitle">The Death of Edward</div><div class="l3" id="hudLoc">Bell Village</div></div>
  <button class="hudbtn" id="bCase" style="right:178px;top:26px;background-image:url(assets/icon_satchel.webp)" aria-label="Case File"><span class="k">Tab</span></button>

   <div id="cfwrap">

   </div>

  <div class="modal" id="endcard"><div class="card">

/* ---------- lighting ---------- */
// Lamp positions in world px (from the Ground layer art). Light reaches R px sideways.
const LAMPS = [372, 1146, 1786, 2765, 3550], LAMP_R = 470, AMBER_MAX = .46, COOL_BASE = .27;
const smooth = t => t*t*(3 - 2*t);
function lampLight(x){ // returns {l, r, total}: warm light arriving on the left and right edge of a character at x
  let l = 0, r = 0;
  for (const lx of LAMPS){
    const dx = lx - x, f = Math.max(0, 1 - Math.abs(dx)/LAMP_R); if (!f) continue;
    const c = smooth(f), k = Math.max(-1, Math.min(1, dx/140)); // under the lamp the light splits to both edges, no popping
    r += c * (.5 + .5*k); l += c * (.5 - .5*k);
  }
  return { l: Math.min(1, l), r: Math.min(1, r), total: Math.min(1, l + r) };
}
function lightActor(el, cx, dt, shW){
  const t = lampLight(cx), L = el._L || (el._L = { l:0, r:0, cool:COOL_BASE, sx:0, sw:1 });
  const a = Math.min(1, dt * 5);                      // eases over ~0.2 s, so there is no flicker even at run speed
  L.l += (t.l - L.l)*a; L.r += (t.r - L.r)*a;
  const total = Math.min(1, L.l + L.r);
  L.cool += (COOL_BASE*(1 - .8*total) - L.cool)*a;
  el.style.setProperty("--ll", (L.l*AMBER_MAX).toFixed(3)); el.style.setProperty("--lr", (L.r*AMBER_MAX).toFixed(3)); el.style.setProperty("--cool", L.cool.toFixed(3));
  const sh = el._sh; L.sx += (((L.l - L.r) * 14) - L.sx)*a; L.sw += ((1 + .22*total) - L.sw)*a; // shadow leans away from the lamp
  sh.style.width = Math.round(shW*1.0) + "px"; sh.style.left = Math.round(cx - shW/2 + L.sx) + "px"; sh.style.top = (FEET - 12) + "px";
  sh.style.transform = "scaleX(" + L.sw.toFixed(3) + ")"; sh.style.opacity = (.95 - .12*total).toFixed(3);
  return L;
}

  full = tr(n.t); const tx = $("dTx"); tx.className = "tx" + (lang==="ko"?" ko":""); clearInterval(typing);
  sizeDlg(full);
  $("choices").classList.remove("on"); $("choices").innerHTML = "";
  if (!anim){ tx.textContent = full; showChoices(); return; }
  let i = 0; tx.textContent = ""; typing = setInterval(()=>{ i += 1; tx.textContent = full.slice(0,i); if (i >= full.length){ clearInterval(typing); typing = null; showChoices(); } }, 22);
}
function sizeDlg(text){
  const m = $("meas"); m.style.fontSize = lang==="ko" ? "33px" : "36.5px"; m.textContent = text;
  const w = Math.min(m.offsetWidth + 14, 1075); // text width, one line, capped at the full text area
  const box = Math.max(820, 287 + w + 158);
  const bw = Math.min(1520, box); $("dlg").style.width = bw + "px"; $("dlg").style.left = Math.round((STAGE_W - bw)/2) + "px";
}
function showChoices(){
  const n = D[cur]; if (!n.ch) return; const box = $("choices"); box.innerHTML = "";
  n.ch.forEach((c,i)=>{ const b = document.createElement("button"); b.className = "choice nine cream"; b.textContent = tr(c.t); b.addEventListener("click", ()=>pick(i)); box.appendChild(b); });
  box.classList.add("on"); box.firstChild.classList.add("sel");
}
function pick(i){ const n = D[cur]; const c = n.ch[i]; applyNode(n); goto(c.go); }
function applyNode(n){ if (n.set) setf(n.set); if (n.note) addNote(NOTES[n.note]); save(); }
function advance(){
  if (typing){ clearInterval(typing); typing = null; $("dTx").textContent = full; showChoices(); return; }
  const n = D[cur]; if (n.ch){ const sel = document.querySelector('#choices .choice.sel'); if (sel) sel.click(); return; }
  applyNode(n); goto(n.next || null);
}
function goto(id){ if (!id){ endDlg(); return; } cur = id; renderDlg(true); }
function endDlg(){ $("dlg").classList.remove("on"); $("choices").classList.remove("on"); cur = null; mode = "play"; clearInterval(typing); typing = null; save(); }

/* inspect */
function evIcon(e, size){
  if (e.icon === "clock") return '<svg viewBox="-70 -70 140 140" width="'+size+'" height="'+size+'"><use href="#clk" x="-70" y="-70" width="140" height="140"/></svg>';
  return '<img src="assets/paper_scrap.webp" alt="" style="height:'+size+'px">';
}
function inspect(id){
  const e = EV[id]; mode = "modal"; const c = $("inspectCard");
  c.innerHTML = '<div class="eyebrow">'+e.tag+'</div><h2>'+tr(e.name)+'</h2><div style="margin:8px 0">'+evIcon(e, id==="clock"?300:150)+'</div><p>'+tr(e.desc)+'</p><button class="pbtn nine cream" id="iClose">'+tr(UI.close)+'</button>';
  $("inspect").classList.add("on"); $("iClose").focus();
  $("iClose").onclick = ()=>{ $("inspect").classList.remove("on"); mode = "play"; addEv(id); stage.focus(); };
}

/* pause */
function openPause(){ if (mode!=="play") return; mode = "modal"; $("pause").classList.add("on"); $("pResume").focus(); }
function closePause(){ $("pause").classList.remove("on"); mode = "play"; stage.focus(); }

/* enter tower */
function enterTower(){
  mode = "modal"; $("fade").classList.add("on");
  setTimeout(()=>{ $("endcard").classList.add("on"); $("fade").classList.remove("on"); $("eBack").focus(); }, 800);
}
$("eBack").onclick = ()=>{ $("endcard").classList.remove("on"); P.x = 2640; mode = "play"; stage.focus(); };

/* case file */
let tab = 0, selEv = null;
const SLOTS = [85,174,259,344,429,514];
function renderNav(){
  const nav = $("nav"); nav.innerHTML = ""; const labs = tr(UI.tabs);
  const k = 386/309;
  SLOTS.forEach((cy,i)=>{
    const b = document.createElement("button"); b.className = "tab" + (i===tab ? " nine red act" : (i===0 ? " nine cream cover" : ""));
    b.style.top = Math.round(cy*k - 42) + "px"; b.style.left = (i===0?72:78) + "px"; b.textContent = labs[i];
    if (i===0){ b.style.width = "274px"; b.style.height = "108px"; b.style.left = "74px"; b.style.top = Math.round(cy*k-54)+"px"; }
    b.onclick = ()=>{ tab = i; renderCF(); }; nav.appendChild(b);
  });
}
function renderCF(){
  renderNav(); const pg = $("pg"); const labs = tr(UI.tabs);
  let h = '<div class="eyebrow">CASE C-01 · '+tr(UI.loc)+'</div><h2>'+labs[tab]+'</h2><div style="height:18px"></div>';
  if (tab===0){
    h += '<div style="font:italic 400 28px/1.3 var(--font-body);color:#6d5a40;margin-bottom:14px">'+tr(UI.case)+'</div><div class="eyebrow" style="margin:10px 0 6px">'+tr(UI.objHead).toUpperCase()+'</div>';
    const done = [has("nini.done")||has("nini.letters"), S.ev.includes("notice"), S.ev.includes("clock"), has("ck.bear"), false];
    tr(UI.objs).forEach((o,i)=>{ h += '<div class="obj'+(done[i]?' done':'')+'"><div class="bx">'+(done[i]?'&#10003;':'')+'</div><div>'+o+'</div></div>'; });
  } else if (tab===1){
    h += '<div class="people">';
    h += '<div class="person"><div class="pt"><img src="assets/nini_front.webp" alt=""></div><div><b>Nini</b><span>'+(lang==="ko"?"기록실 조수. 에드워드를 마지막으로 본 사람 중 하나.":"Archive assistant. One of the last to see Edward.")+'</span></div></div>';
    const met = has("ck.bear");
    h += '<div class="person'+(met?'':' locked')+'"><div class="pt"><img src="assets/clockkeeper_front.webp" alt=""></div><div><b>'+(met?tr(SP.ck.name):'?')+'</b><span>'+(met?(lang==="ko"?"밤 근무. 11시 40분쯤 계단을 오르는 곰을 보았다.":"Night shift. Saw a bear on the stairs around 11:40."):tr(UI.unmet))+'</span></div></div>';
    h += '</div>';
  } else if (tab===2){
    h += '<div class="grid2"><div class="evgrid" id="evg"></div><div class="evdesc" id="evd"></div></div>';
  } else if (tab===3){
    h += '<div class="legend">'+tr(UI.legend).map(s=>'<span><span class="tag">'+s[0]+'</span>'+s.slice(2)+'</span>').join('')+'</div><div class="tl" id="tl"></div><p style="font:italic 400 28px/1.4 var(--font-body);color:#5a4630;max-width:900px">'+tr(UI.tlNote)+'</p>';
  } else if (tab===4){
    h += S.notes.length ? '<ul class="notes">'+S.notes.map(o=>'<li>'+tr(o.n)+'</li>').join('')+'</ul>' : '<p style="font:italic 400 28px var(--font-body)">'+tr(UI.empty)+'</p>';
  } else {
    h += '<div class="mapbox"><div class="pin" style="left:168px;top:372px;background:#c4453a"></div><div class="pinlab" style="left:194px;top:372px">'+tr(UI.here)+'</div><div class="pin" style="left:346px;top:300px;background:#d9a441"></div><div class="pinlab" style="left:372px;top:300px">'+tr(UI.tower)+'</div></div>';
  }
  pg.innerHTML = h;
  if (tab===2) renderEvGrid(); if (tab===3) renderTl();
}
function renderEvGrid(){
  const g = $("evg"); const cx = [31,141,253], cy = [60,176,288], k = 520/385;
  S.ev.forEach((id,i)=>{ const b = document.createElement("button"); b.className = "evcell"+(selEv===id?" sel":""); const col=i%3,row=Math.floor(i/3);
    b.style.left = Math.round((cx[col]-4)*k)+"px"; b.style.top = Math.round(cy[row]*k)+"px"; b.innerHTML = evIcon(EV[id], 86); b.title = tr(EV[id].name);
    b.onclick = ()=>{ selEv = id; renderCF(); }; g.appendChild(b); });
  if (!selEv && S.ev.length) selEv = S.ev[S.ev.length-1];
  g.querySelectorAll('.evcell').forEach((c,i)=>c.classList.toggle('sel', S.ev[i]===selEv));
  const d = $("evd"); const e = selEv && EV[selEv];
  d.innerHTML = e ? '<span class="tag">'+e.tag+'</span><h3>'+tr(e.name)+'</h3><p>'+tr(e.desc)+'</p>' : '<p style="font:italic 400 28px/1.4 var(--font-body);color:#6d5a40">'+(S.ev.length? (lang==="ko"?"증거를 선택하면 설명이 나온다.":"Select an item to read about it.") : tr(UI.empty))+'</p>';
}
function renderTl(){
  const t = $("tl"); const k = 925/661; const sx = [78,172,278,382,487];
  if (S.ev.includes("clock")){ const c = document.createElement("div"); c.className = "tlcard"; c.style.left = Math.round((sx[2]-6)*k)+"px"; c.style.top = Math.round(46*k)+"px";
    c.innerHTML = '<small>C · CLOCK</small>11:47<span style="font:400 15px/1.1 var(--font-body)">'+(lang==="ko"?"탑시계 멈춤":"Tower clock stopped")+'</span>'; t.appendChild(c); }
}
function openCF(){ if (mode!=="play") return; mode = "cf"; $("cf").classList.add("on"); renderCF(); }
function closeCF(){ $("cf").classList.remove("on"); mode = "play"; stage.focus(); }
$("cfclose").onclick = closeCF; $("bCase").onclick = openCF; $("bSet").onclick = openPause; $("tC").onclick = ()=> mode==="cf"?closeCF():openCF();
$("bLook").onclick = ()=>{ peek = 3; };
$("pResume").onclick = closePause; $("pLang").onclick = ()=>setLang(lang==="en"?"ko":"en");
$("pReset").onclick = ()=>{ try{ localStorage.removeItem(SAVE_KEY);}catch(e){} S = {x:520,flags:{},ev:[],notes:[],lang}; P.x = 520; closePause(); toast(lang==="ko"?"처음부터 다시 시작":"Restarted"); };

/* ---------- input ---------- */
function hideHintNow(){ const h = $("hint"); h.classList.add("instant"); h.classList.remove("on"); }
function act(){ if (mode==="dlg") advance(); else if (mode==="play" && near){ hideHintNow(); near.run(); } }
window.addEventListener("keydown", e=>{
  const k = e.key;
  if (["ArrowLeft","ArrowRight","Tab"," "].includes(k)) e.preventDefault();
  if (k==="Tab"){ if (mode==="cf") closeCF(); else openCF(); return; }
  if (k==="Escape"){ if (mode==="cf") closeCF(); else if (mode==="modal" && $("pause").classList.contains("on")) closePause(); else if (mode==="modal" && $("inspect").classList.contains("on")) $("iClose").click(); else if (mode==="play") openPause(); return; }
  if ((k==="e"||k==="E") && mode==="modal" && $("inspect").classList.contains("on")){ $("iClose").click(); return; }
  if (k==="e"||k==="E"||k==="Enter"||k===" "){ if (e.target && e.target.tagName==="BUTTON" && mode!=="dlg") return; act(); return; }
  if (k==="q"||k==="Q"){ peek = 3; return; }
  if (mode==="dlg" && (k==="ArrowUp"||k==="ArrowDown"||k==="w"||k==="s")){
    const bs = [...document.querySelectorAll("#choices .choice")]; if (!bs.length) return; let i = bs.findIndex(b=>b.classList.contains("sel")); bs.forEach(b=>b.classList.remove("sel"));
    i = (i + ((k==="ArrowDown"||k==="s")?1:-1) + bs.length) % bs.length; bs[i].classList.add("sel"); return; }
  if (mode==="dlg" && (k==="1"||k==="2")){ const bs = document.querySelectorAll("#choices .choice"); if (bs[+k-1]) bs[+k-1].click(); return; }
  keys.add(k.toLowerCase());
});
window.addEventListener("keyup", e=>keys.delete(e.key.toLowerCase()));
window.addEventListener("blur", ()=>keys.clear());
$("dlg").addEventListener("click", ()=>{ if (mode==="dlg") advance(); });
const hold = (id, key)=>{ const b = $(id); const on = e=>{ e.preventDefault(); keys.add(key); }, off = ()=>keys.delete(key); b.addEventListener("pointerdown", on); ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev, off)); };
hold("tL","arrowleft"); hold("tR","arrowright"); $("tE").addEventListener("pointerdown", e=>{ e.preventDefault(); act(); });

/* ---------- loop ---------- */
let cam = 0, last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  P.moving = false;
  if (mode==="play"){
    const l = keys.has("arrowleft")||keys.has("a"), r = keys.has("arrowright")||keys.has("d");
    const run = keys.has("shift"); const sp = run ? 430 : 270;
    if (l !== r){ P.x += (r?1:-1) * sp * dt; P.face = r ? "right" : "left"; P.moving = true; P.walk += dt * (run?11:8); }
    P.x = Math.max(470, Math.min(W - 160, P.x));
  }
  const target = Math.max(0, Math.min(CAM_MAX, P.x - STAGE_W/2));
  cam += (target - cam) * Math.min(1, dt * 4.5); if (Math.abs(target-cam)<.05) cam = target;
  $("far").style.transform = "translate3d("+(-cam*0.1).toFixed(2)+"px,0,0)";
  $("mid").style.transform = "translate3d("+(-cam*0.35).toFixed(2)+"px,0,0)";
  $("world").style.transform = "translate3d("+(-cam).toFixed(2)+"px,0,0)";
  $("fg").style.transform = "translate3d("+(-cam*1.2).toFixed(2)+"px,0,0)";
  place(); applyLight(dt);
  // nearest interactable
  near = null; let best = 140;
  if (mode==="play"){ IA.forEach(i=>{ const d = Math.abs(P.x - i.x()); if (d < best){ best = d; near = i; } }); }
  if (peek > 0) peek -= dt;
  const hint = $("hint"), showHint = !!(near && mode==="play");
  IA.forEach(i=>{ const on = (near===i && mode==="play") || (peek>0 && mode==="play"); i.el.classList.toggle("on", on); i.el.classList.toggle("soft", near===i && showHint); });
  if (showHint){ hint.classList.remove("instant"); if ($("hintTx").dataset.k !== near.id){ $("hintTx").dataset.k = near.id; $("hintTx").textContent = tr(near.label); } hint.classList.add("on"); }
  else { if (mode!=="play") hint.classList.add("instant"); hint.classList.remove("on"); }
  requestAnimationFrame(frame);
}

/* ---------- fit ---------- */
function fit(){ const s = Math.min(innerWidth/STAGE_W, innerHeight/STAGE_H);
  stage.style.setProperty("--hb", Math.min(1.7, Math.max(1, 14/(20*s))).toFixed(3)); /* keeps prompt text at least ~14 px on small screens */
  stage.style.transform = "scale("+s+")"; stage.style.left = ((innerWidth - STAGE_W*s)/2)+"px"; stage.style.top = ((innerHeight - STAGE_H*s)/2)+"px"; }
addEventListener("resize", fit);

load(); P.x = S.x; cam = Math.max(0, Math.min(CAM_MAX, P.x - STAGE_W/2)); fit(); applyLang(); stage.focus();
setInterval(()=>{ S.x = Math.round(P.x); save(); }, 4000);
window.__bv = { lamp:lampLight, light:()=>({l:bgb._L&&bgb._L.l,r:bgb._L&&bgb._L.r,cool:bgb._L&&bgb._L.cool}), P, S, setx:x=>{P.x=x}, IA, openCF, closeCF, startDlg, inspect, setLang, getMode:()=>mode, tab:i=>{tab=i; if(mode==="cf") renderCF();}, addEv };
requestAnimationFrame(frame);
})();
</script>
