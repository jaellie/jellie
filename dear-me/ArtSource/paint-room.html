<!doctype html><meta charset="utf-8">
<!-- Present-day room, rainy dusk. Portrait 9:16. Rules: ART_DIRECTION.md.
     Coordinates are normalized (0..1, top-left) and match rooms.json hotspots.
     Keep important things inside x 0.1–0.9 (tall phones crop the sides) and above y 0.75 (dialogue panel). -->
<canvas id="c"></canvas>
<script src="painter-lib.js"></script>
<script>
init(1080, 1920);
paper();

// ---- wall: warm by the lamp (left), violet-blue toward the window light; floor below
wash([[-0.03,-0.02],[1.03,-0.02],[1.03,0.665],[-0.03,0.665]], linear(0.05,0.6,0.95,0.1,[[0,'#e9a272'],[0.35,'#c08fa6'],[0.7,'#8584c4'],[1,'#5f6cb8']]), {alpha:.8, rough:22, layers:3, edge:.1});
{ const tg=g.createLinearGradient(0,0,0,H*.4); tg.addColorStop(0,'rgba(70,80,150,.3)'); tg.addColorStop(1,'rgba(70,80,150,0)');
  g.save(); g.globalCompositeOperation='multiply'; g.fillStyle=tg; g.fillRect(0,0,W,H*.4); g.restore(); }
wash([[-0.03,0.655],[1.03,0.655],[1.03,1.03],[-0.03,1.03]], linear(0.1,0.66,0.9,0.98,[[0,'#b67e76'],[0.5,'#7d6ca2'],[1,'#4f5694']]), {alpha:.75, rough:16, layers:3, edge:.1});
ink([[-0.01,0.66],[1.01,0.662]],{w:2.6,gap:false});

// ---- window: the richest color in the scene
const gx0=0.22, gx1=0.78, gy0=0.115, gy1=0.385;
reserve([[gx0,gy0],[gx1,gy0],[gx1,gy1],[gx0,gy1]],'#e9e6ea');
paint([[gx0,gy0],[gx1,gy0],[gx1,gy1],[gx0,gy1]], linear(0.5,gy0,0.5,gy1,[[0,'#2c2f6e'],[0.26,'#5b4a9c'],[0.5,'#b45f97'],[0.7,'#f08a6a'],[0.86,'#ffb86b'],[1,'#ffd9a0']]), {rough:2, blur:.6});
g.save(); g.beginPath(); g.rect(X(gx0),Y(gy0),X(gx1-gx0),Y(gy1-gy0)); g.clip();
for (let i=0;i<7;i++){ const cx=rnd(gx0+.04,gx1-.04), cy=rnd(.14,.24), rw=rnd(.08,.16);
  paint([[cx-rw,cy+.012],[cx-rw*.4,cy-.012],[cx+rw*.5,cy-.015],[cx+rw,cy+.008],[cx+rw*.6,cy+.024],[cx-rw*.6,cy+.024]], linear(cx,cy-.018,cx,cy+.026,[[0,'rgba(70,60,130,.55)'],[0.6,'rgba(150,90,150,.5)'],[1,'rgba(255,170,130,.6)']]), {rough:10, blur:3}); }
glow(0.5,0.37,320,'#ffb36b',.6,'screen');
// rooftops with warm windows
const sky=[[gx0,0.33],[0.27,0.33],[0.27,0.31],[0.33,0.31],[0.33,0.325],[0.40,0.325],[0.40,0.295],[0.46,0.295],[0.46,0.32],[0.54,0.32],[0.54,0.30],[0.61,0.30],[0.61,0.328],[0.68,0.328],[0.68,0.31],[gx1,0.31],[gx1,gy1],[gx0,gy1]];
paint(sky, linear(0.5,0.29,0.5,gy1,[[0,'#4a3a7c'],[1,'#2a2557']]), {alpha:.93, rough:1, blur:.5});
for (let i=0;i<46;i++){ const x=rnd(gx0+.01,gx1-.02), y=rnd(.325,.38); g.save(); g.fillStyle=i%4?'#ffcf7a':'#ffe9b0'; g.globalAlpha=.9; g.fillRect(X(x),Y(y),5,7); g.restore(); }
for (let i=0;i<18;i++){ glow(rnd(gx0,gx1),rnd(.33,.38),rnd(8,18),'#ffd08a',.8,'screen'); }
g.save(); g.strokeStyle='rgba(255,255,255,.55)'; g.lineCap='round';
for (let i=0;i<80;i++){ const x=X(rnd(gx0,gx1)), y=Y(rnd(gy0,gy1)), l=rnd(16,50); g.lineWidth=rnd(1,2); g.beginPath(); g.moveTo(x,y); g.lineTo(x-l*.08,y+l); g.stroke(); }
g.restore(); g.restore();
inkRect(0.20,0.095,0.60,0.31,{w:3}); inkRect(gx0,gy0,gx1-gx0,gy1-gy0,{w:2.2}); ink([[0.5,gy0],[0.5,gy1]],{w:2.2});
reserve([[0.19,0.405],[0.81,0.405],[0.81,0.418],[0.19,0.418]],'#efe5d0'); ink([[0.185,0.418],[0.815,0.418]],{w:2.6});
// warm window light falling down the wall and onto the floor
paint([[0.22,0.42],[0.78,0.42],[0.92,0.97],[0.10,0.97]], linear(0.5,0.42,0.5,0.97,[[0,'rgba(255,170,120,.32)'],[0.5,'rgba(240,140,150,.16)'],[1,'rgba(240,140,150,0)']]), {rough:10, blur:8});
// curtains
for (const [cx,dir] of [[0.11,1],[0.79,-1]]){
  const c=[[cx,0.075],[cx+0.10,0.075],[cx+0.11,0.47],[cx-0.01,0.47]];
  reserve(c); wash(c, linear(cx+(dir>0?0.11:0),0.3,cx+(dir>0?0:0.11),0.3,[[0,'#ffb08a'],[0.5,'#e38a8e'],[1,'#a86a8e']]),{alpha:.75,rough:6});
  ink([[cx,0.075],[cx-0.01,0.47]],{w:2}); ink([[cx+0.10,0.075],[cx+0.11,0.47]],{w:2});
  ink([[cx+0.035,0.09],[cx+0.032,0.46]],{w:1.4}); ink([[cx+0.07,0.09],[cx+0.074,0.46]],{w:1.4});
}
ink([[0.08,0.073],[0.92,0.073]],{w:3});

// ---- calendar on the wall (right)
reserve([[0.70,0.465],[0.88,0.465],[0.88,0.575],[0.70,0.575]],'#f3ecdc');
wash([[0.70,0.465],[0.88,0.465],[0.88,0.485],[0.70,0.485]], linear(0.7,0.47,0.88,0.47,[[0,'#d9704a'],[1,'#b5506a']]),{alpha:.7,rough:2});
inkRect(0.70,0.465,0.18,0.11,{w:2});
for (let r=0;r<4;r++) ink([[0.71,0.50+r*0.018],[0.87,0.50+r*0.018]],{w:1,gap:false,overshoot:2});
for (let c=1;c<6;c++) ink([[0.70+c*0.03,0.49],[0.70+c*0.03,0.57]],{w:1,gap:false,overshoot:2});
ink([[0.79,0.452],[0.79,0.466]],{w:1.6});

// ---- desk with lamp, cup, sticky note, phone (left)
for (const leg of [[0.08,0.555,0.115,0.70],[0.50,0.555,0.535,0.70]]) { const [a,b,c,d]=leg; reserve([[a,b],[c,b],[c,d],[a,d]]);
  wash([[a,b],[c,b],[c,d],[a,d]], linear(a,b,a,d,[[0,'#c88a56'],[1,'#8d6048']]),{alpha:.75,rough:2}); ink([[a,b],[a,d]],{w:2.4}); ink([[c,b],[c,d]],{w:1.8}); }
reserve([[0.05,0.525],[0.63,0.525],[0.63,0.555],[0.05,0.555]]);
wash([[0.05,0.525],[0.63,0.525],[0.63,0.555],[0.05,0.555]], linear(0.05,0.53,0.63,0.53,[[0,'#f0a85c'],[1,'#a8735a']]),{alpha:.82,rough:3});
inkRect(0.05,0.525,0.58,0.03,{w:2.6});
// lamp
const shade=[[0.12,0.435],[0.24,0.435],[0.265,0.475],[0.095,0.475]];
reserve(shade,'#fbf3df'); wash(shade, linear(0.18,0.435,0.18,0.475,[[0,'#ffd27a'],[1,'#f39a4a']]),{alpha:.72,rough:2}); ink(shade,{w:2.2,close:true});
ink([[0.18,0.475],[0.18,0.515]],{w:2.4}); reserve([[0.14,0.512],[0.22,0.512],[0.22,0.525],[0.14,0.525]],'#8a7262'); inkRect(0.14,0.512,0.08,0.013,{w:2});
glow(0.18,0.47,700,'#ffb45c',.62,'screen'); glow(0.18,0.47,260,'#fff1c9',.55,'screen'); glow(0.24,0.54,380,'#ffb45a',.4,'screen');
// cup and sticky note
reserve([[0.27,0.497],[0.32,0.497],[0.316,0.524],[0.274,0.524]],'#f6efe2');
ink([[0.27,0.497],[0.274,0.524],[0.316,0.524],[0.32,0.497]],{w:1.8}); ink([[0.27,0.498],[0.32,0.498]],{w:1.6}); ink([[0.32,0.503],[0.336,0.507],[0.319,0.517]],{w:1.6,gap:false});
wash([[0.235,0.508],[0.265,0.506],[0.266,0.524],[0.236,0.525]], linear(0.24,0.506,0.26,0.525,[[0,'#ffe27a'],[1,'#f2b34a']]),{alpha:.75,rough:1});
// phone
const ph=[[0.40,0.513],[0.47,0.512],[0.473,0.524],[0.402,0.525]];
paint(ph, linear(0.4,0.512,0.47,0.525,[[0,'#3a3f5a'],[1,'#22263a']]), {rough:1, blur:.4}); glow(0.435,0.518,70,'#bcd2ff',.55,'screen'); ink(ph,{w:1.8,close:true});

// ---- rug, crumpled draft, the box (floor)
const rug=[[0.10,0.74],[0.70,0.735],[0.76,0.86],[0.04,0.865]];
reserve(rug); wash(rug, linear(0.1,0.78,0.76,0.82,[[0,'#f0a084'],[1,'#a87aa8']]), {alpha:.65, rough:8}); ink(rug,{w:1.8,close:true});
const draft=[[0.21,0.768],[0.34,0.762],[0.345,0.806],[0.215,0.81]];
g.save(); g.fillStyle='#f8f2e6'; roughPath(g, draft.map(([x,y])=>[X(x),Y(y)]), 6); g.fill(); g.restore();
ink(draft,{w:1.8,close:true}); ink([[0.23,0.775],[0.27,0.792],[0.32,0.776]],{w:1.2}); ink([[0.24,0.80],[0.29,0.783]],{w:1.2});
const box=[[0.57,0.645],[0.86,0.645],[0.86,0.77],[0.57,0.77]];
reserve(box);
wash([[0.57,0.668],[0.86,0.668],[0.86,0.77],[0.57,0.77]], linear(0.57,0.668,0.86,0.77,[[0,'#f0b06e'],[1,'#b0786a']]),{alpha:.78,rough:3});
wash([[0.57,0.645],[0.86,0.645],[0.86,0.668],[0.57,0.668]], linear(0.57,0.645,0.86,0.668,[[0,'#ffd09a'],[1,'#d9a07a']]),{alpha:.7,rough:2});
inkRect(0.57,0.645,0.29,0.125,{w:2.6}); ink([[0.57,0.668],[0.86,0.668]],{w:2}); ink([[0.715,0.645],[0.715,0.668]],{w:1.6});
g.save(); g.font='italic 34px Georgia'; g.fillStyle=SEPIA; g.globalAlpha=.75; g.fillText('2018 —', X(.62),Y(.735)); g.restore();

// ---- light, vignette, page edge, tooth
const vg=g.createRadialGradient(W*.5,H*.42,H*.3,W*.5,H*.5,H*.75); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(90,60,120,.2)');
g.save(); g.globalCompositeOperation='multiply'; g.fillStyle=vg; g.fillRect(0,0,W,H); g.restore();
const tooth=g.getImageData(0,0,W,H), td=tooth.data; for (let i=0;i<td.length;i+=4){ const k=0.94+0.06*R(); td[i]*=k; td[i+1]*=k; td[i+2]*=k; } g.putImageData(tooth,0,0);
document.title='done';
</script>
