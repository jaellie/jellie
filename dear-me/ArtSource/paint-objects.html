<!doctype html><meta charset="utf-8">
<!-- Objects that appear only after the box is opened; transparent PNGs placed over the room painting. -->
<canvas id="c"></canvas>
<script src="painter-lib.js"></script>
<script>
const which = location.hash.slice(1);
init(320, 200);
if (which === 'diary') {
  reserve([[0.12,0.18],[0.86,0.12],[0.9,0.84],[0.16,0.9]], '#f3ecdc');
  wash([[0.12,0.18],[0.86,0.12],[0.9,0.84],[0.16,0.9]], '#7c5c9c', {alpha:.85, rough:4, off:1, blur:.6});
  wash([[0.2,0.2],[0.27,0.19],[0.31,0.87],[0.24,0.88]], '#4b3a68', {alpha:.6, rough:2, off:0, blur:.5});
  reserve([[0.42,0.34],[0.76,0.31],[0.78,0.5],[0.44,0.53]], '#f6efdf');
  ink([[0.12,0.18],[0.86,0.12],[0.9,0.84],[0.16,0.9]], {w:2.2, close:true, overshoot:3});
  ink([[0.42,0.34],[0.76,0.31],[0.78,0.5],[0.44,0.53]], {w:1.4, close:true, overshoot:2});
  ink([[0.48,0.41],[0.72,0.39]], {w:1.2, gap:false, overshoot:1});
} else if (which === 'photo') {
  reserve([[0.14,0.1],[0.84,0.16],[0.8,0.9],[0.1,0.84]], '#fbf7ee');
  wash([[0.2,0.18],[0.78,0.23],[0.75,0.68],[0.17,0.63]], '#e6c99a', {alpha:.8, rough:3, off:1, blur:.6});
  for (const [x,c] of [[0.27,'#a8693f'],[0.43,'#7b6a99'],[0.6,'#3c4a78']]) {
    wash([[x,0.36],[x+0.09,0.37],[x+0.1,0.66],[x-0.01,0.65]], c, {alpha:.8, rough:2, off:0, blur:.5});
    wash([[x+0.015,0.27],[x+0.075,0.27],[x+0.075,0.36],[x+0.015,0.36]], '#d9a98a', {alpha:.8, rough:2, off:0, blur:.5});
  }
  ink([[0.14,0.1],[0.84,0.16],[0.8,0.9],[0.1,0.84]], {w:2, close:true, overshoot:3});
  ink([[0.2,0.18],[0.78,0.23],[0.75,0.68],[0.17,0.63]], {w:1.3, close:true, overshoot:2});
}
document.title = 'done';
</script>
