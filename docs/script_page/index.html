<style>
/* Layout: sticky chapter tabs on top, one chapter at a time as a script, copy buttons per chapter and per block. */
:root{--bg:#f6f1e7;--panel:#fffaf0;--fg:#2a1d12;--mute:#7a6652;--line:#dccfb8;--accent:#7a2c38;--accent-fg:#fbeed6;--bgb:#2f6b3f;--ok:#2f6b3f;--font-ko:"Noto Serif KR","Noto Sans KR",serif;--font-ui:"Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--panel:#211a13;--fg:#efe3cf;--mute:#a69378;--line:#3a2f23;--accent:#e08a8f;--accent-fg:#1b1210;--bgb:#8fd09f;--ok:#8fd09f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120d;--panel:#211a13;--fg:#efe3cf;--mute:#a69378;--line:#3a2f23;--accent:#e08a8f;--accent-fg:#1b1210;--bgb:#8fd09f;--ok:#8fd09f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--font-ui);padding-inline:16px}
.wrap{max-width:860px;margin-inline:auto;padding-block:20px 80px}
h1{font:700 1.7rem/1.2 var(--font-ko);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px;font:600 .9rem var(--font-ui);cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--fg);padding:6px 12px;font:600 .85rem var(--font-ui);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.copy{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 12px;font:700 .85rem var(--font-ui);cursor:pointer}
.copy:hover{background:var(--accent);color:var(--accent-fg)}
.copy.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chap h2{font:700 1.35rem var(--font-ko);margin:22px 0 4px}
.chap .meta{color:var(--mute);font-size:.9rem;margin-bottom:12px}
.line{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:4px 14px;padding:8px 0;border-top:1px solid var(--line)}
.who{font:700 .9rem var(--font-ui);color:var(--mute);padding-top:2px}
.who.b{color:var(--bgb)}
.txt{font-family:var(--font-ko);font-size:1.05rem;word-break:keep-all;overflow-wrap:break-word}
.txt .en{display:block;color:var(--mute);font:400 .92rem/1.5 var(--font-ui);margin-top:2px;word-break:normal}
.id{color:var(--mute);font:500 .72rem ui-monospace,monospace;margin-left:8px;opacity:.8}
.ch{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.ch li{font-size:.95rem;color:var(--fg);padding-left:1rem;position:relative}
.ch li::before{content:"▸";position:absolute;left:0;color:var(--accent)}
.blk{margin-top:26px}
.blk h3{font:700 1.1rem var(--font-ko);margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ok{color:var(--ok);font-weight:700}
@media(max-width:520px){.line{grid-template-columns:1fr}.who{padding-top:0}}
</style>

<h1>벨 마을 전체 대본</h1>
<p class="sub">프롤로그부터 7장과 결말 4종까지, 현재 프로토타입의 모든 대사입니다. 시각은 아라비아 숫자, 긴 대사는 게임에서 문장 단위로 쪽이 나뉩니다.</p>

<script id="data" type="application/json">{"chs": [{"num": "프롤로그", "title": "The Photograph", "rows": [{"id": "p_f0", "sp": "빅그베", "spe": "BGB", "ko": "그분은 항상 내 편이었는데.", "en": "He was always on my side."}, {"id": "p_f1", "sp": "빅그베", "spe": "BGB", "ko": "일단 그대로 두자.", "en": "I'll leave it for now."}, {"id": "p_f9", "sp": "빅그베", "spe": "BGB", "ko": "지금은 그럴 때가 아니야.", "en": "Now's not the time."}, {"id": "p_n0", "sp": "니니", "spe": "Nini", "ko": "빅그베 아저씨! 안에 계세요?", "en": "Big Green Bear! Are you in there?"}, {"id": "p_n0a", "sp": "빅그베", "spe": "BGB", "ko": "니니? 무슨 일이야?", "en": "Nini? What's wrong?"}, {"id": "p_n0b", "sp": "니니", "spe": "Nini", "ko": "에드워드 아저씨가 돌아가셨대요.", "en": "They say Edward passed away."}, {"id": "p_n0c", "sp": "니니", "spe": "Nini", "ko": "지금 다들 시계탑 앞에 모여 있어요.", "en": "Everyone's gathering outside the clock tower."}, {"id": "p_n1", "sp": "빅그베", "spe": "BGB", "ko": "...알고 있어.", "en": "...I know."}, {"id": "p_n1a", "sp": "빅그베", "spe": "BGB", "ko": "잠깐만. 나도 갈게.", "en": "Hold on. I'll come with you."}, {"id": "p_n2", "sp": "니니", "spe": "Nini", "ko": "올리버 아저씨가 어젯밤 11시 40분쯤 시계탑 계단에서 곰을 봤대요.", "en": "Oliver says he saw a bear on the clock tower stairs around 11:40 last night."}, {"id": "p_n2a", "sp": "니니", "spe": "Nini", "ko": "목도리를 하고 있었다는데, 다들 그 얘기뿐이에요.", "en": "He said the bear was wearing a scarf. It's all anyone's talking about."}, {"id": "p_n3", "sp": "빅그베", "spe": "BGB", "ko": "나 어젯밤엔 헤이즐 씨 카페에 있었어. 11시 45분 조금 전까지.", "en": "I was at Hazel's café last night, until just before 11:45."}, {"id": "p_n3a", "sp": "빅그베", "spe": "BGB", "ko": "헤이즐 씨한테 물어보면 알 거야.", "en": "You can ask Hazel. She'll tell you."}, {"id": "p_n4", "sp": "니니", "spe": "Nini", "ko": "그렇군요. 근데 경찰관 아저씨도 눈 때문에 못 오신대요.", "en": "I see. But the constable can't make it because of the snow."}, {"id": "p_n4a", "sp": "니니", "spe": "Nini", "ko": "그래서 다들 어쩔 줄 몰라 하고 있어요.", "en": "So nobody really knows what to do."}, {"id": "p_n4b", "sp": "니니", "spe": "Nini", "ko": "아저씨도 시계탑에 와 주실 거죠?", "en": "You'll come to the clock tower too, won't you?"}, {"id": "p_n5", "sp": "니니", "spe": "Nini", "ko": "아, 맞다. 아저씨한테 물어볼 게 있었어요.", "en": "Oh, right. There's something I've been meaning to ask you."}, {"id": "p_n5a", "sp": "빅그베", "spe": "BGB", "ko": "뭔데?", "en": "What is it?"}, {"id": "p_n5b", "sp": "니니", "spe": "Nini", "ko": "어제 해 질 무렵에 시계탑 뒤쪽 길에서 아저씨를 봤거든요.", "en": "I saw you on the path behind the clock tower yesterday, around sunset."}, {"id": "p_n5c", "sp": "니니", "spe": "Nini", "ko": "제가 손도 흔들었는데, 그냥 지나가셨어요.", "en": "I even waved, but you just walked right past."}, {"id": "p_n6", "sp": "빅그베", "spe": "BGB", "ko": "어제? 미안. 못 봤나 봐.", "en": "Yesterday? Sorry. I guess I didn't see you."}, {"id": "p_n7", "sp": "니니", "spe": "Nini", "ko": "다음엔 꼭 인사해 주셔야 해요!", "en": "You have to wave back next time!"}, {"id": "p_n8", "sp": "빅그베", "spe": "BGB", "ko": "하하, 알았어. 약속할게.", "en": "Haha, okay. I promise."}, {"id": "p_n9", "sp": "니니", "spe": "Nini", "ko": "그럼 어제 못 한 인사까지 오늘 두 번 할래요!", "en": "Then I'll say hello twice today, to make up for yesterday!"}, {"id": "p_n9a", "sp": "니니", "spe": "Nini", "ko": "안녕하세요! 안녕하세요!", "en": "Hello! Hello!"}, {"id": "p_n10", "sp": "빅그베", "spe": "BGB", "ko": "안녕, 니니. 안녕!", "en": "Hello, Nini. Hello!"}, {"id": "p_w", "sp": "빅그베", "spe": "BGB", "ko": "눈이 많이 오네. 오래된 발자국은 다 지워지겠어.", "en": "So much snow. It will wipe out every old footprint."}, {"id": "p_b", "sp": "빅그베", "spe": "BGB", "ko": "낡은 동화책이야. 하도 읽어서 부들부들해졌어.", "en": "Old storybooks, worn soft from reading."}, {"id": "p_s", "sp": "빅그베", "spe": "BGB", "ko": "불이 거의 꺼졌어.", "en": "The fire is nearly out."}, {"id": "p_k", "sp": "빅그베", "spe": "BGB", "ko": "주전자는 식은 지 오래야. 차 마실 기분이 아니야.", "en": "The kettle went cold long ago. I don't feel like tea."}]}, {"num": "1장", "title": "멈춘 시계", "rows": [{"id": "n0", "sp": "니니", "spe": "Nini", "ko": "에드워드 아저씨는 자정 종을 한 번도 놓친 적이 없어요. 한 번도요.", "en": "Edward never missed the midnight bell. Never."}, {"id": "n1", "sp": "니니", "spe": "Nini", "ko": "다들 탑 앞에 서 있기만 하고 아무도 안으로 들어가지 못해요. 사고였느냐고만 계속 물어요.", "en": "Everyone is standing at the tower and nobody will go in. They keep asking if it was an accident.", "ch": [{"ko": "어젯밤에 기억나는 걸 말해 줘.", "en": "Tell me what you remember about last night."}, {"ko": "계단에 누가 있었는지 말한 사람이 있어?", "en": "Has anyone said who was on the stairs?"}]}, {"id": "n2a", "sp": "니니", "spe": "Nini", "ko": "저는 9시에 기록실을 나왔어요. 아저씨는 책상에서 편지를 봉하고 계셨고요. 두 통이었어요. 누구에게 보내는지는 묻지 않았어요.", "en": "I left the archive at 9:00. He was sealing letters at his desk. Two of them. I didn't ask who they were for."}, {"id": "n2d", "sp": "니니", "spe": "Nini", "ko": "이건 제 공책이에요. 한 장이 뜯겨 있고, 그 아래 장에 '붉은 장부 옮겨졌나?'라고 적어 뒀어요. 가지고 계세요.", "en": "This is my notebook. A page is torn out, and on the one beneath I wrote: 'Red ledger moved?' Please keep it."}, {"id": "n2b", "sp": "니니", "spe": "Nini", "ko": "올리버 아저씨가 그러는데, 11시 40분쯤 목도리를 한 곰이 계단을 올라갔대요. 아저씨가 오기 전에요.", "en": "Oliver says a bear in a scarf climbed the stairs at 11:40. Before you got there.", "ch": [{"ko": "나는 12시 15분 전까지 카페에 있었어.", "en": "I was at the café until 11:45."}, {"ko": "(말없이 있는다.)", "en": "(Say nothing.)"}]}, {"id": "n2c", "sp": "니니", "spe": "Nini", "ko": "알아요. 헤이즐 아주머니가 다 말했어요. 그래서 다들 아저씨가 조사해 주길 바라는 거예요.", "en": "I know. Hazel told everyone. That's why they want you to look into it."}, {"id": "n3", "sp": "니니", "spe": "Nini", "ko": "아저씨, 시계를 봐 주세요. 11시 47분에 멈췄는데, 그게 무슨 뜻인지 아무도 말해 주지 못해요.", "en": "Please look at the clock. It stopped at 11:47, and nobody can tell me what that means."}, {"id": "n9", "sp": "니니", "spe": "Nini", "ko": "저는 다른 분들과 여기 있을게요. 아저씨가 알아내시면 말해 주세요.", "en": "I'll stay here with the others. Tell me what you find."}, {"id": "c0", "sp": "올리버", "spe": "Oliver", "ko": "음. 어젯밤, 11시 40분쯤이었습니다. 곰이 이 계단을 올라가는 걸 봤습니다. 오른손에 무언가를 들고 있었습니다.", "en": "Mm. Last night, around 11:40. I saw a bear climbing these stairs. He was carrying something in his right hand.", "ch": [{"ko": "이 탑시계는 믿을 만한가요?", "en": "Is the tower clock reliable?"}, {"ko": "(자신의 손을 내려다본다.)", "en": "(Glance at your own hands.)"}, {"ko": "고맙습니다.", "en": "Thank you."}]}, {"id": "c2", "sp": "빅그베", "spe": "BGB", "ko": "공책은 늘 그렇듯 왼손에 들려 있어.", "en": "My notebook is in my left hand, the way it always is."}, {"id": "c1", "sp": "올리버", "spe": "Oliver", "ko": "음. 저녁마다 태엽을 감습니다. 에드워드 씨의 회중시계도 매일 아침 이 시계에 맞추니, 둘은 1분도 어긋나지 않았습니다.", "en": "Mm. I wind it every evening. I set Edward's pocket watch by it each morning, so the two never differ by a minute."}, {"id": "c9", "sp": "올리버", "spe": "Oliver", "ko": "음. 천천히 살펴보십시오. 시계는 어디 안 갑니다.", "en": "Mm. Take your time with it. The clock isn't going anywhere.", "ch": [{"ko": "이 탑시계는 믿을 만한가요?", "en": "Is the tower clock reliable?"}, {"ko": "(자신의 손을 내려다본다.)", "en": "(Glance at your own hands.)"}, {"ko": "고맙습니다.", "en": "Thank you."}]}, {"id": "ci1_0", "sp": "빅그베", "spe": "BGB", "ko": "에드워드가 죽었다. 탑시계는 11시 47분에 멈췄고, 마을 사람들은 무서워서 안에 들어가지도 못하고 서 있어.", "en": "Edward is dead. The tower clock stopped at 11:47, and the village just stands outside, afraid to go in."}, {"id": "ci1_1", "sp": "빅그베", "spe": "BGB", "ko": "먼저 시계탑 안부터 살펴보자. 이것저것 조사하고, 올리버하고도 이야기해 봐야 해. 문은 오른쪽에 있어.", "en": "I should start with the tower itself. Look around inside, and talk to Oliver. The door is to the right."}, {"id": "ce1_0", "sp": "빅그베", "spe": "BGB", "ko": "탑이 알려 준 건 이거야. 시계는 에드워드가 떨어진 11시 47분에 멈췄어. 그리고 11시 40분쯤 어떤 곰이 그 계단을 올랐어.", "en": "Here is what the tower told me. The clock stopped at 11:47, when Edward fell. And a bear climbed those stairs around 11:40."}, {"id": "ce1_1", "sp": "빅그베", "spe": "BGB", "ko": "그 곰은 누구였을까?", "en": "Who was that bear?"}]}, {"num": "2장", "title": "네 명의 증인", "rows": [{"id": "h3", "sp": "헤이즐", "spe": "Hazel", "ko": "어제 오후에도 창가 자리에서 차를 드셨죠. 5시 5분 전에 제가 리필을 가져다 드렸어요. 카운터에서 그 자리가 훤히 보이고, 뒷문 종이 울렸을 때도 신문을 보고 계셨고요.", "en": "And yesterday afternoon you had tea at the window table. I brought you a refill at 4:55. I can see that table from the counter, and my back-door bell rang while you were reading the paper."}, {"id": "h4", "sp": "헤이즐", "spe": "Hazel", "ko": "4시 40분쯤 뒷문으로 빵을 사 간 손님이 있긴 했어요. 모자를 푹 눌러쓰고 말이 없었죠. 누구인지는 묻지 않았어요. 손님마다 사정이 있으니까요.", "en": "Someone did buy bread at the back door around 4:40. Hat low, few words. I did not ask who. Customers have their reasons."}, {"id": "tm3", "sp": "토미", "spe": "Tommy", "ko": "어젯밤 근무는 5시에 시작했습니다. 시작하자마자 자루를 든 곰이 뒷길로 방앗간 길 쪽으로 갔습니다. 이름은 적지 않았습니다.", "en": "Last night my watch began at 5:00. Right at the start, a bear with a sack went down the back lane toward the Mill road. I did not write a name."}, {"id": "ci2_0", "sp": "빅그베", "spe": "BGB", "ko": "시계는 에드워드가 떨어질 때 고장 났고, 11시 40분쯤 어떤 곰이 그 계단을 올랐어. 탑이 알려 줄 수 있는 건 거기까지야.", "en": "The clock broke when Edward fell, and a bear climbed those stairs around 11:40. That is all the tower can tell me."}, {"id": "ci2_1", "sp": "빅그베", "spe": "BGB", "ko": "이제는 사람들의 이야기가 필요해. 헤이즐의 카페, 토미의 일지, 니니와 올리버. 그걸 맞춰 보면 돼.", "en": "Now I need people's stories. Hazel's café, Tommy's logbook, Nini and Oliver. Then I can compare them."}, {"id": "tm0", "sp": "토미", "spe": "Tommy", "ko": "안녕하세요, 빅그린베어 씨. 저는 밤마다 이 다리 둘레를 돌며 일지를 씁니다.", "en": "Evening, Mr. Big Green Bear. I walk this bridge loop every night and keep the log.", "ch": [{"ko": "어젯밤에 뭘 보셨나요?", "en": "What did you see last night?"}, {"ko": "밤에 탑이 거슬리진 않으세요?", "en": "Do you mind the tower at night?"}, {"ko": "근무 초반에 본 건 없나요?", "en": "Anything earlier in your watch?"}, {"ko": "고맙습니다.", "en": "Thank you."}]}, {"id": "tm1", "sp": "토미", "spe": "Tommy", "ko": "11시 35분에 겨자색 목도리를 한 곰이 랜턴 다리를 서둘러 건넜습니다. 빅그린베어 씨, 당신이라고 적어 두었습니다. 뒷모습만 봤습니다.", "en": "At 11:35 a bear in a mustard scarf crossed Lantern Bridge in a hurry. I wrote it down as you, Mr. Big Green Bear. I only saw his back."}, {"id": "tm2", "sp": "토미", "spe": "Tommy", "ko": "태엽 소리와 종소리가 잠을 설치게 하긴 합니다. 그래도 안에는 들어가지 않습니다. 탑은 제 순찰 구역이 아니니까요.", "en": "The winding and the bells keep me awake, I will say that. But I never go in. The tower is not my watch."}, {"id": "tm9", "sp": "토미", "spe": "Tommy", "ko": "시각은 가로등 기둥에 걸린 일지에 있습니다. 천천히 보십시오.", "en": "The times are in the log, hanging on the post. Take your time with it."}, {"id": "h0", "sp": "헤이즐", "spe": "Hazel", "ko": "빅그린베어 씨. 끔찍한 일이에요. 종이 울린 뒤로 우리 카페는 그 얘기뿐이에요.", "en": "Mr. Big Green Bear. Terrible business. The whole café has talked of nothing else since the bell.", "ch": [{"ko": "어젯밤 일에 대해서요.", "en": "About last night."}, {"ko": "에드워드 씨를 잘 아셨나요?", "en": "Did you know Edward well?"}, {"ko": "어제 오후는요?", "en": "What about yesterday afternoon?"}, {"ko": "고맙습니다.", "en": "Thank you."}]}, {"id": "h1", "sp": "헤이즐", "spe": "Hazel", "ko": "12시 15분 전이 조금 못 되도록 여기 계셨어요. 누군가를 기다리는 것 같았죠.", "en": "You were here until a little before 11:45. You looked like you were waiting for someone."}, {"id": "h1b", "sp": "헤이즐", "spe": "Hazel", "ko": "11시 42분에 계산하셨어요. 시각은 제가 직접 영수증에 적었죠. 자, 가지고 계세요.", "en": "You settled your tab at 11:42. I wrote the time on the receipt myself. Here, keep it."}, {"id": "h2", "sp": "헤이즐", "spe": "Hazel", "ko": "작년 겨울에 지붕 고치라고 돈을 빌려줬어요. 절반은 갚았고요. 비밀도 아니니 무슨 비밀인 양 적지는 마세요.", "en": "He lent me money for the roof last winter. I paid back half. It's no secret, so don't go writing it down as one."}, {"id": "h9", "sp": "헤이즐", "spe": "Hazel", "ko": "천천히 하세요. 주전자는 늘 불 위에 있답니다.", "en": "Take your time. The kettle's always on."}, {"id": "ce2_0", "sp": "빅그베", "spe": "BGB", "ko": "곰은 한 마리일 수 없어. 다리 위의 곰과 카페의 곰은 달랐어.", "en": "One bear cannot be in two places. The bear on the bridge and the bear in the café were different."}, {"id": "ce2_1", "sp": "빅그베", "spe": "BGB", "ko": "그리고 오른손에 물건을 든 곰은 내가 아니야. 그럼 다른 곰은 누구지?", "en": "And the one with the right hand was not me. So who is the other bear?"}]}, {"num": "3장", "title": "다른 곰", "rows": [{"id": "nk0", "sp": "니니", "spe": "Nini", "ko": "아저씨, 다른 곰이요. 그날 계단에 다른 곰이 있었다고 생각하세요?", "en": "Another bear. You think there was another bear on those stairs?"}, {"id": "nk1", "sp": "니니", "spe": "Nini", "ko": "에드워드 아저씨는 서랍을 늘 잠가 두셨고, 열쇠는 제가 계속 가지고 있었어요. 답이 있다면 거기 있을지도 몰라요. 아저씨가 가져가세요.", "en": "Edward kept his drawers locked and I have kept the key since. If there is an answer, it may be in there. Please, take it."}, {"id": "mo0", "sp": "몰리", "spe": "Molly", "ko": "그래, 그날 계단에 곰이 한 마리 더 있었다는 얘기를 들었구먼.", "en": "So you have heard there was a second bear on those stairs.", "ch": [{"ko": "Green에 대해 말씀해 주세요.", "en": "Tell me about Green."}, {"ko": "누가 말했나요?", "en": "Who told you?"}, {"ko": "(자리를 뜬다.)", "en": "(Leave.)"}]}, {"id": "mo1", "sp": "몰리", "spe": "Molly", "ko": "Green 얘기는 안 해. 강이 뱃사공을 데려간 그날 밤, 종이 울리지 않게 만든 건 그 아이야. 마을은 아직도 용서하지 않았어.", "en": "We don't talk about Green. He is the one who let the bell fail, the night the river took the boatman. The village has not forgiven it."}, {"id": "mo2", "sp": "몰리", "spe": "Molly", "ko": "아무도 아냐. 이렇게 작은 마을은 계단 삐걱대는 소리까지 다 들리거든. 가 봐야겠다면 방앗간으로 가. 외투는 챙기고.", "en": "Nobody. A village this small hears every stair creak. Go to the Old Mill if you must. Take a coat."}, {"id": "mo9", "sp": "몰리", "spe": "Molly", "ko": "방앗간은 마지막 집들을 지나면 있어. 할 말은 다 했네.", "en": "The Old Mill is past the last houses. I have said what I will say."}, {"id": "m_no", "sp": "빅그베", "spe": "BGB", "ko": "다른 곰에 대해 먼저 알아보자.", "en": "I should look into the other bear first."}, {"id": "gr0", "sp": "Green", "spe": "Green", "ko": "너로군. 직접 올 줄은 몰랐는데.", "en": "You. I did not think you would come yourself.", "ch": [{"ko": "어젯밤에 어디 있었어?", "en": "Where were you last night?"}, {"ko": "에드워드가 죽었어.", "en": "Edward is dead."}, {"ko": "이 추위에 손이 맨손이네.", "en": "Your hand is bare in this cold."}, {"ko": "(자리를 뜬다.)", "en": "(Leave.)"}]}, {"id": "gr2", "sp": "Green", "spe": "Green", "ko": "집에 있었어. 물레바퀴가 꽁꽁 얼어서 밤새 얼음을 깼지. 탑에는 가지 않았어.", "en": "At home. The wheel froze solid, so I spent the night chipping ice. I was not at the tower."}, {"id": "gr3", "sp": "Green", "spe": "Green", "ko": "알아. 계곡 전체가 손종 소리를 들었으니까. 하려던 말이나 해.", "en": "I know. The whole valley heard the handbell. Say what you came to say."}, {"id": "gr4", "sp": "Green", "spe": "Green", "ko": "추위는 허락을 구하지 않아. 주전자 좀 들어 줘. 손가락이 정직해지거든.", "en": "Cold does not ask permission. Hold the kettle for me, it keeps the fingers honest."}, {"id": "gr5", "sp": "Green", "spe": "Green", "ko": "네 기억을 떠올려 봐.", "en": "Ask yourself what you remember."}, {"id": "gr9", "sp": "Green", "spe": "Green", "ko": "이미 말했어. 네 기억을 떠올려 봐.", "en": "I have said it already. Ask yourself what you remember."}, {"id": "nw0", "sp": "니니", "spe": "Nini", "ko": "아저씨, 어제 그 곰 생각이 났어요. 걸음이 아저씨보다 빨랐어요. 꼭 어디 급하게 가는 것처럼요.", "en": "Mr. Bear, I thought of that bear from yesterday. He walked faster than you do, like he had somewhere to be."}, {"id": "ci3_0", "sp": "빅그베", "spe": "BGB", "ko": "곰은 한 마리일 수 없어. 다리 위의 곰과 카페의 곰은 달랐고, 오른손에 물건을 든 곰은 내가 아니야.", "en": "One bear cannot be in two places. The bear on the bridge and the bear in the café were different, and the one with the right hand was not me."}, {"id": "ci3_1", "sp": "빅그베", "spe": "BGB", "ko": "그럼 다른 곰은 누구지? 니니에게 서랍 열쇠 이야기를 듣고, 기록관과 낡은 방앗간을 확인해 보자.", "en": "So who is the other bear? Talk to Nini about the drawer key, then try the Archive and the Old Mill."}, {"id": "ce3_0", "sp": "빅그베", "spe": "BGB", "ko": "사진 두 장, 그리고 서로 맞지 않는 목도리 매듭. Green은 내 기억을 떠올려 보라고 했어.", "en": "Two photographs, and the scarf knots do not agree. Green told me to ask myself what I remember."}, {"id": "ce3_1", "sp": "빅그베", "spe": "BGB", "ko": "사진 속에서 뭔가가 나를 잡아당겨.", "en": "Something is pulling at me from inside the picture."}]}, {"num": "4장", "title": "훔쳐 간 이름", "rows": [{"id": "fe0", "sp": "에드워드", "spe": "Edward", "ko": "큰애야, 가만히 있어 보렴. 목도리 좀 보자.", "en": "Big brother, hold still. Let me see that scarf."}, {"id": "fe1", "sp": "에드워드", "spe": "Edward", "ko": "자. 네 건 이쪽, 동생 건 반대쪽에 묶었다. 이게 없으면 너희 둘을 구분하지 못하겠구나.", "en": "There. This knot on your side, and your brother's on the other. I can't tell you two apart without these."}, {"id": "fe2", "sp": "에드워드", "spe": "Edward", "ko": "늦게까지 놀지는 마라. 오늘따라 강이 시끄럽구나.", "en": "Don't stay out late. The river has been loud all day."}, {"id": "fe9", "sp": "에드워드", "spe": "Edward", "ko": "가 보렴. 계단 조심하고.", "en": "Go on. And mind the stairs."}, {"id": "fg0", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "문이 뻑뻑하다. 손으로 밀어서 연다.", "en": "The gate sticks. He pushes it open with his hand."}, {"id": "fg9", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "문이 이제 잘 열린다.", "en": "The gate swings easily now."}, {"id": "ft_no", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "에드워드가 아직 근처에 있다. 먼저 할 말이 있을지도 모른다.", "en": "Edward is still nearby. Maybe he has something to say first."}, {"id": "fl0", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "동생이 커다란 레버를 만지작거리고 있다. 목도리 끝이 레버에 끼었다.", "en": "His little brother is fiddling with a big lever, and his scarf is caught in it.", "ch": [{"ko": "끌어당긴다.", "en": "Pull him away."}, {"ko": "지켜본다.", "en": "Watch."}]}, {"id": "flrw", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "(손을 뻗지만 장면이 흩어진다.)", "en": "(He reaches out, but the moment slips away.)"}, {"id": "fl1", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "털실 한 가닥이 찢어져 레버에 끼인 채 남는다. 동생은 웃고, 자기가 무슨 짓을 했는지 모른다.", "en": "A thread of wool tears off and stays jammed in the lever. His brother laughs and does not know what he has done."}, {"id": "fl2", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "탑 지붕 위로 빗방울이 떨어지기 시작한다.", "en": "Rain begins to patter on the tower roof."}, {"id": "fl9", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "레버는 끼인 채 그대로다. 저 아래에서 강물이 불어난다.", "en": "The lever stays wedged. Far below, the river is rising."}, {"id": "ci4_0", "sp": "빅그베", "spe": "BGB", "ko": "서로 어긋나는 두 장의 사진, 그리고 그 안에서 나를 끌어당기는 기억.", "en": "Two photographs that disagree, and a memory pulling at me from inside them."}, {"id": "ci4_1", "sp": "빅그베", "spe": "BGB", "ko": "따라가 보자. 에드워드와 이야기하고, 마을을 둘러보고, 탑까지 가 보는 거야.", "en": "I will follow it. Talk to Edward, look around the village, and make my way to the tower."}, {"id": "ce4_0", "sp": "빅그베", "spe": "BGB", "ko": "에드워드는 두 아이를 매듭으로만 구분했어. 목도리 끝이 레버에 끼었고, 종은 울리지 않았어.", "en": "Edward told the two apart only by their knots. A scarf end jammed the lever, and the bell never rang."}, {"id": "ce4_1", "sp": "빅그베", "spe": "BGB", "ko": "그리고 이제 물이 차오르기 시작해.", "en": "And now the water is rising."}]}, {"num": "5장", "title": "좋은 사람", "rows": [{"id": "fb0", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "동생이 쓰러진 들보 뒤에 끼어 있다. 물이 벌써 가슴까지 찼다.", "en": "His little brother is wedged behind a fallen beam, the water already at his chest.", "ch": [{"ko": "에드워드를 부르러 간다.", "en": "Go back for Edward."}, {"ko": "끌어낸다.", "en": "Pull him out."}]}, {"id": "fbrw", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "(돌아서지만 장면이 흩어진다.)", "en": "(He turns, but the moment slips away.)"}, {"id": "fb1", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "동생을 붙잡고 끌어당긴다. 들보가 휘어 내려와 왼쪽 귀를 찢지만 멈추지 않고, 동생을 끝내 빼낸다.", "en": "He grabs his brother and pulls. A beam swings down and tears his left ear, and he keeps pulling until the boy is free."}, {"id": "fb_wait", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "동생이 먼저다.", "en": "His brother first."}, {"id": "fb_bell", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "있는 힘껏 손종을 울린다. 저 위 언덕의 창문마다 불이 켜진다.", "en": "He rings the handbell as hard as he can. Far up the hill, lights come on in the windows."}, {"id": "fb_up", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "아직이다. 먼저 종을 울려야 한다.", "en": "Not yet. The bell has to ring first."}, {"id": "fd_v1", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "\"에드워드는 좋은 사람이야. 에드워드가 있어서 다행이지.\"", "en": "\"Edward is a good person. Thank goodness for Edward.\""}, {"id": "fd_v2", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "\"용감한 아이를 얼마나 조심스레 안고 있는지 좀 봐.\"", "en": "\"Look how gently he carries the brave one.\""}, {"id": "fd_ed", "sp": "에드워드", "spe": "Edward", "ko": "조금만 참으렴, 아가야. 내가 안고 있다.", "en": "Hold on, little one. I have you."}, {"id": "fd_arch", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "에드워드가 동생을 안고 기록실로 들어간다. 문이 닫힌다. 추위 속에 남은 아이를 보는 사람은 없다.", "en": "Edward carries his brother into the Archive. The door shuts. Nobody looks at the child left standing in the cold."}, {"id": "fd_no", "sp": "(회상 속 아이)", "spe": "(the child)", "ko": "아직 눈을 뗄 수가 없다.", "en": "He is not ready to look away yet."}, {"id": "ci5_0", "sp": "빅그베", "spe": "BGB", "ko": "종은 울리지 않았고, 물이 차오르기 시작했어.", "en": "The bell never rang. The water began to rise."}, {"id": "ci5_1", "sp": "빅그베", "spe": "BGB", "ko": "먼저 갇힌 사람을 도와야 해. 그다음 손종을 울리고, 그 옆의 계단으로 올라가자.", "en": "First help whoever is trapped, then ring the handbell, then climb the stairs beside it."}, {"id": "ce5_0", "sp": "빅그베", "spe": "BGB", "ko": "누군가 손종을 울렸지만 아무도 그걸 보지 못했어. 사람들은 에드워드가 안고 나온 아이를 칭찬했어.", "en": "Someone rang the handbell, and nobody saw who. The crowd praised the child Edward carried."}, {"id": "ce5_1", "sp": "빅그베", "spe": "BGB", "ko": "추위 속에 홀로 남은 아이를 본 사람은 없었어.", "en": "Nobody looked at the child left standing in the cold."}]}, {"num": "6장", "title": "사라진 5분", "rows": [{"id": "pf_end", "sp": "빅그베", "spe": "BGB", "ko": "그분은 늘 나를 챙겨 주셨어.", "en": "He always looked out for me."}, {"id": "ci6_0", "sp": "빅그베", "spe": "BGB", "ko": "매듭, 오른손, 찢어진 귀. 다 봤어. 이제 모르는 척할 수 없어.", "en": "The knots, the right hand, the torn ear. I saw all of it, and I cannot unsee it."}, {"id": "ci6_1", "sp": "빅그베", "spe": "BGB", "ko": "사람 탭의 신원 보드에서 단서를 맞춰 보자. 그다음엔 낡은 방앗간의 Green을 만나야 해.", "en": "Compare the clues on the Identity Board under People. After that, I have to see Green at the Old Mill."}, {"id": "c6_comp", "sp": "빅그베", "spe": "BGB", "ko": "두 장의 사진은 말해 줄 수 있는 건 다 말해 줬어.", "en": "The two photographs have told me everything they can."}, {"id": "c6_wait", "sp": "빅그베", "spe": "BGB", "ko": "Green은 나를 보기만 하고 아무 말도 하지 않는다. 먼저 누가 누구인지 정리해야 해. 신원 보드는 사람 탭에 있어.", "en": "Green watches me and says nothing. I should work out who is who first. The Identity Board is under People."}, {"id": "g6_0", "sp": "빅그베", "spe": "BGB", "ko": "Green. 탑 뒷문에서 이 방앗간까지 네 발자국이 이어져 있어. 거기서 무슨 일이 있었는지 말해 줘.", "en": "Green. Your boot prints lead from the tower's back door to this mill. Tell me what happened up there."}, {"id": "g6_1", "sp": "Green", "spe": "Green", "ko": "에드워드는 자정에 진짜 기록을 읽겠다고 했어. 나는 보여 달라고 했고, 그는 거절했지.", "en": "Edward said he would read the true record at midnight. I demanded to see it. He refused."}, {"id": "g6_2", "sp": "Green", "spe": "Green", "ko": "열린 해치 옆에서 몸싸움이 났어. 그러다 에드워드가 그 아래로 사라졌지.", "en": "We struggled beside the open hatch. Then he was gone through it."}, {"id": "g6_3", "sp": "Green", "spe": "Green", "ko": "내려다봤어. 움직이지 않더군. 죽었다고 생각했어. 그래서 달아났지. 뒷문으로 나가 눈길을 걸어 여기까지.", "en": "I looked down. He did not move. I thought he was dead. So I ran, out the back door and through the snow, to here."}, {"id": "g6_4", "sp": "빅그베", "spe": "BGB", "ko": "그러니까 Green은 거기 있었고, 에드워드는 Green 때문에 떨어졌어.", "en": "So Green was there, and Edward fell because of him."}, {"id": "g6_h", "sp": "빅그베", "spe": "BGB", "ko": "Green은 아는 대로 말했어. 그날 밤 에드워드를 살핀 건 치료사야. 무엇을 찾았는지 물어봐야 해.", "en": "Green has told me what he knows. The Healer examined Edward that night. I should ask what was found."}, {"id": "g6_t0", "sp": "빅그베", "spe": "BGB", "ko": "치료사가 그러더라. 에드워드는 추락한 뒤에도 최소 15분은 살아 있었대.", "en": "The Healer says Edward was alive after the fall, for at least 15 minutes."}, {"id": "g6_t1", "sp": "Green", "spe": "Green", "ko": "살아 있었다고? 그럼 누가 곁에 있었지?", "en": "Alive? Then who was with him?"}, {"id": "g6_t2", "sp": "빅그베", "spe": "BGB", "ko": "올리버가 오기 전에 에드워드 곁에 있던 사람은 누구지?", "en": "Who was with Edward before Oliver came?"}, {"id": "g6_9", "sp": "Green", "spe": "Green", "ko": "누가 곁에 있었는지 알아내. 나는 여기 있을 테니.", "en": "Find out who was with him. I will be here."}, {"id": "hl0", "sp": "빅그베", "spe": "BGB", "ko": "실례합니다. 에드워드 일로 왔어요.", "en": "Excuse me. I came about Edward."}, {"id": "hl1", "sp": "치료사", "spe": "Healer", "ko": "고관절과 골반이 부러졌고 갈비뼈도 여러 대 나갔습니다. 속에서 출혈도 있었습니다. 추위와 젖은 옷이 쇼크를 더 심하게 만들었습니다.", "en": "A broken hip and pelvis, broken ribs, and bleeding inside. The cold and his wet clothes made the shock worse."}, {"id": "hl2", "sp": "치료사", "spe": "Healer", "ko": "추락한 뒤에도 최소 15분은 살아 있었습니다. 목소리가 쉬어 있었어요. 한동안 소리쳐 불렀다는 뜻입니다.", "en": "He lived at least 15 minutes after the fall. His voice was hoarse. He had been calling out for some time."}, {"id": "hl3", "sp": "치료사", "spe": "Healer", "ko": "그 정도 추락이라면 살아남을 가능성도 있었습니다. 더 일찍 도움을 받았다면 나아졌을 수도 있고요. 하지만 살았을 거라고는 말할 수 없습니다. 아무도 말할 수 없습니다. 끝난 시각은 자정 5분 전에서 15분 뒤 사이로 짐작합니다. 추위 때문에 그 폭이 넓습니다.", "en": "The fall was potentially survivable, and earlier help might have improved his chances. I cannot tell you he would have lived. No one can. My estimate for the end is between 11:55 and 12:15, and the cold makes that window wide."}, {"id": "hl4", "sp": "치료사", "spe": "Healer", "ko": "그리고 이건 조끼 안에 있던 회중시계입니다. 유리는 갈라졌지만 한 번도 멈추지 않았습니다.", "en": "And this was in his vest. His pocket watch. It never stopped running, though the glass is cracked."}, {"id": "hl9", "sp": "치료사", "spe": "Healer", "ko": "제가 찾은 건 그게 전부입니다. 더 드릴 수 있으면 좋았을 텐데요.", "en": "That is all I found. I wish I had more to give you."}, {"id": "ck6_0", "sp": "빅그베", "spe": "BGB", "ko": "올리버, 돌아왔을 때 보신 걸 다시 말씀해 주세요.", "en": "Oliver, please tell me again what you saw when you came back."}, {"id": "ck6_1", "sp": "올리버", "spe": "Oliver", "ko": "당신은 에드워드 곁에 무릎을 꿇고 있었습니다. 외투 단추가 엇갈려 있었습니다. 무언가를 가린 것처럼요. 왼쪽 목도리 끝은 짧게 찢겨 있었고요.", "en": "You were kneeling by Edward. Your coat was buttoned wrong, as if over something. The left tail of your scarf was torn short."}, {"id": "ck6_2", "sp": "올리버", "spe": "Oliver", "ko": "종이 울리자마자 최대한 빨리 왔다고 하셨습니다. 하지만 저는 돌아오는 길에 자정 5분 전에 손종 소리를 들었습니다.", "en": "You told me you came as fast as you could, just as the bell rang. But I heard the handbell at 11:55, on my way back."}, {"id": "ck6_3", "sp": "올리버", "spe": "Oliver", "ko": "그리고 에드워드의 주먹은 이미 쥐어져 있었습니다. 그 안에 노란 털실 한 가닥이 있었습니다.", "en": "And Edward's fist was already closed. There was a strand of yellow wool in it."}, {"id": "ck6_4", "sp": "빅그베", "spe": "BGB", "ko": "...", "en": "..."}, {"id": "ck6_9", "sp": "올리버", "spe": "Oliver", "ko": "제가 본 건 그게 전부입니다.", "en": "That is everything I saw."}, {"id": "tm6_0", "sp": "토미", "spe": "Tommy", "ko": "일지를 다시 보겠습니다. 11시 46분, 광장에 두 번째 곰이 있었습니다. 느리고 서두르지 않았고 탑으로 향했습니다. 버팀벽 뒤에서 놓쳤습니다.", "en": "My log again. Eleven forty-six, a second bear on the plaza, slow and unhurried, heading for the tower. I lost him behind the buttress."}, {"id": "tm6_1", "sp": "토미", "spe": "Tommy", "ko": "11시 51분에는 \"부르는 소리? 바람?\"이라고 적었습니다. 바람 소리라고 생각했습니다. 저는 탑에 들어가지 않습니다.", "en": "At 11:51 I wrote \"calling? wind?\" I took it for wind. I do not enter the tower."}, {"id": "tm6_9", "sp": "토미", "spe": "Tommy", "ko": "제 일지에는 그게 전부입니다.", "en": "That is all my log says."}, {"id": "h6_0", "sp": "빅그베", "spe": "BGB", "ko": "헤이즐, 그날 밤 제가 어떻게 나갔는지 기억해요?", "en": "Hazel, do you remember how I left that night?"}, {"id": "h6_1", "sp": "헤이즐", "spe": "Hazel", "ko": "11시 42분에 나가셨죠. 문 앞에서 제가 직접 왼쪽 목도리 끝을 정리해 드렸어요. 멀쩡했어요.", "en": "You left at 11:42. I straightened your left scarf tail at the door myself. It was whole."}, {"id": "h6_2", "sp": "빅그베", "spe": "BGB", "ko": "그럼 가게 문에서 시계탑까지 천천히 걸으면요?", "en": "And from your door to the Clocktower, at an easy walk?"}, {"id": "h6_3", "sp": "헤이즐", "spe": "Hazel", "ko": "직접 걸어 보고 세어 보세요. 저는 여기서 기다릴게요.", "en": "Walk it yourself and count. I'll wait here."}, {"id": "h6_4", "sp": "빅그베", "spe": "BGB", "ko": "(천천히 걸으며 센다. 카페 문 11시 42분. 광장 11시 46분. 탑 문 11시 48분.)", "en": "(He walks it slowly, counting. Café door, 11:42. Plaza, 11:46. Tower door, 11:48.)"}, {"id": "h6_9", "sp": "헤이즐", "spe": "Hazel", "ko": "세어 보신 대로 6분이에요. 더 필요한 게 있으세요?", "en": "Six minutes, like you counted. Is there anything else?"}, {"id": "p6_f0", "sp": "빅그베", "spe": "BGB", "ko": "액자를 뒤집는다. 놋쇠 단추 두 개가 뒷판을 누르고 있다. 그 뒤에 뭐가 있는지 나는 안다.", "en": "I turn the frame over. Two brass buttons hold the backing. I know what is behind it."}, {"id": "p6_f1", "sp": "빅그베", "spe": "BGB", "ko": "깊이 3센티미터쯤의 틈이다.", "en": "A cavity, three centimeters deep."}, {"id": "p6_f2", "sp": "빅그베", "spe": "BGB", "ko": "눌린 장갑 한 짝. 오른손용이다.", "en": "One glove, flattened. A right-hand glove."}, {"id": "p6_f3", "sp": "빅그베", "spe": "BGB", "ko": "세 번 접힌 편지, 에드워드의 글씨다. \"G\". 나는 읽지 않았다.", "en": "A letter folded in thirds, in Edward's hand. \"G.\" I never read it."}, {"id": "p6_f9", "sp": "빅그베", "spe": "BGB", "ko": "뒤에 뭐가 있는지는 이미 봤어.", "en": "I have seen what is behind it."}, {"id": "c6_pit0", "sp": "빅그베", "spe": "BGB", "ko": "아래에는 아직 새로운 게 없어.", "en": "Nothing new down there yet."}, {"id": "c6_n0", "sp": "니니", "spe": "Nini", "ko": "아저씨. 그날 밤 12시 15분 전부터 자정 사이에 어디 계셨어요?", "en": "Mr. Bear. Where were you between 11:45 and midnight, that night?", "ch": [{"ko": "헤이즐의 카페에 있었어. 11시 42분 조금 전까지.", "en": "At Hazel's café, until a little before 11:42."}, {"ko": "탑에 있었어. 내가 발견했을 때 에드워드는 살아 있었어.", "en": "At the tower. Edward was alive when I found him."}, {"ko": "대답하고 싶지 않아.", "en": "I don't want to answer."}]}, {"id": "c6_n1", "sp": "니니", "spe": "Nini", "ko": "헤이즐도 그렇게 말해요. 그런데 그게 밤 전체는 아니잖아요.", "en": "Hazel says that too. But that is not the whole night, is it?"}, {"id": "c6_n2", "sp": "니니", "spe": "Nini", "ko": "...아저씨가 곁에 있었군요.", "en": "...You were with him."}, {"id": "c6_n3", "sp": "니니", "spe": "Nini", "ko": "그럼 기다릴게요. 저는 어디에도 안 가요.", "en": "Then I'll wait. I am not going anywhere."}, {"id": "ce6_0", "sp": "빅그베", "spe": "BGB", "ko": "11시 50분에 에드워드를 찾았을 때 그는 살아 있었어. 나는 장갑과 편지를 숨겼고, 종은 5분 뒤에 울렸어.", "en": "When I found Edward at 11:50, he was alive. I hid the glove and the letter, and the bell rang 5 minutes later."}, {"id": "ce6_1", "sp": "빅그베", "spe": "BGB", "ko": "도움이 있었다면 살았을지는 아무도 말할 수 없어. 하지만 내가 한 일은 내가 알아.", "en": "No one can say whether help would have saved him. But I know what I did."}]}, {"num": "7장", "title": "우리가 고르는 진실", "rows": [{"id": "ci7_0", "sp": "빅그베", "spe": "BGB", "ko": "Green은 에드워드를 떨어뜨렸고, 나는 장갑을 숨기고 5분을 기다렸어. 우리는 저마다 누군가를 지키고 있었고, 아무도 그 값을 누가 치르는지는 묻지 않았어.", "en": "Green fell on Edward, and I hid the glove and waited 5 minutes. We were each protecting someone, and nobody asked who was paying."}, {"id": "ci7_1", "sp": "빅그베", "spe": "BGB", "ko": "Green에게 먼저 사실대로 말해야 해. 그다음엔 에드워드가 남긴 걸 찾고, 마을에 무엇을 알릴지 정해야 해.", "en": "I owe Green the truth first. Then I have to find what Edward left behind, and decide what the village will be told."}, {"id": "g7_0", "sp": "빅그베", "spe": "BGB", "ko": "Green. 올리버가 오기 전에 내가 에드워드 곁에 있었어. 살아 있었어.", "en": "Green. I was with Edward before Oliver came. He was alive."}, {"id": "g7_1", "sp": "Green", "spe": "Green", "ko": "살아 있었다고. 나는 죽은 줄 알고 달아났는데.", "en": "Alive. I ran because I thought he was dead."}, {"id": "g7_2", "sp": "빅그베", "spe": "BGB", "ko": "난간 위에 있던 네 장갑이랑 편지를 내가 가져갔어. 사진 뒤에 숨겼어. 읽지는 않았어.", "en": "I took your glove and your letter from the gallery. I hid them behind the photograph. I never read it."}, {"id": "g7_3", "sp": "Green", "spe": "Green", "ko": "나를 위해 숨긴 거로군. 그래, 그랬겠지. 우리는 늘 서로에게 이래 왔어.", "en": "You hid them for me. Of course you did. We have always done this to each other."}, {"id": "g7_4", "sp": "빅그베", "spe": "BGB", "ko": "왜 탑에 갔어, Green? 왜 그 사람이랑 싸웠어?", "en": "Why did you go to the tower, Green? Why did you fight him?"}, {"id": "g7_5", "sp": "Green", "spe": "Green", "ko": "에드워드가 자정에 모두가 보는 앞에서 진짜 기록을 읽겠다고 했어. 이름도, 회의도, 전부.", "en": "Edward told me he would read the true record at midnight, in front of everyone. The names, the council, all of it."}, {"id": "g7_6", "sp": "Green", "spe": "Green", "ko": "내가 이름을 되찾고 싶어서 그랬다고 생각해? 그 사람이 네 삶을 통째로 흔들어 놓았을 거야.", "en": "You think I wanted the name back? He'd have taken your life apart."}, {"id": "g7_7", "sp": "Green", "spe": "Green", "ko": "나는 그 사람을 막고 싶었을 뿐이야. 떨어뜨릴 생각은 없었어.", "en": "I wanted to stop him. I did not mean for him to fall."}, {"id": "g7_8", "sp": "빅그베", "spe": "BGB", "ko": "에드워드의 마지막 말은 시계에 대한 거였어. 멈춘 그 시계가 아닐지도 몰라. 내가 이미 아는 것들을 다시 맞춰 보자.", "en": "Edward's last words were about a clock. Not the one that stopped, maybe. I should look at what I already know."}, {"id": "g7_9", "sp": "Green", "spe": "Green", "ko": "가서 그 사람이 남긴 걸 찾아. 나는 여기 있을게.", "en": "Go and find what he left. I will be here."}, {"id": "rec0", "sp": "빅그베", "spe": "BGB", "ko": "추 뒤에 좁은 상자가 있다. 안에는 접힌 장부와 에드워드의 글씨로 쓴 종이들이 있다.", "en": "Behind the pendulum there is a narrow case. Inside, a folded register and pages in Edward's hand."}, {"id": "r0", "sp": "에드워드(기록 속 목소리)", "spe": "Edward (written)", "ko": "나는 벨 의회의 서기이자 기록관인 에드워드 벨이다. 이 종이의 첫 이름은 내 것이고, 책임도 내가 가장 먼저 진다.", "en": "My name is Edward Bell, Archivist and Clerk of the Bell Council. I am the first name on this page, and I am the first to blame."}, {"id": "r1", "sp": "에드워드(기록 속 목소리)", "spe": "Edward (written)", "ko": "23년 전, 아이의 목도리가 경보 종을 막았고 강이 뱃사공 한 사람을 데려갔다. 사흘째 밤, 시장과 종지기 어른, 그때의 치료사, 몰리, 그리고 나는 닫힌 문 뒤에 앉아 있었다.", "en": "23 years ago a child's scarf jammed the warning bell, and the river took a boatman. On the third night the Mayor, the Bell-warden, the Healer of that time, Molly and I sat behind a closed door."}, {"id": "r2", "sp": "에드워드(기록 속 목소리)", "spe": "Edward (written)", "ko": "마을은 종이 울리지 않은 일에 이름을 붙이길 원했다. 그 목도리가 누구 것인지는 나만 알았다. 몸이 약한 동생의 것이었고, 그 아이는 성벽 밖에서 살아남지 못할 것이었다.", "en": "The village wanted a name for the silence of the bell. Only I knew whose scarf it was: the younger boy's, the sick one, who would not survive being put outside the walls."}, {"id": "r3", "sp": "에드워드(기록 속 목소리)", "spe": "Edward (written)", "ko": "그래서 우리는 두 아이의 이름을 맞바꿨다. 군중이 영웅이라 부른 아이는 빅그린베어가 되었고, 다른 아이는 Green이 되었다. 장부는 내가 썼다. 내 손이 없으면 어떤 기록도 효력이 없다. 나는 거절할 수 있었지만 하지 않았다.", "en": "So we exchanged their names. The cub the crowd called a hero became Big Green Bear, and the other became Green. I wrote the entries. No entry is valid without my hand. I could have refused, and I did not."}, {"id": "r4", "sp": "에드워드(기록 속 목소리)", "spe": "Edward (written)", "ko": "나는 큰아이에게 마을이 가라앉을 때까지만이라고 약속했다. 바로잡겠다고 약속했다. 23년 동안 그러지 않았다.", "en": "I promised the elder it was only until the village calmed. I promised to put it right. I did not, for 23 years."}, {"id": "r5", "sp": "에드워드(기록 속 목소리)", "spe": "Edward (written)", "ko": "시장은 죄를 질 사람을 요구했다. 종지기 어른은 종지기들이 책임질까 두려워했다. 치료사는 동생이 추방되면 죽는다고 했다. 몰리는 \"그럼 그대로 믿게 두자\"고 했다. 나는 동의했고, 썼다. 이름은 여기에 적었고, 내 이름이 첫째다.", "en": "The Mayor demanded a culprit. The Bell-warden feared for the wardens. The Healer said the younger would die in exile. Molly said, \"Then let them go on believing it.\" I consented, and I wrote. Their names are here, and mine is first."}, {"id": "r6", "sp": "에드워드(기록 속 목소리)", "spe": "Edward (written)", "ko": "니니, 열쇠는 이제 네 것이다. 자정에 진짜 기록을 읽어라. 늙은 겁쟁이를 용서해라. E.", "en": "Nini, the keys are yours. Read the true entry at midnight. Forgive an old coward. E."}, {"id": "rec1", "sp": "빅그베", "spe": "BGB", "ko": "그분은 우리 둘에게 먼저 이 탑에서 말하고, 자정에 모두 앞에서 읽으려 했어. 편지 두 통은 그래서 쓴 거였어.", "en": "He wanted to tell us both first, here at the tower, and read it aloud at midnight. That is what the two letters were for."}, {"id": "rec2", "sp": "빅그베", "spe": "BGB", "ko": "오늘 밤 추모의 종이 울리기 전에 마을 사람들이 탑 광장에 모여. 이걸 들고 거기로 가야 해.", "en": "Tonight, before the Remembrance Bell, the village gathers at the tower plaza. I have to bring this there."}, {"id": "rec9", "sp": "빅그베", "spe": "BGB", "ko": "상자는 비어 있어. 에드워드가 남긴 건 이제 다 기록에 있어.", "en": "The case is empty now. Everything Edward left is in the Record."}, {"id": "c7_nocase", "sp": "빅그베", "spe": "BGB", "ko": "여기서는 아직 더 찾을 게 없어.", "en": "There is nothing more to find here yet."}, {"id": "acc_open", "sp": "니니", "spe": "Nini", "ko": "모두 모였어요. 에드워드 아저씨의 기록에 쓰인 대로이지만, 마을은 아저씨가 어떻게 아는지 알고 싶어 할 거예요. 보여 주세요, 아저씨.", "en": "Everyone is here. Edward's Record says what it says, but the village will want to know how you know. Show us, Mr. Bear."}, {"id": "acc_q1", "sp": "니니", "spe": "Nini", "ko": "먼저요. 누가 에드워드 아저씨를 떨어뜨렸나요? 무엇이 증명하는지 보여 주세요.", "en": "First. Who caused Edward's fall? Show us what proves it."}, {"id": "acc_q2", "sp": "니니", "spe": "Nini", "ko": "올리버 씨가 오기 전에 누가 에드워드 아저씨 곁에 있었나요? 보여 주세요.", "en": "Who was with Edward before Oliver arrived? Show us."}, {"id": "acc_q3", "sp": "니니", "spe": "Nini", "ko": "탑에 장갑도 편지도 없었던 건 왜인가요?", "en": "Why were there no glove and no letter at the tower?"}, {"id": "acc_q4", "sp": "니니", "spe": "Nini", "ko": "종이 울리기 전까지 에드워드 아저씨는 얼마나 혼자였나요?", "en": "How long was Edward alone before the bell?"}, {"id": "acc_q5", "sp": "니니", "spe": "Nini", "ko": "그리고 이 모든 일은 왜 시작됐나요? 장부에 무슨 문제가 있나요?", "en": "And why did any of this begin? What is wrong with the register?"}, {"id": "acc_r1a", "sp": "니니", "spe": "Nini", "ko": "그럼 Green 씨가 탑에 있었군요.", "en": "Then Green was at the tower."}, {"id": "acc_r1b", "sp": "Green", "spe": "Green", "ko": "있었어. 떨어뜨린 건 나야. 죽은 줄 알고 달아났어.", "en": "I was. I caused the fall. I thought he was dead, and I ran."}, {"id": "acc_r2a", "sp": "올리버", "spe": "Oliver", "ko": "제가 왔을 때 당신이 그의 곁에 무릎을 꿇고 있었습니다. 그의 주먹에는 이미 노란 털실이 쥐어져 있었어요.", "en": "I found you kneeling by him, Mr. Bear, with yellow wool already in his fist."}, {"id": "acc_r2b", "sp": "빅그베", "spe": "BGB", "ko": "나였어요. 그는 살아 있었고, 내가 곁에 있었어요.", "en": "It was me. He was alive, and I was with him."}, {"id": "acc_r3a", "sp": "빅그베", "spe": "BGB", "ko": "내가 가져갔어요. Green의 장갑과 에드워드의 편지를요. 집의 사진 뒤에 숨겼어요.", "en": "I took them. Green's glove and Edward's letter. I hid them behind the photograph at home."}, {"id": "acc_r4a", "sp": "토미", "spe": "Tommy", "ko": "11시 51분에 \"부르는 소리? 바람?\"이라고 적었습니다. 바람 소리라고 생각했습니다.", "en": "At 11:51 I wrote \"calling? wind?\" I took it for wind."}, {"id": "acc_r4b", "sp": "빅그베", "spe": "BGB", "ko": "5분쯤이요. 11시 55분에 손종을 울렸어요.", "en": "About 5 minutes. I rang the handbell at 11:55."}, {"id": "acc_r4c", "sp": "올리버", "spe": "Oliver", "ko": "치료사는 5분이 무언가를 바꿨을지 아무도 말할 수 없다고 합니다. 아무도 알 수 없는 일을 적지는 않겠습니다.", "en": "The Healer says no one can tell whether 5 minutes would have changed anything. We will not write what no one can know."}, {"id": "acc_r5a", "sp": "니니", "spe": "Nini", "ko": "에드워드 아저씨는 회의가 두 아이의 이름을 맞바꿨고, 자신이 그걸 적었다고 써 놓았어요.", "en": "Edward writes that the council exchanged the twins' names, and that he wrote it down."}, {"id": "acc_r5b", "sp": "몰리", "spe": "Molly", "ko": "내가 말했어. \"그럼 그대로 믿게 두자\"고. 23년 동안 입을 다물고 있었지.", "en": "I said it. \"Then let them go on believing it.\" I have kept quiet for 23 years."}, {"id": "cc0", "sp": "니니", "spe": "Nini", "ko": "이제 기록이에요. 아저씨, 무엇을 적을까요?", "en": "Now the Record. Mr. Bear, what goes into it?", "ch": [{"ko": "전부 적어 줘. 우리가 각자 한 일과 이름이 바뀐 일까지.", "en": "Everything. What each of us did, and the swap."}, {"ko": "사고로 적어 줘.", "en": "Record it as an accident."}, {"ko": "Green이 했어. Green 혼자.", "en": "Green did it. Only Green."}, {"ko": "태워 버려.", "en": "Burn it."}]}, {"id": "e1_go", "sp": "빅그베", "spe": "BGB", "ko": "전부 기록에 남기고 싶어.", "en": "I want all of it in the Record."}, {"id": "e1_no", "sp": "니니", "spe": "Nini", "ko": "보여 줄 수 없는 건 적을 수 없어요. 아직 보여 주지 못한 게 있어요. 사건 파일을 다시 살펴봐요.", "en": "We cannot write what we cannot show. There is still something we have not shown. Look through the Case File again."}, {"id": "e1_0", "sp": "빅그베", "spe": "BGB", "ko": "11시 50분에 살아 있는 에드워드를 발견했어요. 장갑과 편지를 숨겼고, 종을 울리기까지 5분을 기다렸어요.", "en": "I found Edward alive at 11:50. I hid the glove and the letter, and I waited 5 minutes before I rang the bell."}, {"id": "e1_1", "sp": "Green", "spe": "Green", "ko": "떨어뜨린 건 나야. 죽은 줄 알고 달아났어.", "en": "I caused the fall. I believed he was dead, and I ran."}, {"id": "e1_2", "sp": "니니", "spe": "Nini", "ko": "이름은 23년 전에 바뀌었어요. 제가 원래대로 되돌려 적을게요.", "en": "The names were exchanged 23 years ago. I will write them back as they were."}, {"id": "e1_3", "sp": "니니", "spe": "Nini", "ko": "기록에는 두 분이 각자 한 일을 적을 거예요. 그리고 11시 50분에 도움이 있었다면 살았을지는 아무도 알 수 없다는 것도 적을 거예요.", "en": "The Record will say what each of you did. It will also say that no one can know whether help at 11:50 would have saved him."}, {"id": "e2_0", "sp": "빅그베", "spe": "BGB", "ko": "사고로 적어 줘. 그분은 종을 지킨 사람으로 기억되게 해 줘.", "en": "Record it as an accident. Let him be remembered as the man who kept the bell."}, {"id": "e2_1", "sp": "니니", "spe": "Nini", "ko": "...아저씨가 그렇게 원하신다면요.", "en": "...If that is what you ask, Mr. Bear."}, {"id": "e3_0", "sp": "빅그베", "spe": "BGB", "ko": "Green이 했어. 그의 이름만 적어 줘.", "en": "Green did it. Write his name, and only his."}, {"id": "e3_1", "sp": "Green", "spe": "Green", "ko": "...그렇군. 그럼 마을이 늘 말하던 그대로네.", "en": "...I see. Then it is as the village always said."}, {"id": "e4_0", "sp": "빅그베", "spe": "BGB", "ko": "태워 버려. 전부.", "en": "Burn it. All of it."}, {"id": "e4_1", "sp": "니니", "spe": "Nini", "ko": "...아저씨.", "en": "...Mr. Bear."}, {"id": "ce7_1_0", "sp": "빅그베", "spe": "BGB", "ko": "다 적혔어. 에드워드의 이름, 내 이름, Green의 이름도 제자리에. 되돌릴 수 있는 건 없어.", "en": "It is all written down: Edward's name, mine, Green's, each in its place. Nothing can be undone."}, {"id": "ce7_1_1", "sp": "빅그베", "spe": "BGB", "ko": "그래도 이제 사실은 남아 있어.", "en": "But now the truth stays with us."}, {"id": "ce7_2_0", "sp": "빅그베", "spe": "BGB", "ko": "사고로 적혔어. 마을은 조용해졌고, 나는 여전히 영웅이야.", "en": "It is recorded as an accident. The village is quiet, and I am still the hero."}, {"id": "ce7_2_1", "sp": "빅그베", "spe": "BGB", "ko": "사진은 뒤집어 보지 않은 채 선반에 기대어 있어.", "en": "The photograph still leans on the shelf, unturned."}, {"id": "ce7_3_0", "sp": "빅그베", "spe": "BGB", "ko": "장부에는 Green의 이름만 남았어. 그가 끌려가는 걸 보며 내 손이 목도리 매듭을 더듬었어.", "en": "Only Green's name is left on the page. I watched him go, and my hand found the knot of my scarf."}, {"id": "ce7_4_0", "sp": "빅그베", "spe": "BGB", "ko": "종이는 재가 됐어. 이름은 바뀐 채 남고, 진실은 사라졌어.", "en": "The page turned to ash. The names stay swapped, and the truth is gone."}]}], "common": {"small": [{"sp": "토미", "ko": "안녕하십니까. 오늘도 눈이 많이 옵니다.", "en": "Evening. Snow again tonight."}, {"sp": "토미", "ko": "추운 밤입니다. 다리는 제가 지키겠습니다.", "en": "A cold night for a walk. I'll keep watch on the bridge."}, {"sp": "토미", "ko": "다리 위 얼음을 조심하십시오.", "en": "Mind the ice on the bridge."}, {"sp": "헤이즐", "ko": "또 오셨네요. 주전자는 늘 불 위에 있어요.", "en": "Hello again. The kettle's on if you need it."}, {"sp": "헤이즐", "ko": "오늘도 눈이 많이 오네요.", "en": "Snowing hard again, isn't it?"}, {"sp": "헤이즐", "ko": "언제든 들르세요. 차는 따뜻하게 준비해 둘게요.", "en": "Come by any time. I'll keep a cup warm."}, {"sp": "올리버", "ko": "음. 오늘도 눈이 많이 옵니다.", "en": "Mm. More snow tonight."}, {"sp": "올리버", "ko": "음. 바람이 또 덧문 사이로 웁니다.", "en": "Mm. The wind is up in the louvres again."}, {"sp": "니니", "ko": "안녕하세요, 아저씨! 얼음 조심하세요.", "en": "Hello, Mr. Bear! Mind the ice."}, {"sp": "니니", "ko": "으, 오늘도 정말 추워요!", "en": "Brr, it's so cold today!"}, {"sp": "몰리", "ko": "흥, 오늘도 눈이 많이 왔군.", "en": "Hmph. Another snowy day."}, {"sp": "몰리", "ko": "쯧쯧. 이런 데 서 있다간 얼어 죽겠다.", "en": "Tsk. You'll catch your death out here."}], "follow": [{"sp": "올리버", "ko": "음. 더 물어보실 것이 있습니까?", "en": "Mm. Is there anything else you wish to ask?"}, {"sp": "올리버", "ko": "음. 더 하실 말씀이 있습니까?", "en": "Mm. Anything more?"}, {"sp": "헤이즐", "ko": "더 궁금한 게 있으세요?", "en": "Is there anything else you'd like to ask?"}, {"sp": "헤이즐", "ko": "더 얘기할 게 있으신가요?", "en": "Anything else on your mind?"}, {"sp": "토미", "ko": "더 필요하신 것이 있습니까?", "en": "Is there anything more you need?"}, {"sp": "토미", "ko": "더 물어보실 것이 있습니까?", "en": "Anything else you would like to know?"}, {"sp": "니니", "ko": "더 물어볼 게 있어요?", "en": "Is there anything else you want to ask?"}, {"sp": "니니", "ko": "더 얘기할 게 있으세요, 아저씨?", "en": "Anything else, Mr. Bear?"}, {"sp": "몰리", "ko": "늙은이한테 더 들을 게 있나?", "en": "Anything else you want from an old woman?"}, {"sp": "Green", "ko": "물어볼 건 그게 다야?", "en": "Is that all you came to ask?"}, {"sp": "치료사", "ko": "더 물으실 것이 있습니까?", "en": "Is there anything else you would like to ask?"}, {"sp": "def", "ko": "더 있어?", "en": "Anything else?"}], "gates": [{"ko": "아직 이곳은 들어갈 수 없다. 계단의 곰에 대해 시계지기 올리버와 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Clockkeeper Oliver about the bear on the stairs."}, {"ko": "아직 이곳은 들어갈 수 없다. 계단의 곰에 대해 시계탑으로 가 보면 단서를 더 찾을 수 있을 것 같다.", "en": "I can't go in there yet. Going back to the clock tower might turn up more clues about the bear on the stairs."}, {"ko": "아직 이곳은 들어갈 수 없다. 어젯밤 곰이 한 마리였는지에 대해 헤이즐과 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Hazel about whether there was only one bear last night."}, {"ko": "아직 이곳은 들어갈 수 없다. 곰이 한 마리였는지에 대해 헤이즐의 카페로 가 보면 힌트를 찾을 수 있을 것 같다.", "en": "I can't go in there yet. Whether there was only one bear might be answered at Hazel's café."}, {"ko": "아직 이곳은 들어갈 수 없다. 다리를 건넌 곰에 대해 마을의 순찰 초소로 가 보면 힌트를 찾을 수 있을 것 같다.", "en": "I can't go in there yet. The patrol post in the village might tell me about the bear on the bridge."}, {"ko": "아직 이곳은 들어갈 수 없다. 오른손에 든 물건에 대해 시계지기 올리버와 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Clockkeeper Oliver about what the bear carried in his right hand."}, {"ko": "아직 이곳은 들어갈 수 없다. 낡은 방앗간의 열쇠에 대해 니니와 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Nini about the key to the Old Mill."}, {"ko": "아직 이곳은 들어갈 수 없다. 에드워드의 일에 대해 시계지기 올리버와 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Clockkeeper Oliver about what happened to Edward."}, {"ko": "아직 이곳은 들어갈 수 없다. 에드워드가 쓰러진 순간에 대해 Green과 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Green about the moment Edward fell."}, {"ko": "아직 이곳은 들어갈 수 없다. 에드워드의 마지막 모습에 대해 시계지기 올리버와 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Clockkeeper Oliver about Edward's last moments."}, {"ko": "아직 이곳은 들어갈 수 없다. 에드워드가 쓰러진 순간에 대해 Green과 더 이야기를 나눠 보자.", "en": "I can't go in there yet. Let me talk more with Green about the moment Edward fell."}], "endings": [{"t": "결말 E1 마지막 기록", "ko": "이름이 제자리로 돌아간다. 기록에는 두 사람이 각자 한 일이 적히고, 아무도 알 수 없는 일은 알 수 없다고 적힌다. 탑시계는 11시 48분에 다시 움직인다. 니니가 기록을 쓴다. 사진 속 두 아이의 이름이 바르게 적힌다.", "en": "The names go back where they belong. The Record states what each of them did, and says plainly what no one can know. The tower clock is restarted at 11:48. Nini writes the Record. In the photograph, the two cubs carry the right names."}, {"t": "결말 E2 영웅의 침묵", "ko": "마을은 조용히 애도한다. Green은 방앗간으로 돌아간다. 시계는 고쳐지고 종은 울린다. 계단의 얼룩만은 남는다. 사진은 그대로 선반에 기대어 있다.", "en": "The village mourns calmly. Green goes back to the Mill. The clock is repaired and the bell rings. Only a stain on the stair stays. The photograph still leans on the shelf."}, {"t": "결말 E3 틀린 곰", "ko": "Green은 끌려간다. 장부는 마을에 유리하게 고쳐진다. 마지막 장면은 빅그베의 목도리 매듭이다.", "en": "Green is taken away. The register is corrected in the village's favor. The last frame is the knot of BGB's scarf."}, {"t": "결말 E4 불탄 페이지", "ko": "진실은 사라진다. 이름은 바뀐 채로 남는다. 니니는 한 장만 몰래 간직한다.", "en": "The truth is lost. The names stay exchanged. Nini keeps a single page."}], "acc": [{"q": "먼저요. 누가 에드워드 아저씨를 떨어뜨렸나요? 무엇이 증명하는지 보여 주세요.", "qe": "First. Who caused Edward's fall? Show us what proves it.", "opts": [{"ko": "Green이에요. 본인의 진술과 뒷문에서 이어진 발자국, 구부러진 추 막대가 모두 그를 가리켜요.", "en": "Green. His own account, the boot prints from the back door and the bent pendulum all point to him.", "ok": true}, {"ko": "올리버 씨예요. 그날 밤 탑에 있던 건 그분뿐이잖아요.", "en": "Oliver. He was the only one in the tower that night.", "ok": false}, {"ko": "아무도 아니에요. 걸쇠가 헐거웠으니 그냥 사고예요.", "en": "No one. The latch was loose, so it was just an accident.", "ok": false}]}, {"q": "올리버 씨가 오기 전에 누가 에드워드 아저씨 곁에 있었나요? 보여 주세요.", "qe": "Who was with Edward before Oliver arrived? Show us.", "opts": [{"ko": "Green이에요. 떨어진 뒤에 사다리로 내려갔어요.", "en": "Green. He climbed down the ladder after the fall.", "ok": false}, {"ko": "빅그베 아저씨예요. 에드워드의 주먹 속 털실이 그의 목도리였고, 녹은 물 자국이 그가 아래로 내려갔다고 말해 줘요.", "en": "BGB. His scarf wool was in Edward's fist, and the meltwater trail shows he went down to him.", "ok": true}, {"ko": "아무도 없었어요. 올리버 씨가 올 때까지 혼자였어요.", "en": "No one. Edward was alone until Oliver came.", "ok": false}]}, {"q": "탑에 장갑도 편지도 없었던 건 왜인가요?", "qe": "Why were there no glove and no letter at the tower?", "opts": [{"ko": "Green이 달아나면서 도로 가져갔어요.", "en": "Green took them back when he ran.", "ok": false}, {"ko": "처음부터 없었어요. 토미 씨의 일지가 틀렸어요.", "en": "They were never there. Tommy's log is wrong.", "ok": false}, {"ko": "빅그베 아저씨가 가져갔어요. 11:35에 Green은 장갑을 둘 다 끼고 종이를 들고 있었는데, 사진 뒤에서 그 장갑과 편지가 나왔어요.", "en": "BGB took them. Green wore both gloves and carried a paper at 11:35, and the pair was found hidden behind the photograph.", "ok": true}]}, {"q": "종이 울리기 전까지 에드워드 아저씨는 얼마나 혼자였나요?", "qe": "How long was Edward alone before the bell?", "opts": [{"ko": "약 5분이에요. 빅그베 아저씨가 11:50에 곁에 닿았고, 손종은 11:55에 울렸어요.", "en": "About 5 minutes. BGB reached him at 11:50, and the handbell rang at 11:55.", "ok": true}, {"ko": "한 시간이 넘어요. 치료사가 올 때까지 아무도 없었어요.", "en": "More than an hour. Nobody came until the Healer.", "ok": false}, {"ko": "전혀요. 아저씨는 도착하자마자 종을 울렸어요.", "en": "No time at all. BGB rang the bell the moment he arrived.", "ok": false}]}, {"q": "그리고 이 모든 일은 왜 시작됐나요? 장부에 무슨 문제가 있나요?", "qe": "And why did any of this begin? What is wrong with the register?", "opts": [{"ko": "문제없어요. 잉크가 두 가지인 건 옛 서기의 습관이에요.", "en": "Nothing is wrong. Two inks were just an old clerk's habit.", "ok": false}, {"ko": "회의가 쌍둥이의 이름을 맞바꿨고 에드워드가 그걸 적었어요. 두 가지 잉크와 봉인, 그의 기록이 그걸 보여 줘요.", "en": "The council swapped the twins' names and Edward wrote it down. The two inks, the seals and his Record show it.", "ok": true}, {"ko": "에드워드 혼자 자기 실수를 덮으려고 꾸몄어요.", "en": "Edward alone made it up to cover his own mistakes.", "ok": false}]}], "hints": [{"ko": "동생이 들보에 끼어 있어. 먼저 구하자.", "en": "My brother is wedged behind a beam. Help him first."}, {"ko": "이제 손종을 울리자. 왼쪽 손종 쪽으로 가.", "en": "Now ring the handbell, over on the left."}, {"ko": "종을 울렸어. 손종 옆 계단으로 올라가자.", "en": "The bell has rung. Climb the stairs beside it."}, {"ko": "마을 사람들의 말을 듣고, 에드워드를 지켜본 뒤 오른쪽 기록실 문으로 가 보자.", "en": "Listen to the villagers, watch Edward, then head for the Archive door on the right."}, {"ko": "이야기가 이어질 거야. 잠시 기다리자.", "en": "The story will go on. Wait a moment."}, {"ko": "에드워드에게 말을 걸어 보자.", "en": "Talk to Edward."}, {"ko": "마을 대문을 살펴보자.", "en": "Take a look at the village gate."}, {"ko": "시계탑 안으로 들어가 레버를 살펴보자.", "en": "Go into the clock tower and look at the lever."}, {"ko": "이야기가 이어질 거야. 잠시 기다리자.", "en": "The story will go on. Wait a moment."}, {"ko": "선반 위의 사진부터 보자.", "en": "Look at the photograph on the shelf first."}, {"ko": "이제 오른쪽 문으로 나가자.", "en": "Now out through the door on the right."}, {"ko": "한 가지 결말을 봤어. 다른 선택을 해 보고 싶으면 마을 광장의 니니에게 말을 걸어 봐.", "en": "I have seen one ending. To choose differently, talk to Nini in the village plaza."}, {"ko": "마을 사람들이 시계탑 앞 광장에 모여 있어. 그리로 가자.", "en": "The village is gathering at the tower plaza. Let's go there."}, {"ko": "시계탑 안, 추 옆의 상자를 열어 보자.", "en": "Open the case next to the pendulum in the tower."}, {"ko": "에드워드의 마지막 말, '시계'. 사건 파일 조사 탭에서 결론을 확정해 보자.", "en": "Edward's last word was 'clock'. Confirm the conclusion in the Case File, under Investigate."}, {"ko": "먼저 방앗간의 Green에게 사실대로 말하자. 마을 맨 오른쪽이야.", "en": "First, tell Green the truth at the Old Mill, at the far right of the village."}, {"ko": "7장이 이어질 거야.", "en": "Chapter 7 comes next."}, {"ko": "니니가 나를 찾고 있어. 마을에서 니니와 이야기하자.", "en": "Nini is looking for me. Talk to her in the village."}, {"ko": "증거는 모였어. 사건 파일 조사 탭에서 결론을 확정하자.", "en": "I have the evidence. Confirm the conclusions in the Case File, under Investigate."}, {"ko": "책임 보드에 이름을 적자. 사건 파일 조사 탭이야.", "en": "Place the names on the Responsibility Board, under Investigate."}, {"ko": "Green에게 돌아가서 치료사가 한 말을 전하자. 방앗간이야.", "en": "Go back to Green at the Old Mill and tell him what the Healer said."}, {"ko": "치료사의 집에 가서 에드워드에 대해 묻자. 시계탑 왼쪽 옆이야.", "en": "Visit the Healer's house, just left of the clock tower, and ask about Edward."}, {"ko": "근거는 충분해. 사건 파일을 확인하자.", "en": "That should be enough. Check the Case File."}, {"ko": "방앗간의 Green에게 가서 그날 밤 이야기를 듣자.", "en": "Go to the Old Mill and hear Green's account of that night."}, {"ko": "사람 탭의 신원 보드에서 단서를 맞춰 보자.", "en": "Compare the clues on the Identity Board under People."}, {"ko": "기록관 안쪽에서 두 장의 사진을 맞춰 보자.", "en": "Line up the two photographs inside the Archive."}, {"ko": "기록관의 서랍을 열어 보자. 열쇠는 니니가 줬어.", "en": "Open the drawers in the Archive. Nini gave me the key."}, {"ko": "낡은 방앗간의 Green을 만나 보자. 마을 맨 오른쪽이야.", "en": "Meet Green at the Old Mill, at the far right of the village."}, {"ko": "니니와 서랍 열쇠에 대해 이야기하자.", "en": "Talk to Nini about the drawer key."}, {"ko": "헤이즐에게 어젯밤 일에 대해 다시 물어보자.", "en": "Ask Hazel again about last night."}, {"ko": "카페의 헤이즐에게 가 보자. 기록실 오른쪽이야.", "en": "Visit Hazel at the café, to the right of the Archive."}, {"ko": "마을의 순찰 초소에서 토미의 일지를 읽어 보자.", "en": "Read Tommy's logbook at the patrol post in the village."}, {"ko": "올리버에게 다시 말을 걸어서 '자신의 손을 내려다본다'를 골라 보자.", "en": "Talk to Oliver again and choose to glance at my own hands."}, {"ko": "모은 증언을 사건 파일에서 맞춰 보자.", "en": "Compare the statements in the Case File."}, {"ko": "먼저 시계탑으로 가자. 마을 가운데 있는 큰 탑이야.", "en": "Head for the clock tower first, the tall tower in the middle of the village."}, {"ko": "시계지기 올리버와 이야기하자.", "en": "Talk to Oliver, the Clockkeeper."}, {"ko": "탑 안을 더 조사하자. 시계, 해치, 발자국, 손종, 추를 살펴봐.", "en": "Look around the tower more: the clock, the hatch, the footprints, the handbell, the pendulum."}]}}</script>
<script>
const DATA=JSON.parse(document.getElementById("data").textContent);
const COMMON_TITLE={small:"인사 (퀘스트가 없을 때 한 줄)",follow:"되묻기 (선택지 답변 뒤)",gates:"막힌 곳 안내 (빅그베 혼잣말)",hints:"다음 할 일 안내 (빅그베를 누르거나 목표가 바뀔 때)",acc:"7장 증거 제시 질문과 선택지",endings:"결말 카드 문장"};
const tabs=[...DATA.chs.map((c,i)=>({k:"c"+i,t:c.num==="프롤로그"?c.num:c.num,sub:c.title})),{k:"common",t:"공통",sub:""}];
let cur=0,lang="ko";
try{lang=localStorage.getItem("sl")||"ko"}catch(e){}
const $=id=>document.getElementById(id);
function pick(o){return lang==="ko"?o.ko:lang==="en"?o.en:o.ko+"\n"+o.en}
function textChap(c){let s="## "+c.num+" "+c.title+"\n\n";c.rows.forEach(r=>{const w=lang==="en"?r.spe:r.sp;s+=w+": "+(lang==="en"?r.en:r.ko)+(lang==="both"?"\n   "+r.en:"")+"\n";if(r.ch)r.ch.forEach((h,i)=>s+="   - "+(i+1)+") "+(lang==="en"?h.en:h.ko)+"\n")});return s}
function textCommon(){const C=DATA.common;let s="## 공통 대사\n\n";
 [["small","인사"],["follow","되묻기"]].forEach(([k,t])=>{s+="### "+t+"\n";C[k].forEach(r=>s+=r.sp+": "+pick(r).replace("\n"," / ")+"\n");s+="\n"});
 [["gates","막힌 곳 안내"],["hints","다음 할 일 안내"]].forEach(([k,t])=>{s+="### "+t+"\n";C[k].forEach(r=>s+="- "+pick(r).replace("\n"," / ")+"\n");s+="\n"});
 s+="### 7장 증거 제시\n";C.acc.forEach(a=>{s+=(lang==="en"?a.qe:a.q)+"\n";a.opts.forEach(o=>s+="   - "+(o.ok?"(정답) ":"")+(lang==="en"?o.en:o.ko)+"\n")});
 s+="\n### 결말 카드\n";C.endings.forEach(e=>s+=e.t+": "+(lang==="en"?e.en:e.ko)+"\n");return s}
function allText(){return DATA.chs.map(textChap).join("\n")+"\n"+textCommon()}
function esc(x){return x.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function line(r){const w=lang==="en"?r.spe:r.sp;let h='<div class="line"><div class="who'+(r.sp==="빅그베"?" b":"")+'">'+esc(w)+'</div><div class="txt">';
 if(lang==="both")h+=esc(r.ko)+'<span class="en">'+esc(r.en)+'</span>';else h+=esc(lang==="en"?r.en:r.ko);
 h+='<span class="id">'+r.id+'</span>';
 if(r.ch)h+='<ul class="ch">'+r.ch.map(c=>'<li>'+esc(lang==="en"?c.en:c.ko)+(lang==="both"?' <span style="color:var(--mute)">'+esc(c.en)+'</span>':'')+'</li>').join("")+'</ul>';
 return h+'</div></div>'}
function simple(r){return '<div class="line"><div class="who">'+esc(r.sp||"")+'</div><div class="txt">'+(lang==="both"?esc(r.ko)+'<span class="en">'+esc(r.en)+'</span>':esc(lang==="en"?r.en:r.ko))+'</div></div>'}
function render(){
 document.querySelectorAll("#tabs .tab").forEach((b,i)=>b.setAttribute("aria-selected",i===cur));
 document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 const v=$("view");
 if(cur<DATA.chs.length){const c=DATA.chs[cur];v.innerHTML='<section class="chap"><h2>'+c.num+" · "+c.title+'</h2><div class="meta">대사 '+c.rows.length+'개</div>'+c.rows.map(line).join("")+'</section>';$("copyChap").style.display=""}
 else{const C=DATA.common;let h='<section class="chap"><h2>공통 대사</h2>';
  [["small","small"],["follow","follow"]].forEach(([k])=>{h+='<div class="blk"><h3>'+COMMON_TITLE[k]+'</h3>'+C[k].map(simple).join("")+'</div>'});
  [["gates"],["hints"]].forEach(([k])=>{h+='<div class="blk"><h3>'+COMMON_TITLE[k]+'</h3>'+C[k].map(r=>simple({sp:"",ko:r.ko,en:r.en})).join("")+'</div>'});
  h+='<div class="blk"><h3>'+COMMON_TITLE.acc+'</h3>'+C.acc.map(a=>'<div class="line"><div class="who">니니</div><div class="txt">'+esc(lang==="en"?a.qe:a.q)+'<ul class="ch">'+a.opts.map(o=>'<li>'+(o.ok?'<span class="ok">(정답)</span> ':'')+esc(lang==="en"?o.en:o.ko)+'</li>').join("")+'</ul></div></div>').join("")+'</div>';
  h+='<div class="blk"><h3>'+COMMON_TITLE.endings+'</h3>'+C.endings.map(e=>'<div class="line"><div class="who">'+esc(e.t)+'</div><div class="txt">'+esc(lang==="en"?e.en:e.ko)+'</div></div>').join("")+'</div></section>';
  v.innerHTML=h;$("copyChap").style.display=""}
}
async function copy(btn,text,label){let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{ok=document.execCommand("copy")}catch(_){}ta.remove()}
 const o=btn.textContent;btn.textContent=ok?"복사했어요":"복사 실패: 직접 선택해 주세요";btn.classList.toggle("ok",ok);setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok")},1600)}
$("tabs").innerHTML=tabs.map((t,i)=>'<button class="tab" role="tab" data-i="'+i+'">'+t.t+(t.sub?' <span style="opacity:.75;font-weight:500">'+t.sub+'</span>':'')+'</button>').join("");
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;cur=+b.dataset.i;render();window.scrollTo(0,0)});
$("lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("sl",lang)}catch(_){}render()});
$("copyChap").onclick=e=>copy(e.target,cur<DATA.chs.length?textChap(DATA.chs[cur]):textCommon());
$("copyAll").onclick=e=>copy(e.target,allText());
render();
</script>
